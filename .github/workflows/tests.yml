name: tests

on: push

jobs:
  tests:
    # Python 3.9 runs on Ubuntu 24.04, as setup-python has no 3.9 for Ubuntu 26.04, which
    # `ubuntu-latest` now is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - run: pip install "coverage>=7.10"
      # Each plugin keeps its tests in dev/<plugin>/tests/ (.claude/rules/plugin.md).
      - run: |
          for tests in dev/*/tests; do
            plugin="${tests#dev/}"
            coverage run --source="${plugin%/tests}" -m unittest discover -s "$tests"
          done
      - run: coverage combine
      - run: coverage report
