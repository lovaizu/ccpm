name: tests

on: push

jobs:
  tests:
    # Users run 3.9; Cosmic Ray and Hypothesis need a newer Python only to test, not to run.
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r dev/requirements.txt
      - if: matrix.python == '3.x'
        run: pip install -r dev/requirements-test-quality.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: sh dev/check.sh
      - if: matrix.python == '3.x'
        run: sh dev/mutate.sh
