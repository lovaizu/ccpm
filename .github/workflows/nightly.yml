name: Nightly

# GitHub starts a scheduled run only from the workflow on the default branch, so the run checks out
# main and each branch an open pull request comes from, each that holds the checks.
on:
  schedule:
    # 03:00 in Japan, once the day's pushes are done.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          heads=$(gh pr list --repo "$REPO" --state open --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName')
          # Only a branch that holds dev/scripts/quality.sh has the checks this run starts.
          refs=$(for ref in main $heads; do
            gh api "repos/$REPO/contents/dev/scripts/quality.sh?ref=$ref" --silent 2>/dev/null \
              && echo "$ref"
          done | jq -R . | jq -cs 'unique')
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

  # Every check that runs on its own, over the whole, as the architecture best practice times them:
  # each check of Tests on the oldest Python and the newest, and on the newest, every mutant of
  # Lane's code and the property-based tests at their most inputs. A run over a push's lines misses
  # a test changed alone and a fault between parts that no one push changed together.
  check:
    needs: refs
    if: needs.refs.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
        python: ["3.9", "3.x"]
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked ${{ matrix.python == '3.x' && '--group test-quality' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - working-directory: dev/scripts
        run: |
          npm ci --ignore-scripts
          node node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: uv run --no-sync sh dev/scripts/check.sh
      - if: matrix.python == '3.x'
        run: uv run --no-sync sh dev/scripts/quality.sh

  prose:
    needs: refs
    if: needs.refs.outputs.refs != '[]'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: lovaizu/checks@9880b8247f74c50a51a526f178832422da33e493 # v0.1.6
