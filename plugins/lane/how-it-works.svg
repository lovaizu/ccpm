<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How lane works</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .file { fill: #1f2328; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .drift { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label, .file { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- while your AI builds the plugin -->
  <rect class="box" x="20" y="40" width="200" height="64" rx="30"/>
  <text class="name" x="120" y="68">your AI</text>
  <text class="kind" x="120" y="88">proposes and approves</text>

  <rect class="box" x="330" y="40" width="200" height="64" rx="0"/>
  <text class="name" x="430" y="68">lay.py</text>
  <text class="kind" x="430" y="88">lane's layer</text>

  <path class="line" d="M220,62 H330" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="275" y="54">proposal</text>
  <path class="line" d="M330,86 H220" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="275" y="104">print</text>

  <!-- your plugin, as lay.py writes it -->
  <rect class="frame" x="600" y="20" width="280" height="430" rx="10"/>
  <text class="frame-name" x="614" y="40">your plugin</text>
  <text class="file" x="618" y="72">agents/&lt;subagent&gt;.md</text>
  <text class="kind" x="740" y="90">each step with its lanes' sentences</text>
  <text class="file" x="618" y="124">hooks/lanes.json</text>
  <text class="kind" x="740" y="142">the lanes, as your AI approved them</text>
  <text class="file" x="618" y="176">hooks/hooks.json</text>
  <text class="kind" x="740" y="194">a hook for each subagent with lanes</text>

  <rect class="box" x="620" y="300" width="240" height="64" rx="0"/>
  <text class="name" x="740" y="328">hooks/lane/</text>
  <text class="kind" x="740" y="348">lane's guard</text>

  <path class="line" d="M530,72 H600" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="565" y="64">writes</text>

  <!-- on every run of the plugin -->
  <rect class="box" x="20" y="300" width="200" height="64" rx="30"/>
  <text class="name" x="120" y="328">subagent</text>
  <text class="kind" x="120" y="348">runs its steps</text>

  <rect class="box" x="330" y="300" width="200" height="64" rx="8"/>
  <text class="name" x="430" y="328">Claude Code</text>
  <text class="kind" x="430" y="348">runs the subagent's hook</text>

  <path class="line" d="M220,320 H330" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="275" y="312">a call</text>
  <path class="line" d="M530,320 H620" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="575" y="312">the call</text>
  <path class="line" d="M740,300 V206" marker-end="url(#arrow)"/>
  <text class="label" x="750" y="260">reads the lanes</text>
  <path class="line drift" d="M620,350 C560,420 260,420 160,364" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="400" y="436">on a drift: stopped, and told the step's sentence again</text>

  <!-- legend -->
  <rect class="box" x="20" y="150" width="40" height="22" rx="11"/>
  <text class="label" x="68" y="166">AI</text>
  <rect class="box" x="120" y="150" width="40" height="22" rx="0"/>
  <text class="label" x="168" y="166">lane's code</text>
  <rect class="box" x="20" y="190" width="40" height="22" rx="8"/>
  <text class="label" x="68" y="206">Claude Code</text>
</svg>
