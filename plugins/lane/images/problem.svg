<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The usual way and Lane, with the four problems marked</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="530"/>
  <rect class="frame" x="10" y="10" width="980" height="240" rx="8"/>
  <text class="frame-name" x="24" y="32">The usual way: the steps and the order in prompts, with a hook of your own</text>
  <rect class="box" x="40" y="60" width="160" height="60" rx="6"/>
  <text class="name" x="120" y="95">Skill</text>
  <rect class="box" x="420" y="60" width="160" height="60" rx="6"/>
  <text class="name" x="500" y="95">Subagent</text>
  <rect class="store" x="800" y="60" width="160" height="60" rx="6"/>
  <text class="name" x="880" y="95">CHANGELOG.md</text>
  <rect class="box" x="420" y="170" width="160" height="56" rx="6"/>
  <text class="name" x="500" y="203">Your hook</text>
  <rect class="box" x="800" y="170" width="160" height="56" rx="6"/>
  <text class="name" x="880" y="203">You</text>
  <path class="line" d="M200,78 L416,78" marker-end="url(#a)"/>
  <text class="label small mid halo" x="322" y="68">starts each, as it remembers</text>
  <path class="line dashed" d="M420,104 L204,104" marker-end="url(#a)"/>
  <text class="label small mid halo" x="322" y="124">“No more entries” read as more</text>
  <path class="line" d="M470,120 L470,166" marker-end="url(#a)"/>
  <text class="label small halo" x="460" y="148" text-anchor="end">a call it may not make</text>
  <path class="line" d="M530,170 L530,124" marker-end="url(#a)"/>
  <text class="label small start halo" x="540" y="148">refused</text>
  <path class="line dashed" d="M580,90 L796,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="688" y="80">another way: cat &gt;</text>
  <path class="line" d="M800,198 L584,198" marker-end="url(#a)"/>
  <text class="label small mid halo" x="692" y="188">checks you write and test</text>
  <circle class="lane" cx="214" cy="78" r="11"/>
  <text class="name" x="214" y="83">3</text>
  <circle class="lane" cx="214" cy="104" r="11"/>
  <text class="name" x="214" y="109">2</text>
  <circle class="lane" cx="610" cy="90" r="11"/>
  <text class="name" x="610" y="95">1</text>
  <circle class="lane" cx="786" cy="198" r="11"/>
  <text class="name" x="786" y="203">4</text>
  <rect class="frame" x="10" y="270" width="980" height="250" rx="8"/>
  <text class="frame-name" x="24" y="292">Lane</text>
  <rect class="box" x="40" y="320" width="160" height="60" rx="6"/>
  <text class="name" x="120" y="355">Skill</text>
  <rect class="box" x="420" y="320" width="160" height="60" rx="6"/>
  <text class="name" x="500" y="355">Subagent</text>
  <rect class="lane" x="40" y="440" width="540" height="56" rx="6"/>
  <text class="name" x="310" y="473">Lane</text>
  <rect class="box" x="800" y="440" width="160" height="56" rx="6"/>
  <text class="name" x="880" y="473">You</text>
  <path class="line" d="M200,350 L416,350" marker-end="url(#a)"/>
  <text class="label small mid halo" x="308" y="340">starts it</text>
  <path class="line" d="M120,440 L120,384" marker-end="url(#a)"/>
  <text class="label small start halo" x="130" y="416">each next start</text>
  <path class="line" d="M450,380 L450,436" marker-end="url(#a)"/>
  <text class="label small halo" x="440" y="416" text-anchor="end">its result, from a script run</text>
  <path class="line" d="M550,440 L550,384" marker-end="url(#a)"/>
  <text class="label small start halo" x="560" y="416">its step’s sentence</text>
  <path class="line" d="M800,468 L584,468" marker-end="url(#a)"/>
  <text class="label small mid halo" x="692" y="458">you approve the steps</text>
  <text class="label small mid halo" x="692" y="488">the checks laid for you</text>
  <circle class="lane" cx="120" cy="424" r="11"/>
  <text class="name" x="120" y="429">3</text>
  <circle class="lane" cx="450" cy="396" r="11"/>
  <text class="name" x="450" y="401">2</text>
  <circle class="lane" cx="550" cy="424" r="11"/>
  <text class="name" x="550" y="429">1</text>
  <circle class="lane" cx="786" cy="468" r="11"/>
  <text class="name" x="786" y="473">4</text>
</svg>
