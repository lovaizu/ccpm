<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Lane gives the main conversation the start due, stops any other, keeps it going, and has a subagent that gave no result started again</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <rect class="box" x="20" y="40" width="200" height="530" rx="6"/>
  <text class="name" x="120" y="305">Main conversation</text>
  <rect class="lane" x="620" y="40" width="160" height="530" rx="6"/>
  <text class="name" x="700" y="305">Lane</text>
  <rect class="box" x="1000" y="370" width="180" height="200" rx="6"/>
  <text class="name" x="1090" y="475">writer</text>
  <path class="line" d="M220,80 L616,80" marker-end="url(#a)"/>
  <text class="label small mid halo" x="420" y="70">writer’s end reaches it</text>
  <path class="line" d="M620,106 L224,106" marker-end="url(#a)"/>
  <text class="data mid halo" x="420" y="126">beside it: “Start `changelog:reviewer`.”</text>
  <path class="line" d="M220,180 L616,180" marker-end="url(#a)"/>
  <text class="label small mid halo" x="420" y="170">it starts changelog:writer again</text>
  <path class="line" d="M620,206 L224,206" marker-end="url(#a)"/>
  <text class="data mid halo" x="420" y="226">stopped, told: “Start `changelog:reviewer`.”</text>
  <path class="line" d="M220,280 L616,280" marker-end="url(#a)"/>
  <text class="label small mid halo" x="420" y="270">it would end its turn, no subagent running</text>
  <path class="line" d="M620,306 L224,306" marker-end="url(#a)"/>
  <text class="data mid halo" x="420" y="326">kept going once: “Start `changelog:reviewer`.”</text>
  <path class="line" d="M1000,400 L784,400" marker-end="url(#a)"/>
  <text class="label small mid halo" x="890" y="390">it would end, no result given</text>
  <path class="line" d="M780,426 L996,426" marker-end="url(#a)"/>
  <text class="data mid halo" x="890" y="446">kept going once: its last step</text>
  <path class="line" d="M1000,500 L784,500" marker-end="url(#a)"/>
  <text class="label small mid halo" x="890" y="490">it ends, still no result</text>
  <path class="line" d="M620,526 L224,526" marker-end="url(#a)"/>
  <text class="data mid halo" x="420" y="546">told: “Start `changelog:writer` again.”</text>
</svg>
