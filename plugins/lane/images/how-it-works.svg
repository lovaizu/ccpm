<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Lane works</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- boxes: a name each; lane's own parts shaded -->
  <rect class="box" x="20" y="30" width="180" height="56" rx="8"/>
  <text class="name" x="110" y="63">you</text>

  <rect class="box lane" x="430" y="30" width="180" height="56" rx="8"/>
  <text class="name" x="520" y="63">lay.py</text>

  <rect class="box" x="430" y="180" width="180" height="56" rx="8"/>
  <text class="name" x="520" y="213">your plugin's steps</text>

  <rect class="box" x="20" y="320" width="180" height="56" rx="8"/>
  <text class="name" x="110" y="353">a subagent</text>

  <rect class="box" x="430" y="320" width="180" height="56" rx="8"/>
  <text class="name" x="520" y="353">Claude Code</text>

  <rect class="box lane" x="830" y="320" width="200" height="56" rx="8"/>
  <text class="name" x="930" y="353">the check script</text>

  <rect class="box" x="20" y="470" width="180" height="56" rx="8"/>
  <text class="name" x="110" y="503">the orchestrator</text>

  <rect class="box lane" x="680" y="262" width="28" height="18" rx="4"/>
  <text class="label" x="716" y="276">parts of the Lane plugin</text>

  <!-- while you build your plugin -->
  <path class="line" d="M200,48 H430" marker-end="url(#arrow)"/>
  <text class="label mid" x="315" y="40">proposes the rules and the routes</text>
  <path class="line" d="M430,70 H200" marker-end="url(#arrow)"/>
  <text class="label mid" x="315" y="104">shows the new steps</text>

  <path class="line" d="M520,86 V180" marker-end="url(#arrow)"/>
  <text class="label" x="530" y="138">writes the sentence of each rule into its step</text>

  <path class="line" d="M610,58 H930 V320" marker-end="url(#arrow)"/>
  <text class="label mid" x="770" y="50">copies into your plugin</text>

  <!-- on each run of your plugin -->
  <path class="line" d="M160,320 L430,226" marker-end="url(#arrow)"/>
  <text class="label" x="130" y="262">reads its own step</text>

  <path class="line" d="M200,348 H430" marker-end="url(#arrow)"/>
  <text class="label mid" x="315" y="320">makes a tool call,</text>
  <text class="label mid" x="315" y="338">gives its result or ends</text>

  <path class="line" d="M610,348 H830" marker-end="url(#arrow)"/>
  <text class="label mid" x="725" y="320">sends each tool call</text>
  <text class="label mid" x="725" y="338">and each end of work</text>

  <path class="line" d="M860,376 C700,446 360,446 190,376" marker-end="url(#arrow)"/>
  <text class="label mid" x="525" y="448">stops a break and shows the sentence again</text>

  <path class="line" d="M990,376 V498 H200" marker-end="url(#arrow)"/>
  <text class="label mid" x="600" y="490">tells which subagent to start next</text>

  <path class="line" d="M80,470 V376" marker-end="url(#arrow)"/>
  <text class="label" x="88" y="430">starts the subagent</text>
</svg>
