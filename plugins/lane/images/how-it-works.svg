<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Lane works: you approve your rules and routes, lay.py lays the checks into your plugin, and on a run the guard gives the main conversation only the start due, gives a subagent that leaves its steps the step's own sentence, counts a result only from the result script, and picks a run up from what your plugin kept</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="460"/>

  <rect class="box" x="20" y="64" width="150" height="60" rx="6"/>
  <text class="name" x="95" y="99">You</text>
  <path class="line" d="M95,124 V246" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="103" y="180">rules and routes,</text>
  <text class="label small halo start" x="103" y="195">once approved</text>
  <rect class="box" x="20" y="250" width="150" height="60" rx="6"/>
  <text class="name" x="95" y="276">lay.py</text>
  <text class="kind" x="95" y="296">print, then write</text>
  <path class="line" d="M170,280 L246,280" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="208" y="258">lays the</text>
  <text class="label small halo mid" x="208" y="272">checks</text>
  <text class="quote start" x="20" y="340">“Each check is code to write and test.”</text>
  <text class="gets start" x="20" y="357">You approve. Lane lays them.</text>
  <text class="quote start" x="20" y="390">“Does whoever runs it need Lane?”</text>
  <text class="gets start" x="20" y="407">No. The checks lie in your plugin.</text>

  <rect class="frame" x="250" y="20" width="890" height="420" rx="8"/>
  <text class="frame-name start" x="264" y="44">your plugin, on a run of its skill</text>
  <text class="quote end" x="1126" y="44">“Does it check other work too?”</text>
  <text class="gets end" x="1126" y="61">Only the run, from the skill's call to its end.</text>

  <rect class="box" x="290" y="90" width="220" height="60" rx="6"/>
  <text class="name" x="400" y="116">Main conversation</text>
  <text class="kind" x="400" y="136">runs your skill</text>
  <text class="quote start" x="290" y="175">“It starts the wrong one.”</text>
  <text class="gets start" x="290" y="192">Only the start due goes.</text>

  <rect class="box" x="620" y="90" width="220" height="60" rx="6"/>
  <text class="name" x="730" y="116">Guard</text>
  <text class="kind" x="730" y="136">laid in your plugin</text>

  <rect class="store" x="930" y="90" width="200" height="60" rx="6"/>
  <text class="name" x="1030" y="116">Your plugin's record</text>
  <text class="kind" x="1030" y="136">the results it kept</text>
  <text class="quote start" x="930" y="175">“A stopped run starts over.”</text>
  <text class="gets start" x="930" y="192">It goes on from that record.</text>

  <rect class="box" x="620" y="320" width="220" height="60" rx="6"/>
  <text class="name" x="730" y="346">Subagent</text>
  <text class="kind" x="730" y="366">your steps, with their sentences</text>
  <text class="quote start" x="620" y="405">“A refusal sends it another way.”</text>
  <text class="gets start" x="620" y="422">It gets its step's own sentence.</text>

  <rect class="box" x="930" y="320" width="200" height="60" rx="6"/>
  <text class="name" x="1030" y="346">Result script</text>
  <text class="kind" x="1030" y="366">gives the result</text>
  <text class="quote start" x="930" y="405">“A reply passes for a result.”</text>
  <text class="gets start" x="930" y="422">Only the script's run counts.</text>

  <path class="line" d="M620,120 L514,120" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="567" y="100">the start due,</text>
  <text class="label small halo mid" x="567" y="114">no other</text>
  <path class="line" d="M470,150 V350 H616" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="478" y="250">starts the</text>
  <text class="label small halo start" x="478" y="264">subagent due</text>
  <path class="line" d="M730,150 V316" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="738" y="270">stops a call off its steps,</text>
  <text class="label small halo start" x="738" y="284">with the step's sentence</text>
  <path class="line" d="M840,350 L926,350" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="883" y="330">ends by</text>
  <text class="label small halo mid" x="883" y="344">running it</text>
  <path class="line" d="M1030,320 V230 H800 V154" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="915" y="224">the result</text>
  <path class="line" d="M930,120 L844,120" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="887" y="112">results</text>
</svg>
