<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 510">
  <title>How Lane works: Lane, installed beside your plugin, reads your plugin's rules and asks your adapters what only your plugin knows; on a run of your skill, its guard gives the main conversation only the starts due, gives a subagent that leaves its steps the step's own sentence, counts a step, an item, or a result only from the subagent's own run of Lane's commands, and picks a stopped run up from its record or from the results your plugin keeps</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
    <rect class="bg" x="0" y="0" width="1160" height="510"/>

  <rect class="box" x="20" y="90" width="200" height="60" rx="6"/>
  <text class="name" x="120" y="116">Your plugin's rules</text>
  <text class="kind" x="120" y="136">lane/rules.json</text>
  <text class="quote start" x="20" y="175">“Each check is code to write.”</text>
  <text class="gets start" x="20" y="192">You give a type and its values.</text>
  <text class="gets start" x="20" y="209">The type makes the check.</text>

  <rect class="box" x="20" y="250" width="200" height="60" rx="6"/>
  <text class="name" x="120" y="276">Your adapters</text>
  <text class="kind" x="120" y="296">what only your plugin knows</text>

  <rect class="frame" x="250" y="20" width="890" height="475" rx="8"/>
  <text class="frame-name start" x="264" y="44">a run of your plugin's skill</text>
  <text class="quote end" x="1126" y="44">“Does it check other work too?”</text>
  <text class="gets end" x="1126" y="61">Only the run, from the skill's call to its end.</text>

  <rect class="box" x="290" y="90" width="220" height="60" rx="6"/>
  <text class="name" x="400" y="116">Main conversation</text>
  <text class="kind" x="400" y="136">runs your skill</text>
  <text class="quote start" x="290" y="175">“It starts the wrong one,</text>
  <text class="quote start" x="290" y="191">or stops while one is due.”</text>
  <text class="gets start" x="290" y="208">Only the starts due go.</text>

  <rect class="box lane" x="620" y="90" width="220" height="60" rx="6"/>
  <text class="name" x="730" y="116">Guard</text>
  <text class="kind" x="730" y="136">Lane, beside your plugin</text>

  <rect class="store" x="930" y="90" width="200" height="60" rx="6"/>
  <text class="name" x="1030" y="116">Run record</text>
  <text class="kind" x="1030" y="136">its starts and results</text>
  <text class="quote start" x="930" y="175">“A stopped run starts over.”</text>
  <text class="gets start" x="930" y="192">It goes on from the record,</text>
  <text class="gets start" x="930" y="209">or from your kept results.</text>

  <rect class="box" x="620" y="330" width="220" height="60" rx="6"/>
  <text class="name" x="730" y="356">Subagent</text>
  <text class="kind" x="730" y="376">keeps your steps</text>
  <text class="quote start" x="620" y="415">“A refusal sends it another way.”</text>
  <text class="gets start" x="620" y="432">It gets its step's own sentence.</text>

  <rect class="box lane" x="930" y="330" width="200" height="60" rx="6"/>
  <text class="name" x="1030" y="356">Lane's commands</text>
  <text class="kind" x="1030" y="376">a step, an item, a result</text>
  <text class="quote start" x="930" y="415">“It says it did the step.”</text>
  <text class="gets start" x="930" y="432">Only its own call counts.</text>

  <path class="line" d="M120,90 V72 H700 V86" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="560" y="66">reads your rules</text>
  <path class="line" d="M220,280 H680 V154" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="560" y="272">asks what only your plugin knows</text>
  <path class="line" d="M620,120 L514,120" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="567" y="100">the starts due,</text>
  <text class="label small halo mid" x="567" y="114">no other</text>
  <path class="line" d="M400,214 V360 H616" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="408" y="330">starts the subagent due</text>
  <path class="line" d="M770,150 V326" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="778" y="230">stops a call off its step,</text>
  <text class="label small halo start" x="778" y="244">with the step's sentence</text>
  <path class="line" d="M840,360 L926,360" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="883" y="340">runs one</text>
  <path class="line" d="M1030,330 V270 H810 V154" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="930" y="264">the report</text>
  <path class="line" d="M840,120 L926,120" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="883" y="112">keeps</text>
</svg>
