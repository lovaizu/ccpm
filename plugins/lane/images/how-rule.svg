<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Lane makes a rule's sentence and its check from one type and its values</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="280"/>
  <rect class="box" x="30" y="50" width="200" height="56" rx="6"/>
  <text class="name" x="130" y="83">run_only</text>
  <text class="kind mid halo" x="130" y="126">a type of Lane’s</text>
  <rect class="box" x="30" y="180" width="200" height="56" rx="6"/>
  <text class="name" x="130" y="213">git log --oneline</text>
  <text class="kind mid halo" x="130" y="256">the value you give</text>
  <rect class="lane" x="330" y="110" width="140" height="70" rx="6"/>
  <text class="name" x="400" y="150">Lane</text>
  <path class="line" d="M230,78 L326,128" marker-end="url(#a)"/>
  <path class="line" d="M230,208 L326,162" marker-end="url(#a)"/>
  <rect class="store" x="580" y="40" width="390" height="56" rx="6"/>
  <text class="name" x="775" y="73">Step 2 of writer</text>
  <text class="data mid halo" x="775" y="120">… Run only `git log --oneline`.</text>
  <rect class="lane" x="580" y="170" width="390" height="56" rx="6"/>
  <text class="name" x="775" y="203">Check</text>
  <text class="data mid halo" x="775" y="250">stops git commit, shows “Run only `git log --oneline`.”</text>
  <path class="line" d="M470,130 L576,72" marker-end="url(#a)"/>
  <text class="label small mid halo" x="523" y="90">the sentence</text>
  <path class="line" d="M470,160 L576,196" marker-end="url(#a)"/>
  <text class="label small mid halo" x="523" y="196">the check</text>
</svg>
