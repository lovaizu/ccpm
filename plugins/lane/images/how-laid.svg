<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>lay.py write puts the checks into your plugin, so whoever runs it needs no Lane</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="300"/>
  <rect class="frame" x="10" y="10" width="560" height="280" rx="8"/>
  <text class="frame-name" x="24" y="32">Your computer</text>
  <rect class="lane" x="30" y="140" width="140" height="60" rx="6"/>
  <text class="name" x="100" y="175">Lane</text>
  <rect class="frame" x="210" y="40" width="340" height="230" rx="8"/>
  <text class="frame-name" x="224" y="62">changelog</text>
  <rect class="store" x="240" y="90" width="280" height="56" rx="6"/>
  <text class="name" x="380" y="123">Steps</text>
  <rect class="lane" x="240" y="180" width="280" height="56" rx="6"/>
  <text class="name" x="380" y="213">hooks/lane/</text>
  <path class="line" d="M170,170 L236,118" marker-end="url(#a)"/>
  <path class="line" d="M170,180 L236,206" marker-end="url(#a)"/>
  <text class="label small mid halo" x="100" y="128">lay.py write</text>
  <path class="line" d="M550,150 L626,150" marker-end="url(#a)"/>
  <text class="label small mid halo" x="588" y="140">installed</text>
  <rect class="frame" x="630" y="10" width="360" height="280" rx="8"/>
  <text class="frame-name" x="644" y="32">Whoever runs changelog</text>
  <rect class="store" x="660" y="90" width="300" height="56" rx="6"/>
  <text class="name" x="810" y="123">Steps</text>
  <rect class="lane" x="660" y="180" width="300" height="56" rx="6"/>
  <text class="name" x="810" y="213">hooks/lane/</text>
  <text class="label small mid halo" x="810" y="272">no Lane installed: hooks/lane/ checks each run</text>
</svg>
