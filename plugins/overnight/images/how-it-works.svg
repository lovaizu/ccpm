<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560">
  <title>How overnight keeps each piece from stopping by the usage limit, a wait for an answer, or the session closing</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
    <rect class="bg" x="0" y="0" width="1100" height="560"/>
  <rect class="box" x="20" y="290" width="160" height="70" rx="6"/>
  <text class="name mid" x="100" y="321" text-anchor="middle">You, the AI</text>
  <text class="kind mid" x="100" y="341" text-anchor="middle">hand over each piece</text>
  <rect class="frame" x="220" y="20" width="860" height="500" rx="8"/>
  <text class="frame-name start" x="234" y="42" text-anchor="start">overnight</text>
  <text class="label small start" x="234" y="62" text-anchor="start">keeps each piece from stopping by the usage limit, a wait for an answer, or the session closing</text>
  <rect class="unit" x="250" y="125" width="280" height="100" rx="10"/>
  <text class="frame-name mid" x="390" y="245" text-anchor="middle">Will it sit at a prompt no one answers?</text>
  <text class="frame-name mid" x="390" y="262" text-anchor="middle">Will it end when your session closes?</text>
  <text class="gets mid" x="390" y="279" text-anchor="middle">It needs no answer, and runs on without you</text>
  <rect class="box" x="270" y="140" width="240" height="70" rx="6"/>
  <text class="name mid" x="390" y="168" text-anchor="middle">Starts the piece</text>
  <text class="kind mid" x="390" y="186" text-anchor="middle">apart from your session, with</text>
  <text class="kind mid" x="390" y="201" text-anchor="middle">its tools and folder up front</text>
  <text class="frame-name mid" x="820" y="100" text-anchor="middle">Can it do more than you let it?</text>
  <text class="gets mid" x="820" y="117" text-anchor="middle">No: only the tools you named, on its branch</text>
  <rect class="unit" x="680" y="125" width="280" height="100" rx="10"/>
  <rect class="box" x="700" y="140" width="240" height="70" rx="6"/>
  <text class="name mid" x="820" y="168" text-anchor="middle">The piece runs</text>
  <text class="kind mid" x="820" y="188" text-anchor="middle">in its own Git worktree and branch</text>
  <rect class="unit" x="680" y="365" width="280" height="100" rx="10"/>
  <text class="frame-name mid" x="820" y="485" text-anchor="middle">Will the work stop at the usage limit?</text>
  <text class="gets mid" x="820" y="502" text-anchor="middle">It goes on after each reset</text>
  <rect class="box" x="700" y="380" width="240" height="70" rx="6"/>
  <text class="name mid" x="820" y="408" text-anchor="middle">Waits for the reset</text>
  <text class="kind mid" x="820" y="428" text-anchor="middle">then goes on in its conversation</text>
  <path class="store" d="M270,394 A120,9 0 0 1 510,394 V446 A120,9 0 0 1 270,446 Z"/>
  <path class="store" d="M270,394 A120,9 0 0 0 510,394"/>
  <text class="name mid" x="390" y="430" text-anchor="middle">Where each piece stands</text>
  <path class="line" d="M180,310 L266,200" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="150" y="245" text-anchor="middle">a prompt and its tools</text>
  <path class="line" d="M510,175 L696,175" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="603" y="165" text-anchor="middle">starts</text>
  <path class="line" d="M780,210 L780,376" marker-end="url(#arrow)"/>
  <text class="label small halo end" x="772" y="300" text-anchor="end">the limit stops it</text>
  <path class="line" d="M880,376 L880,214" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="888" y="300" text-anchor="start">after each reset</text>
  <path class="line" d="M710,210 L514,394" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="600" y="340" text-anchor="middle">writes how it goes</text>
  <path class="line" d="M270,430 L150,364" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="120" y="420" text-anchor="middle">overnight:status,</text>
  <text class="label small halo mid" x="120" y="436" text-anchor="middle">in any later session</text>
</svg>
