<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640">
  <title>How overnight carries each task you stack to its end: it runs the tasks apart from Claude Code, waits out each usage limit and resumes the same session, and ends each task as finished or given up with why, which /overnight:check shows you</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="640"/>
  <rect class="frame" x="220" y="20" width="920" height="560" rx="8"/>
  <text class="frame-name start" x="234" y="42" text-anchor="start">overnight</text>
  <rect class="box" x="20" y="120" width="160" height="70" rx="6"/>
  <text class="name mid" x="100.0" y="150" text-anchor="middle">You</text>
  <text class="kind mid" x="100.0" y="170" text-anchor="middle">an AI session</text>
  <text class="quote start" x="20" y="228" text-anchor="start">“My plugin runs its own AI.</text>
  <text class="quote start" x="20" y="244" text-anchor="start">Must it write the wait again?”</text>
  <text class="gets start" x="20" y="262" text-anchor="start">No: stack a queue of one.</text>
  <path class="store" d="M250,124 A100.0,9 0 0 1 450,124 V186 A100.0,9 0 0 1 250,186 Z"/>
  <path class="store" d="M250,124 A100.0,9 0 0 0 450,124"/>
  <text class="name mid" x="350.0" y="154" text-anchor="middle">Queue file</text>
  <text class="kind mid" x="350.0" y="174" text-anchor="middle">stacked by /overnight:stack</text>
  <path class="line" d="M180,155 L246,155" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="213" y="145" text-anchor="middle">stacks</text>
  <rect class="box" x="530" y="120" width="220" height="70" rx="6"/>
  <text class="name mid" x="640.0" y="150" text-anchor="middle">Runs the tasks</text>
  <text class="kind mid" x="640.0" y="170" text-anchor="middle">apart from Claude Code</text>
  <text class="quote start" x="500" y="62" text-anchor="start">“Do the tasks stop when my session ends?”</text>
  <text class="quote start" x="500" y="78" text-anchor="start">“Won't they use up the daytime window?”</text>
  <text class="gets start" x="500" y="96" text-anchor="start">No: they go on after you end, from your hour.</text>
  <path class="line" d="M450,155 L526,155" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="488" y="145" text-anchor="middle">reads</text>
  <rect class="box" x="860" y="120" width="240" height="70" rx="6"/>
  <text class="name mid" x="980.0" y="150" text-anchor="middle">Each task’s session</text>
  <text class="kind mid" x="980.0" y="170" text-anchor="middle">tools allowed, writes in its dir</text>
  <text class="quote start" x="860" y="78" text-anchor="start">“Does it stop to ask for a permission?”</text>
  <text class="gets start" x="860" y="96" text-anchor="start">No: no one needs to answer.</text>
  <path class="line" d="M750,155 L856,155" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="803" y="145" text-anchor="middle">3 at a time</text>
  <rect class="box" x="860" y="330" width="240" height="70" rx="6"/>
  <text class="name mid" x="980.0" y="360" text-anchor="middle">Waits for the limit</text>
  <text class="kind mid" x="980.0" y="380" text-anchor="middle">resumes 2 min after the reset</text>
  <path class="line" d="M950,190 L950,326" marker-end="url(#arrow)"/>
  <text class="label small halo end" x="942" y="262" text-anchor="end">hits the limit</text>
  <path class="line" d="M1060,330 L1060,194" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="1068" y="262" text-anchor="start">resumes</text>
  <text class="quote start" x="880" y="430" text-anchor="start">“Tasks stop at the usage limit.”</text>
  <text class="gets start" x="880" y="448" text-anchor="start">You restart none.</text>
  <text class="quote start" x="880" y="472" text-anchor="start">“Does one task hold up the queue?”</text>
  <text class="gets start" x="880" y="490" text-anchor="start">No: the others go on.</text>
  <path class="store" d="M500,474 A120.0,9 0 0 1 740,474 V536 A120.0,9 0 0 1 500,536 Z"/>
  <path class="store" d="M500,474 A120.0,9 0 0 0 740,474"/>
  <text class="name mid" x="620.0" y="504" text-anchor="middle">Replies and ends</text>
  <text class="kind mid" x="620.0" y="524" text-anchor="middle">finished, or given up with why</text>
  <path class="line" d="M880,190 L700,466" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="790" y="330" text-anchor="middle">finishes</text>
  <path class="line" d="M860,380 L744,486" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="802" y="436" text-anchor="middle">7th stop: gives up</text>
  <rect class="box" x="250" y="470" width="180" height="70" rx="6"/>
  <text class="name mid" x="340.0" y="500" text-anchor="middle">/overnight:check</text>
  <text class="kind mid" x="340.0" y="520" text-anchor="middle">where each task stands</text>
  <path class="line" d="M500,505 L434,505" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="467" y="495" text-anchor="middle">reads</text>
  <path class="line" d="M340,540 L340,610 L100,610 L100,194" marker-end="url(#arrow)"/>
  <text class="gets halo mid" x="220" y="630" text-anchor="middle">which finished, which were given up, each reply</text>
</svg>
