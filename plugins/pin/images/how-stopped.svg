<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How a stopped run goes on from the design tree</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="300"/>
  <rect class="frame" x="10" y="10" width="450" height="280" rx="8"/>
  <text class="frame-name" x="24" y="32" text-anchor="start">The first conversation</text>
  <rect class="ext" x="40" y="60" width="160" height="60" rx="22"/>
  <text class="name" x="120.0" y="95.0" text-anchor="middle">You</text>
  <rect class="box" x="260" y="60" width="160" height="60" rx="0"/>
  <text class="name" x="340.0" y="95.0" text-anchor="middle">Pin</text>
  <path class="line" d="M200,90 L256,90" marker-end="url(#arrow)"/>
  <text class="label small halo" x="228" y="48" text-anchor="middle">an answer</text>
  <text class="label small halo" x="60" y="160" text-anchor="start">the conversation ends</text>
  <text class="label small halo" x="60" y="174" text-anchor="start">before the design is confirmed</text>
  <rect class="frame" x="540" y="10" width="450" height="280" rx="8"/>
  <text class="frame-name" x="554" y="32" text-anchor="start">A new conversation</text>
  <rect class="ext" x="570" y="60" width="160" height="60" rx="22"/>
  <text class="name" x="650.0" y="95.0" text-anchor="middle">You</text>
  <rect class="box" x="790" y="60" width="160" height="60" rx="0"/>
  <text class="name" x="870.0" y="95.0" text-anchor="middle">Pin</text>
  <path class="line" d="M730,90 L786,90" marker-end="url(#arrow)"/>
  <text class="label small halo" x="758" y="48" text-anchor="middle">/pin:down</text>
  <rect class="store" x="370" y="200" width="260" height="70" rx="0"/>
  <text class="name" x="500.0" y="232.0" text-anchor="middle">.pin/&lt;date&gt;-&lt;name&gt;/</text>
  <text class="kind" x="500.0" y="251.0" text-anchor="middle">design-tree.md: every answer</text>
  <path class="line" d="M340,120 L340,235 L366,235" marker-end="url(#arrow)"/>
  <text class="label small halo" x="348" y="160" text-anchor="start">writes the answer</text>
  <text class="label small halo" x="348" y="174" text-anchor="start">before its next point</text>
  <path class="line" d="M634,235 L870,235 L870,124" marker-end="url(#arrow)"/>
  <text class="label small halo" x="860" y="180" text-anchor="end">found by its goal:</text>
  <text class="label small halo" x="860" y="194" text-anchor="end">goes on, asks nothing again</text>
</svg>
