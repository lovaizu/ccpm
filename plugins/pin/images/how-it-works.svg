<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Pin works</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="480"/>

  <!-- boxes: a name each; Pin shaded -->
  <rect class="box" x="470" y="30" width="220" height="56" rx="8"/>
  <text class="name" x="580" y="63">you</text>

  <rect class="box" x="20" y="200" width="180" height="56" rx="8"/>
  <text class="name" x="110" y="233">a maker AI</text>

  <rect class="box lane" x="470" y="190" width="220" height="76" rx="8"/>
  <text class="name" x="580" y="216">Pin</text>
  <text class="kind" x="580" y="238">settles itself what follows</text>
  <text class="kind" x="580" y="254">from the goal and the facts</text>

  <rect class="box" x="840" y="200" width="180" height="56" rx="8"/>
  <text class="name" x="930" y="233">your repository</text>

  <rect class="store" x="470" y="390" width="220" height="64" rx="8"/>
  <text class="name" x="580" y="416">design-tree.md</text>
  <text class="kind" x="580" y="438">the goal, every point under it</text>

  <rect class="box" x="840" y="390" width="180" height="64" rx="8"/>
  <text class="name" x="930" y="417">the AI that makes</text>
  <text class="name" x="930" y="437">your work</text>

  <!-- you and Pin -->
  <path class="line" d="M550,86 V190" marker-end="url(#arrow)"/>
  <text class="label" x="540" y="142" text-anchor="end">your plan, then each answer</text>
  <path class="line" d="M610,190 V86" marker-end="url(#arrow)"/>
  <text class="label" x="620" y="130">one point at a time,</text>
  <text class="label" x="620" y="146">then the whole design to confirm</text>

  <!-- a maker AI between you and Pin -->
  <path class="line" d="M110,200 V48 H470" marker-end="url(#arrow)"/>
  <text class="label mid" x="290" y="40">passes each point on as given</text>
  <path class="line" d="M470,70 H150 V200" marker-end="url(#arrow)"/>
  <text class="label" x="160" y="90">your answer, word for word</text>
  <path class="line" d="M200,214 H470" marker-end="url(#arrow)"/>
  <text class="label mid" x="335" y="188">the goal, its questions</text>
  <text class="label mid" x="335" y="204">and what it settled</text>
  <path class="line" d="M470,244 H200" marker-end="url(#arrow)"/>
  <text class="label mid" x="335" y="262">each point for you, then the design</text>

  <!-- Pin, the facts and the design tree -->
  <path class="line" d="M690,228 H840" marker-end="url(#arrow)"/>
  <text class="label mid" x="765" y="220">finds each fact</text>
  <path class="line" d="M580,266 V390" marker-end="url(#arrow)"/>
  <text class="label" x="590" y="332">writes each point, with who settled it</text>

  <!-- the work, made on the design -->
  <path class="line" d="M110,256 V422 H470" marker-end="url(#arrow)"/>
  <text class="label" x="120" y="412">builds the work on it as given</text>
  <path class="line" d="M840,422 H690" marker-end="url(#arrow)"/>
  <text class="label mid" x="765" y="398">makes your work</text>
  <text class="label mid" x="765" y="414">from it</text>
</svg>
