<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Pin tells a point that is yours from one it settles</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="330"/>
  <rect class="box" x="30" y="130" width="180" height="70" rx="0"/>
  <text class="name" x="120.0" y="162.0" text-anchor="middle">an open point</text>
  <text class="kind" x="120.0" y="181.0" text-anchor="middle">of the design tree</text>
  <rect class="box" x="290" y="30" width="240" height="70" rx="0"/>
  <text class="name" x="410.0" y="62.0" text-anchor="middle">a fact</text>
  <text class="kind" x="410.0" y="81.0" text-anchor="middle">what the repository holds</text>
  <rect class="box" x="290" y="130" width="240" height="70" rx="0"/>
  <text class="name" x="410.0" y="162.0" text-anchor="middle">a decision the goal</text>
  <text class="kind" x="410.0" y="181.0" text-anchor="middle">and the facts settle</text>
  <rect class="box" x="290" y="230" width="240" height="70" rx="0"/>
  <text class="name" x="410.0" y="262.0" text-anchor="middle">two ways serve equally,</text>
  <text class="kind" x="410.0" y="281.0" text-anchor="middle">or hard to undo</text>
  <rect class="ext" x="760" y="30" width="220" height="70" rx="22"/>
  <text class="name" x="870.0" y="62.0" text-anchor="middle">Found: ... Is that right?</text>
  <text class="kind" x="870.0" y="81.0" text-anchor="middle">shown to you to confirm</text>
  <rect class="box" x="760" y="130" width="220" height="70" rx="0"/>
  <text class="name" x="870.0" y="162.0" text-anchor="middle">settled by Pin</text>
  <text class="kind" x="870.0" y="181.0" text-anchor="middle">shown in the whole design</text>
  <rect class="ext" x="760" y="230" width="220" height="70" rx="22"/>
  <text class="name" x="870.0" y="262.0" text-anchor="middle">asked of you</text>
  <text class="kind" x="870.0" y="281.0" text-anchor="middle">with a recommendation</text>
  <path class="line" d="M210,165 L250,165 L250,65 L286,65" marker-end="url(#arrow)"/>
  <path class="line" d="M530,65 L756,65" marker-end="url(#arrow)"/>
  <path class="line" d="M210,165 L250,165 L250,165 L286,165" marker-end="url(#arrow)"/>
  <path class="line" d="M530,165 L756,165" marker-end="url(#arrow)"/>
  <path class="line" d="M210,165 L250,165 L250,265 L286,265" marker-end="url(#arrow)"/>
  <path class="line" d="M530,265 L756,265" marker-end="url(#arrow)"/>
  <text class="label small halo" x="545" y="57" text-anchor="start">found with Read and Grep</text>
  <text class="label small halo" x="545" y="157" text-anchor="start">by reasoning</text>
  <text class="label small halo" x="545" y="257" text-anchor="start">yours to decide</text>
</svg>
