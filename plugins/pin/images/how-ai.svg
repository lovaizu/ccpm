<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Pin keeps the points your AI settled</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="320"/>
  <rect class="ext" x="40" y="40" width="180" height="64" rx="22"/>
  <text class="name" x="130.0" y="77.0" text-anchor="middle">You</text>
  <rect class="box" x="40" y="220" width="180" height="64" rx="0"/>
  <text class="name" x="130.0" y="257.0" text-anchor="middle">Your AI</text>
  <rect class="store" x="410" y="130" width="220" height="70" rx="0"/>
  <text class="name" x="520.0" y="162.0" text-anchor="middle">design-tree.md</text>
  <text class="kind" x="520.0" y="181.0" text-anchor="middle">its points marked (maker)</text>
  <rect class="box" x="780" y="220" width="180" height="64" rx="0"/>
  <text class="name" x="870.0" y="257.0" text-anchor="middle">Pin</text>
  <path class="line" d="M130,104 L130,216" marker-end="url(#arrow)"/>
  <text class="label small halo" x="140" y="150" text-anchor="start">you settle points</text>
  <text class="label small halo" x="140" y="164" text-anchor="start">with your AI</text>
  <path class="line" d="M220,240 L300,240 L300,165 L406,165" marker-end="url(#arrow)"/>
  <text class="label small halo" x="308" y="222" text-anchor="start">writes the goal, the questions</text>
  <text class="label small halo" x="308" y="236" text-anchor="start">and what it settled</text>
  <path class="line" d="M220,270 L776,270" marker-end="url(#arrow)"/>
  <text class="label small halo" x="500" y="262" text-anchor="middle">calls pin:down with the path</text>
  <path class="line" d="M870,220 L870,165 L634,165" marker-end="url(#arrow)"/>
  <text class="label small halo" x="640" y="154" text-anchor="start">keeps each (maker) point, asks only the rest</text>
  <path class="line" d="M780,236 L700,236 L700,72 L224,72" marker-end="url(#arrow)"/>
  <text class="label small halo" x="460" y="64" text-anchor="middle">one point at a time: only what is yours and still open</text>
</svg>
