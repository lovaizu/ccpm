<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The usual way and Pin, with the five problems marked</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="560"/>
  <rect class="frame" x="10" y="10" width="980" height="250" rx="8"/>
  <text class="frame-name" x="24" y="32" text-anchor="start">The usual way: an AI starts from your request</text>
  <rect class="ext" x="40" y="70" width="160" height="60" rx="22"/>
  <text class="name" x="120.0" y="105.0" text-anchor="middle">You</text>
  <rect class="box" x="420" y="70" width="160" height="60" rx="0"/>
  <text class="name" x="500.0" y="105.0" text-anchor="middle">AI</text>
  <rect class="box" x="800" y="70" width="160" height="60" rx="0"/>
  <text class="name" x="880.0" y="105.0" text-anchor="middle">The work</text>
  <path class="line" d="M200,90 L416,90" marker-end="url(#arrow)"/>
  <text class="label small halo" x="308" y="80" text-anchor="middle">your request</text>
  <path class="line dashed" d="M416,116 L204,116" marker-end="url(#arrow)"/>
  <text class="label small halo" x="240" y="154" text-anchor="start">asks facts it could find</text>
  <text class="label small halo" x="240" y="180" text-anchor="start">several questions at once</text>
  <path class="line" d="M580,100 L796,100" marker-end="url(#arrow)"/>
  <text class="label small halo" x="688" y="90" text-anchor="middle">made on a guess</text>
  <text class="label small halo" x="688" y="120" text-anchor="middle">where no one asked</text>
  <path class="line dashed" d="M880,130 L880,210 L120,210 L120,134" marker-end="url(#arrow)"/>
  <text class="label small halo" x="318" y="202" text-anchor="start">what you meant otherwise shows only in the work, as rework</text>
  <text class="label small halo" x="500" y="234" text-anchor="middle">a stopped conversation asks you again</text>
  <circle class="lane" cx="610" cy="100" r="11"/>
  <text class="name" x="610" y="105" text-anchor="middle">1</text>
  <circle class="lane" cx="222" cy="150" r="11"/>
  <text class="name" x="222" y="155" text-anchor="middle">2</text>
  <circle class="lane" cx="222" cy="176" r="11"/>
  <text class="name" x="222" y="181" text-anchor="middle">3</text>
  <circle class="lane" cx="300" cy="198" r="11"/>
  <text class="name" x="300" y="203" text-anchor="middle">4</text>
  <circle class="lane" cx="340" cy="230" r="11"/>
  <text class="name" x="340" y="235" text-anchor="middle">5</text>
  <rect class="frame" x="10" y="280" width="980" height="270" rx="8"/>
  <text class="frame-name" x="24" y="302" text-anchor="start">Pin</text>
  <rect class="ext" x="40" y="340" width="160" height="60" rx="22"/>
  <text class="name" x="120.0" y="375.0" text-anchor="middle">You</text>
  <rect class="box" x="420" y="340" width="160" height="60" rx="0"/>
  <text class="name" x="500.0" y="375.0" text-anchor="middle">Pin</text>
  <rect class="store" x="820" y="340" width="160" height="60" rx="0"/>
  <text class="name" x="900.0" y="375.0" text-anchor="middle">design-tree.md</text>
  <rect class="box" x="820" y="460" width="160" height="60" rx="0"/>
  <text class="name" x="900.0" y="495.0" text-anchor="middle">The work</text>
  <path class="line" d="M200,360 L416,360" marker-end="url(#arrow)"/>
  <text class="label small halo" x="308" y="350" text-anchor="middle">your plan</text>
  <path class="line" d="M416,386 L204,386" marker-end="url(#arrow)"/>
  <text class="label small halo" x="240" y="444" text-anchor="start">only what is yours; facts to confirm</text>
  <text class="label small halo" x="240" y="418" text-anchor="start">one point at a time, in order</text>
  <path class="line" d="M580,370 L816,370" marker-end="url(#arrow)"/>
  <text class="label small halo" x="620" y="360" text-anchor="start">every point, from the goal down</text>
  <text class="label small halo" x="620" y="394" text-anchor="start">each answer, before the next</text>
  <path class="line" d="M500,400 L500,490 L204,490" marker-end="url(#arrow)"/>
  <text class="label small halo" x="262" y="508" text-anchor="start">the whole design, each point with who settled it</text>
  <path class="line" d="M900,400 L900,456" marker-end="url(#arrow)"/>
  <text class="label small halo" x="890" y="434" text-anchor="end">read by the AI</text>
  <circle class="lane" cx="600" cy="356" r="11"/>
  <text class="name" x="600" y="361" text-anchor="middle">1</text>
  <circle class="lane" cx="222" cy="440" r="11"/>
  <text class="name" x="222" y="445" text-anchor="middle">2</text>
  <circle class="lane" cx="222" cy="414" r="11"/>
  <text class="name" x="222" y="419" text-anchor="middle">3</text>
  <circle class="lane" cx="240" cy="504" r="11"/>
  <text class="name" x="240" y="509" text-anchor="middle">4</text>
  <circle class="lane" cx="600" cy="390" r="11"/>
  <text class="name" x="600" y="395" text-anchor="middle">5</text>
</svg>
