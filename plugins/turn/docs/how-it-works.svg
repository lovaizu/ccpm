<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How turn works</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- outside turn -->
  <rect class="box" x="40" y="20" width="220" height="60" rx="20"/>
  <text class="name" x="150" y="46">your plugin's step</text>
  <text class="kind" x="150" y="66">writes the CCS, calls turn</text>
  <rect class="box" x="640" y="20" width="220" height="60" rx="20"/>
  <text class="name" x="750" y="46">main conversation</text>
  <text class="kind" x="750" y="66">asks you, keeps your answer</text>

  <!-- turn -->
  <rect class="frame" x="20" y="125" width="860" height="315" rx="10"/>
  <text class="frame-name" x="32" y="144">turn</text>

  <rect class="box" x="40" y="160" width="220" height="60" rx="20"/>
  <text class="name" x="150" y="186">turn:up</text>
  <text class="kind" x="150" y="206">starts each AI; reads no work</text>
  <rect class="box" x="640" y="160" width="220" height="60" rx="20"/>
  <text class="name" x="750" y="186">generator</text>
  <text class="kind" x="750" y="206">makes and mends the work</text>
  <rect class="box" x="640" y="330" width="220" height="60" rx="20"/>
  <text class="name" x="750" y="356">first user</text>
  <text class="kind" x="750" y="376">uses the work as its receiver</text>
  <rect class="box" x="340" y="330" width="220" height="60" rx="0"/>
  <text class="name" x="450" y="356">turn's scripts</text>
  <text class="kind" x="450" y="376">check each reply, write the result</text>

  <!-- your step and turn:up -->
  <path class="line" d="M130,80 V160" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="122" y="105">call</text>
  <path class="line" d="M170,160 V80" marker-end="url(#arrow)"/>
  <text class="label" x="178" y="105">the result</text>

  <!-- generator and main conversation -->
  <path class="line" d="M730,160 V80" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="722" y="105">question</text>
  <path class="line" d="M770,80 V160" marker-end="url(#arrow)"/>
  <text class="label" x="778" y="105">answer</text>

  <!-- turn:up starts the two AIs -->
  <path class="line" d="M260,190 H640" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="450" y="182">1. starts</text>
  <path class="line" d="M110,220 V420 H750 V390" marker-end="url(#arrow)"/>
  <text class="label" x="118" y="412">2. starts, once the generator ends</text>

  <!-- turn:up has the result written -->
  <path class="line" d="M240,220 L360,330" marker-end="url(#arrow)"/>
  <text class="label" x="300" y="262">3. has the result written</text>

  <!-- the two AIs -->
  <path class="line" d="M730,330 V220" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="722" y="262">what the receiver</text>
  <text class="label" text-anchor="end" x="722" y="278">would need</text>
  <path class="line" d="M770,220 V330" marker-end="url(#arrow)"/>
  <text class="label" x="778" y="270">mended</text>

  <!-- replies checked -->
  <path class="line" d="M640,205 L500,330" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="535" y="280">its claim</text>
  <path class="line" d="M640,360 H560" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="600" y="352">reading</text>
</svg>
