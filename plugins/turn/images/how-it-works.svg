<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Turn works</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="620"/>

  <!-- outside Turn: you, a calling AI and your repository -->
  <rect class="box" x="625" y="20" width="200" height="56" rx="8"/>
  <text class="name" x="725" y="53">you</text>

  <rect class="ext" x="20" y="170" width="180" height="56" rx="8"/>
  <text class="name" x="110" y="203">a calling AI</text>

  <rect class="box" x="880" y="20" width="180" height="56" rx="8"/>
  <text class="name" x="970" y="53">your repository</text>

  <!-- Turn, one frame -->
  <rect class="frame" x="360" y="140" width="720" height="460" rx="10"/>
  <text class="frame-name" x="374" y="162">Turn</text>

  <rect class="box lane" x="630" y="190" width="190" height="66" rx="8"/>
  <text class="name" x="725" y="214">Pin</text>
  <text class="kind" x="725" y="233">settles the design</text>
  <text class="kind" x="725" y="248">with you</text>

  <rect class="store" x="385" y="340" width="190" height="76" rx="8"/>
  <text class="name" x="480" y="366">the best practices</text>
  <text class="kind" x="480" y="386">the kind's, then those</text>
  <text class="kind" x="480" y="402">of how it reads</text>

  <rect class="store" x="630" y="340" width="190" height="76" rx="8"/>
  <text class="name" x="725" y="366">design-tree.json</text>
  <text class="kind" x="725" y="386">every point, and</text>
  <text class="kind" x="725" y="402">who settled it</text>

  <rect class="box" x="875" y="340" width="190" height="76" rx="8"/>
  <text class="name" x="970" y="366">evaluator</text>
  <text class="kind" x="970" y="386">has the work and the</text>
  <text class="kind" x="970" y="402">questions, never the design</text>

  <rect class="box" x="630" y="490" width="190" height="66" rx="8"/>
  <text class="name" x="725" y="516">generator</text>
  <text class="kind" x="725" y="538">makes the work</text>

  <rect class="store" x="875" y="490" width="190" height="66" rx="8"/>
  <text class="name" x="970" y="516">the work</text>
  <text class="kind" x="970" y="538">such as README.md</text>

  <!-- you and Turn -->
  <path class="line" d="M690,76 V190" marker-end="url(#arrow)"/>
  <text class="label" x="680" y="112" text-anchor="end">your request,</text>
  <text class="label" x="680" y="128" text-anchor="end">then each answer</text>
  <path class="line" d="M760,190 V76" marker-end="url(#arrow)"/>
  <text class="label" x="770" y="104">one point at a time,</text>
  <text class="label" x="770" y="120">the design, then the work</text>

  <!-- a calling AI between you and Turn -->
  <path class="line" d="M110,170 V48 H625" marker-end="url(#arrow)"/>
  <text class="label mid" x="367" y="40">passes each point on as given</text>
  <path class="line" d="M625,66 H150 V170" marker-end="url(#arrow)"/>
  <text class="label" x="160" y="90">your answer, word for word</text>
  <path class="line" d="M200,186 H360" marker-end="url(#arrow)"/>
  <text class="label small mid" x="280" y="178">the points it settled</text>
  <path class="line" d="M360,212 H200" marker-end="url(#arrow)"/>
  <text class="label small mid" x="280" y="230">each point, the design,</text>
  <text class="label small mid" x="280" y="246">then the work</text>

  <!-- Pin: the facts, the questions and the design -->
  <path class="line" d="M820,205 H1040 V76" marker-end="url(#arrow)"/>
  <text class="label mid" x="920" y="197">finds each fact</text>
  <path class="line" d="M480,340 V225 H630" marker-end="url(#arrow)"/>
  <text class="label mid" x="555" y="217">its questions</text>
  <path class="line" d="M725,256 V340" marker-end="url(#arrow)"/>
  <text class="label" x="735" y="302">writes each point</text>

  <!-- the generator makes, the evaluator judges -->
  <path class="line" d="M725,416 V490" marker-end="url(#arrow)"/>
  <text class="label" x="735" y="457">builds on it</text>
  <path class="line" d="M480,416 V523 H630" marker-end="url(#arrow)"/>
  <text class="label small mid" x="555" y="543">how to make</text>
  <text class="label small mid" x="555" y="559">each question yes</text>
  <path class="line" d="M820,523 H875" marker-end="url(#arrow)"/>
  <text class="label small mid" x="847" y="515">writes</text>
  <path class="line" d="M940,490 V416" marker-end="url(#arrow)"/>
  <text class="label small" x="950" y="448">reads it whole,</text>
  <text class="label small" x="950" y="464">as its user would</text>
  <path class="line" d="M960,340 V240 H820" marker-end="url(#arrow)"/>
  <text class="label small mid" x="890" y="258">a question not met,</text>
  <text class="label small mid" x="890" y="274">back to its decision</text>
</svg>
