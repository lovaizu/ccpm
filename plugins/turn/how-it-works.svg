<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Who does what to whom in Turn</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .you { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .you-line { fill: none; stroke: #0969da; stroke-width: 1.5; }
    .split { fill: none; stroke: #d0d7de; stroke-width: 3; stroke-dasharray: 8 6; }
    .head { fill: #59636e; }
    .you-head { fill: #0969da; }
    .label { fill: #1f2328; font-size: 13px; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .eye { fill: #59636e; }
    .mouth { fill: none; stroke: #59636e; stroke-width: 2; stroke-linecap: round; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .you { fill: #0d2a4a; stroke: #4493f8; }
      .fold { stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .line { stroke: #9198a1; }
      .you-line { stroke: #4493f8; }
      .split { stroke: #3d444d; }
      .head { fill: #9198a1; }
      .kind, .eye { fill: #9198a1; }
      .mouth { stroke: #9198a1; }
      .you-head { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="you-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="you-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- what the blue marks mean -->
  <rect class="you" x="40" y="30" width="28" height="18" rx="4"/>
  <text class="label" x="78" y="44">where you spend effort</text>

  <!-- you are a person; planner, designer, builder and evaluator are AIs -->
  <circle class="you" cx="90" cy="118" r="16"/>
  <path class="you" d="M60,182 V160 A30,24 0 0 1 120,160 V182 Z"/>
  <text class="name" x="90" y="204">you</text>

  <path class="fold" d="M350,108 V122"/>
  <circle class="box" cx="350" cy="104" r="4"/>
  <rect class="box" x="320" y="122" width="60" height="60" rx="10"/>
  <circle class="eye" cx="338" cy="146" r="5"/>
  <circle class="eye" cx="362" cy="146" r="5"/>
  <path class="mouth" d="M338,166 H362"/>
  <text class="name" x="350" y="204">designer</text>
  <text class="kind" x="350" y="221">Turn's AI</text>

  <path class="fold" d="M850,108 V122"/>
  <circle class="box" cx="850" cy="104" r="4"/>
  <rect class="box" x="820" y="122" width="60" height="60" rx="10"/>
  <circle class="eye" cx="838" cy="146" r="5"/>
  <circle class="eye" cx="862" cy="146" r="5"/>
  <path class="mouth" d="M838,166 H862"/>
  <text class="name" x="850" y="204">builder</text>
  <text class="kind" x="850" y="221">Turn's AI</text>

  <path class="fold" d="M1105,108 V122"/>
  <circle class="box" cx="1105" cy="104" r="4"/>
  <rect class="box" x="1075" y="122" width="60" height="60" rx="10"/>
  <circle class="eye" cx="1093" cy="146" r="5"/>
  <circle class="eye" cx="1117" cy="146" r="5"/>
  <path class="mouth" d="M1093,166 H1117"/>
  <text class="name" x="1105" y="204">planner</text>
  <text class="kind" x="1105" y="221">Turn's AI</text>

  <path class="fold" d="M850,446 V460"/>
  <circle class="box" cx="850" cy="442" r="4"/>
  <rect class="box" x="820" y="460" width="60" height="60" rx="10"/>
  <circle class="eye" cx="838" cy="484" r="5"/>
  <circle class="eye" cx="862" cy="484" r="5"/>
  <path class="mouth" d="M838,504 H862"/>
  <text class="name" x="850" y="542">evaluator</text>
  <text class="kind" x="850" y="559">a second AI</text>

  <!-- sheets: the design on one side; the work and the checklist on the evaluator's side -->
  <path class="box" d="M470,272 H582 L600,290 V372 H470 Z"/>
  <path class="fold" d="M582,272 V290 H600"/>
  <text class="name" x="535" y="327">the design</text>

  <path class="box" d="M785,272 H897 L915,290 V372 H785 Z"/>
  <path class="fold" d="M897,272 V290 H915"/>
  <text class="name" x="850" y="327">the work</text>

  <path class="box" d="M1040,430 H1152 L1170,448 V530 H1040 Z"/>
  <path class="fold" d="M1152,430 V448 H1170"/>
  <text class="name" x="1105" y="485">the checklist</text>

  <!-- the planner draws the checklist and has you approve it -->
  <path class="line" d="M1105,100 V80 H90 V98" marker-end="url(#arrow)"/>
  <text class="label mid" x="600" y="72">shows the format and the checklist for your approval</text>
  <path class="line" d="M1105,232 V422" marker-end="url(#arrow)"/>
  <text class="label end" x="1095" y="330">draws from good works</text>

  <!-- you and the designer -->
  <path class="line" d="M312,135 H128" marker-end="url(#arrow)"/>
  <text class="label mid" x="220" y="127">asks only your points</text>
  <path class="you-line" d="M128,170 H312" marker-end="url(#you-arrow)"/>
  <text class="label mid" x="220" y="190">answer, approve</text>

  <!-- the design is made and handed over -->
  <path class="line" d="M388,160 H510 V264" marker-end="url(#arrow)"/>
  <text class="label mid" x="449" y="152">designs</text>
  <path class="line" d="M570,272 V135 H812" marker-end="url(#arrow)"/>
  <text class="label mid" x="691" y="127">hands over</text>
  <path class="line" d="M850,232 V264" marker-end="url(#arrow)"/>
  <text class="label" x="862" y="253">makes</text>

  <!-- the evaluator -->
  <path class="line" d="M850,432 V380" marker-end="url(#arrow)"/>
  <text class="label" x="862" y="411">looks for what is good</text>
  <path class="line" d="M888,490 H1032" marker-end="url(#arrow)"/>
  <text class="label mid" x="960" y="482">uses its questions</text>

  <!-- the design is kept from the evaluator -->
  <text class="label mid" x="692" y="212">never sees the design</text>
  <path class="split" d="M692,226 V455"/>

  <!-- not yet good: back to the designer -->
  <path class="line" d="M812,490 H350 V232" marker-end="url(#arrow)"/>
  <text class="label mid" x="581" y="482">not yet good: tells what the reader would get</text>

  <!-- all good: the work reaches you -->
  <path class="line" d="M850,570 V610 H90 V214" marker-end="url(#arrow)"/>
  <text class="label mid" x="470" y="602">all good: hands you the work</text>
</svg>
