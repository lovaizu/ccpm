<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Turn builds a deliverable</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .you { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .you-line { fill: none; stroke: #0969da; stroke-width: 1.5; }
    .split { fill: none; stroke: #d0d7de; stroke-width: 3; stroke-dasharray: 8 6; }
    .head { fill: #59636e; }
    .you-head { fill: #0969da; }
    .label { fill: #1f2328; font-size: 13px; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .eye { fill: #59636e; }
    .mouth { fill: none; stroke: #59636e; stroke-width: 2; stroke-linecap: round; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .you { fill: #0d2a4a; stroke: #4493f8; }
      .fold { stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .line { stroke: #9198a1; }
      .you-line { stroke: #4493f8; }
      .split { stroke: #3d444d; }
      .head { fill: #9198a1; }
      .kind, .eye { fill: #9198a1; }
      .mouth { stroke: #9198a1; }
      .you-head { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="you-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="you-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- what the blue marks mean -->
  <rect class="you" x="40" y="30" width="28" height="18" rx="4"/>
  <text class="label" x="78" y="44">where you spend effort</text>

  <!-- you are a person; planner, designer, builder and evaluator are AIs -->
  <circle class="you" cx="90" cy="280" r="16"/>
  <path class="you" d="M60,344 V322 A30,24 0 0 1 120,322 V344 Z"/>
  <text class="name" x="150" y="312">you</text>

  <path class="fold" d="M330,88 V102"/>
  <circle class="box" cx="330" cy="84" r="4"/>
  <rect class="box" x="300" y="102" width="60" height="60" rx="10"/>
  <circle class="eye" cx="318" cy="126" r="5"/>
  <circle class="eye" cx="342" cy="126" r="5"/>
  <path class="mouth" d="M318,146 H342"/>
  <text class="name" x="330" y="184">planner</text>
  <text class="kind" x="330" y="201">Turn's AI</text>

  <path class="fold" d="M330,426 V440"/>
  <circle class="box" cx="330" cy="422" r="4"/>
  <rect class="box" x="300" y="440" width="60" height="60" rx="10"/>
  <circle class="eye" cx="318" cy="464" r="5"/>
  <circle class="eye" cx="342" cy="464" r="5"/>
  <path class="mouth" d="M318,484 H342"/>
  <text class="name" x="330" y="522">designer</text>
  <text class="kind" x="330" y="539">Turn's AI</text>

  <path class="fold" d="M845,426 V440"/>
  <circle class="box" cx="845" cy="422" r="4"/>
  <rect class="box" x="815" y="440" width="60" height="60" rx="10"/>
  <circle class="eye" cx="833" cy="464" r="5"/>
  <circle class="eye" cx="857" cy="464" r="5"/>
  <path class="mouth" d="M833,484 H857"/>
  <text class="name" x="845" y="522">builder</text>
  <text class="kind" x="845" y="539">Turn's AI</text>

  <path class="fold" d="M1105,252 V266"/>
  <circle class="box" cx="1105" cy="248" r="4"/>
  <rect class="box" x="1075" y="266" width="60" height="60" rx="10"/>
  <circle class="eye" cx="1093" cy="290" r="5"/>
  <circle class="eye" cx="1117" cy="290" r="5"/>
  <path class="mouth" d="M1093,310 H1117"/>
  <text class="name" x="1105" y="348">evaluator</text>
  <text class="kind" x="1105" y="365">a second AI</text>

  <!-- sheets: the standard and the practice, drawn by the planner; the work, made by the builder -->
  <path class="box" d="M560,85 H672 L690,103 V175 H560 Z"/>
  <path class="fold" d="M672,85 V103 H690"/>
  <text class="name" x="625" y="135">the Standard</text>

  <path class="box" d="M560,255 H672 L690,273 V345 H560 Z"/>
  <path class="fold" d="M672,255 V273 H690"/>
  <text class="name" x="625" y="305">the Practice</text>

  <path class="box" d="M780,255 H892 L910,273 V345 H780 Z"/>
  <path class="fold" d="M892,255 V273 H910"/>
  <text class="name" x="845" y="305">the deliverable</text>

  <!-- the planner distills both from good works, and has you approve the standard -->
  <path class="line" d="M368,130 H552" marker-end="url(#arrow)"/>
  <path class="line" d="M450,130 V300 H552" marker-end="url(#arrow)"/>
  <text class="label" x="372" y="122">refines from best practice</text>
  <path class="line" d="M292,118 H76 V256" marker-end="url(#arrow)"/>
  <text class="label" x="112" y="94">shows the Standard</text>
  <text class="label" x="112" y="110">for your approval</text>
  <path class="you-line" d="M104,262 V150 H292" marker-end="url(#you-arrow)"/>
  <text class="label" x="114" y="210">approve</text>

  <!-- you and the designer -->
  <path class="line" d="M292,485 H76 V352" marker-end="url(#arrow)"/>
  <text class="label" x="112" y="505">asks only your points</text>
  <path class="you-line" d="M104,350 V455 H292" marker-end="url(#you-arrow)"/>
  <text class="label" x="114" y="410">answer, approve</text>

  <!-- the designer decides by the practice; the builder makes the work -->
  <path class="line" d="M368,450 H625 V353" marker-end="url(#arrow)"/>
  <text class="label" x="637" y="405">decides by</text>
  <path class="line" d="M368,485 H807" marker-end="url(#arrow)"/>
  <text class="label mid" x="590" y="477">hands over what to build</text>
  <path class="line" d="M845,414 V353" marker-end="url(#arrow)"/>
  <text class="label" x="857" y="390">builds</text>

  <!-- the evaluator judges the work by the standard alone -->
  <path class="split" d="M740,230 V370"/>
  <text class="label end" x="732" y="222">the evaluator never sees the Practice</text>
  <path class="line" d="M1105,240 V130 H698" marker-end="url(#arrow)"/>
  <text class="label mid" x="900" y="122">uses only its questions</text>
  <path class="line" d="M1067,296 H918" marker-end="url(#arrow)"/>
  <text class="label mid" x="992" y="272">uses it as</text>
  <text class="label mid" x="992" y="288">its reader would</text>
  <path class="line" d="M1090,375 V595 H330 V552" marker-end="url(#arrow)"/>
  <text class="label mid" x="710" y="587">not yet good: tells what the reader would get</text>
  <path class="line" d="M1120,375 V625 H36 V310 H52" marker-end="url(#arrow)"/>
  <text class="label mid" x="710" y="617">all good: hands you the deliverable</text>
</svg>
