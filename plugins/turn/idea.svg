<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A standard and a practice distilled from many guides and examples</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .fold { stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- many guides and examples -->
  <rect class="box" x="40" y="100" width="170" height="110" rx="4"/>
  <rect class="box" x="52" y="112" width="170" height="110" rx="4"/>
  <rect class="box" x="64" y="124" width="170" height="110" rx="4"/>
  <text class="name" x="149" y="172">many guides</text>
  <text class="name" x="149" y="192">and examples</text>

  <!-- distilled to the least: two sheets -->
  <path class="line" d="M242,180 H310 V85 H392" marker-end="url(#arrow)"/>
  <path class="line" d="M310,180 V245 H392" marker-end="url(#arrow)"/>
  <text class="label" x="318" y="160">distilled to</text>
  <text class="label" x="318" y="176">the least</text>

  <path class="box" d="M400,40 H602 L620,58 V130 H400 Z"/>
  <path class="fold" d="M602,40 V58 H620"/>
  <text class="name" x="510" y="80">the standard</text>
  <text class="kind" x="510" y="102">what a good work is</text>

  <path class="box" d="M400,200 H602 L620,218 V290 H400 Z"/>
  <path class="fold" d="M602,200 V218 H620"/>
  <text class="name" x="510" y="240">the practice</text>
  <text class="kind" x="510" y="262">how to decide one</text>

  <path class="line" d="M510,192 V138" marker-end="url(#arrow)"/>
  <text class="label" x="522" y="170">one for each question</text>

  <!-- the work -->
  <path class="box" d="M810,125 H922 L940,143 V205 H810 Z"/>
  <path class="fold" d="M922,125 V143 H940"/>
  <text class="name" x="875" y="170">the work</text>

  <path class="line" d="M628,85 H730 V150 H802" marker-end="url(#arrow)"/>
  <text class="label" x="738" y="118">judges it</text>
  <path class="line" d="M628,245 H730 V180 H802" marker-end="url(#arrow)"/>
  <text class="label" x="738" y="222">decides it</text>
</svg>
