<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Best practice refined into a standard and a practice</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .area { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 2; stroke-dasharray: 8 6; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .title { fill: #1f2328; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .turn { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 13px; text-anchor: middle; }
    .part { fill: #1f2328; font-size: 13px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .area, .frame, .fold { stroke: #3d444d; }
      .title, .turn, .name, .part, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- best practice: what a good deliverable is, and how to make one -->
  <rect class="box" x="40" y="20" width="920" height="114" rx="10"/>
  <text class="title" x="500" y="46">Best practice</text>
  <text class="kind" x="500" y="66">knowledge that has actually produced good deliverables</text>
  <rect class="area" x="70" y="80" width="400" height="38" rx="6"/>
  <text class="part" x="270" y="104">what a good deliverable is</text>
  <rect class="area" x="530" y="80" width="400" height="38" rx="6"/>
  <text class="part" x="730" y="104">how to build a good deliverable</text>

  <!-- refined into Turn's standard and practice -->
  <rect class="frame" x="40" y="176" width="920" height="276" rx="14"/>
  <text class="turn" x="60" y="200">Turn</text>

  <path class="line" d="M270,118 V198" marker-end="url(#arrow)"/>
  <text class="label" x="282" y="156">refined into one form</text>
  <path class="line" d="M730,118 V198" marker-end="url(#arrow)"/>
  <text class="label" x="742" y="156">refined into one form</text>

  <rect class="box" x="90" y="206" width="360" height="96" rx="10"/>
  <text class="name" x="270" y="234">Standard</text>
  <text class="kind" x="270" y="254">what a good deliverable of a kind is</text>
  <text class="part" x="270" y="284">Goal · Template · Checklist</text>

  <rect class="box" x="550" y="206" width="360" height="96" rx="10"/>
  <text class="name" x="730" y="234">Practice</text>
  <text class="kind" x="730" y="254">how to build a good deliverable</text>
  <text class="part" x="730" y="284">Design tree · a way for each question</text>

  <path class="line" d="M542,254 H458" marker-end="url(#arrow)"/>
  <text class="label mid" x="500" y="274">one way for</text>
  <text class="label mid" x="500" y="290">each question</text>

  <!-- the deliverable: made by the practice, judged against the standard -->
  <path class="box" d="M420,370 H562 L580,388 V430 H420 Z"/>
  <path class="fold" d="M562,370 V388 H580"/>
  <text class="name" x="500" y="406">Deliverable</text>
  <path class="line" d="M270,310 V400 H412" marker-end="url(#arrow)"/>
  <text class="label" x="282" y="360">evaluates it</text>
  <path class="line" d="M730,310 V400 H588" marker-end="url(#arrow)"/>
  <text class="label end" x="718" y="360">builds it</text>
</svg>
