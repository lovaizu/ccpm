<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A standard and a practice distilled from how good works are made</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .fold { stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the source: how good works of the kind are made -->
  <rect class="box" x="40" y="125" width="220" height="80" rx="10"/>
  <text class="name" x="150" y="162">how good works are made</text>
  <text class="kind" x="150" y="183">guides and examples of the kind</text>

  <!-- distilled into two -->
  <path class="line" d="M260,165 H300 V95 H462" marker-end="url(#arrow)"/>
  <path class="line" d="M300,165 V245 H462" marker-end="url(#arrow)"/>
  <text class="label" x="312" y="160">distilled to the</text>
  <text class="label" x="312" y="176">least it needs</text>

  <path class="box" d="M470,40 H692 L710,58 V150 H470 Z"/>
  <path class="fold" d="M692,40 V58 H710"/>
  <text class="name" x="590" y="88">the standard</text>
  <text class="kind" x="590" y="110">goal · template · checklist</text>

  <path class="box" d="M470,190 H692 L710,208 V300 H470 Z"/>
  <path class="fold" d="M692,190 V208 H710"/>
  <text class="name" x="590" y="238">the practice</text>
  <text class="kind" x="590" y="260">how to decide what the work says</text>

  <!-- the work: decided by the practice, judged against the standard -->
  <path class="box" d="M850,125 H962 L980,143 V205 H850 Z"/>
  <path class="fold" d="M962,125 V143 H980"/>
  <text class="name" x="915" y="170">the work</text>

  <path class="line" d="M718,95 H770 V145 H842" marker-end="url(#arrow)"/>
  <text class="label" x="778" y="120">judges it</text>
  <path class="line" d="M718,245 H770 V185 H842" marker-end="url(#arrow)"/>
  <text class="label" x="778" y="220">decides it</text>
</svg>
