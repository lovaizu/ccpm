<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A standard and a practice distilled from many guides and examples</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .cell { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .cell, .fold { stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- many guides and examples, distilled to the least -->
  <rect class="box" x="30" y="100" width="140" height="90" rx="4"/>
  <rect class="box" x="40" y="110" width="140" height="90" rx="4"/>
  <rect class="box" x="50" y="120" width="140" height="90" rx="4"/>
  <text class="name" x="120" y="160">many guides</text>
  <text class="name" x="120" y="180">and examples</text>
  <path class="line" d="M198,165 H292" marker-end="url(#arrow)"/>
  <text class="label" x="206" y="140">distilled to</text>
  <text class="label" x="206" y="156">the least</text>

  <!-- the standard and the practice, side by side, one row for each question -->
  <rect class="box" x="300" y="40" width="300" height="70"/>
  <text class="name" x="450" y="64">the standard</text>
  <text class="kind" x="450" y="83">what a good work is:</text>
  <text class="kind" x="450" y="99">goal, template, checklist</text>
  <rect class="box" x="700" y="40" width="300" height="70"/>
  <text class="name" x="850" y="64">the practice</text>
  <text class="kind" x="850" y="83">how to decide what the work says,</text>
  <text class="kind" x="850" y="99">one way for each question</text>

  <rect class="cell" x="300" y="118" width="300" height="60"/>
  <text class="label" x="316" y="143">Can a reporter tell from the headline</text>
  <text class="label" x="316" y="161">what is new?</text>
  <rect class="cell" x="700" y="118" width="300" height="60"/>
  <text class="label" x="716" y="143">List what is new to the reporters' readers,</text>
  <text class="label" x="716" y="161">and put first what they care about most.</text>
  <path class="line" d="M692,152 H608" marker-end="url(#arrow)"/>
  <text class="label mid" x="650" y="144">makes it yes</text>

  <rect class="cell" x="300" y="186" width="300" height="60"/>
  <text class="label" x="316" y="211">Can a reporter check each claim</text>
  <text class="label" x="316" y="229">in the body?</text>
  <rect class="cell" x="700" y="186" width="300" height="60"/>
  <text class="label" x="716" y="211">Give each claim the fact it rests on,</text>
  <text class="label" x="716" y="229">such as a number or a customer.</text>
  <path class="line" d="M692,220 H608" marker-end="url(#arrow)"/>
  <text class="label mid" x="650" y="212">makes it yes</text>

  <!-- the work -->
  <path class="box" d="M585,330 H697 L715,348 V390 H585 Z"/>
  <path class="fold" d="M697,330 V348 H715"/>
  <text class="name" x="650" y="366">the work</text>
  <path class="line" d="M450,254 V360 H577" marker-end="url(#arrow)"/>
  <text class="label" x="462" y="310">judges it</text>
  <path class="line" d="M850,254 V360 H723" marker-end="url(#arrow)"/>
  <text class="label end" x="838" y="310">decides it</text>
</svg>
