<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A standard and a practice distilled from how good works are made</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .you { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .term { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .you { fill: #0d2a4a; stroke: #4493f8; }
      .fold { stroke: #3d444d; }
      .name, .label, .term { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- many guides and examples, narrowed to the least a good work needs -->
  <rect class="box" x="200" y="20" width="600" height="60" rx="10"/>
  <text class="name" x="500" y="46">how good works of the kind are made</text>
  <text class="kind" x="500" y="66">many guides and examples</text>
  <path class="box" d="M300,88 H700 L580,148 H420 Z"/>
  <text class="label mid" x="500" y="114">distilled to the least</text>
  <text class="label mid" x="500" y="131">a good work needs</text>

  <path class="line" d="M500,148 V168 H240 V200" marker-end="url(#arrow)"/>
  <text class="label" x="250" y="160">what a good work is</text>
  <path class="line" d="M500,168 H760 V200" marker-end="url(#arrow)"/>
  <text class="label end" x="750" y="160">how to make one</text>

  <!-- the standard -->
  <path class="box" d="M40,208 H422 L440,226 V440 H40 Z"/>
  <path class="fold" d="M422,208 V226 H440"/>
  <text class="name" x="240" y="240">the standard</text>
  <text class="term" x="60" y="278">Goal</text>
  <text class="label" x="60" y="296">who uses such a work, and for what</text>
  <text class="term" x="60" y="328">Template</text>
  <text class="label" x="60" y="346">its shape, such as headline, lead, body</text>
  <text class="term" x="60" y="378">Checklist</text>
  <text class="label" x="60" y="396">questions a good work answers yes to, such as</text>
  <text class="label" x="60" y="414">"Can a reporter tell from the headline what is new?"</text>

  <!-- the practice -->
  <path class="box" d="M560,208 H942 L960,226 V440 H560 Z"/>
  <path class="fold" d="M942,208 V226 H960"/>
  <text class="name" x="760" y="240">the practice</text>
  <text class="term" x="580" y="278">For each question</text>
  <text class="label" x="580" y="296">how to decide what makes it yes, such as</text>
  <text class="label" x="580" y="328">list what is new to the reporters' readers,</text>
  <text class="label" x="580" y="346">pick what they care about most,</text>
  <text class="label" x="580" y="364">and put it first in the headline</text>

  <path class="line" d="M552,396 H448" marker-end="url(#arrow)"/>
  <text class="label mid" x="500" y="370">one for</text>
  <text class="label mid" x="500" y="386">each question</text>

  <!-- this work: its purpose from you, decided by the practice, judged against the standard -->
  <rect class="you" x="650" y="494" width="220" height="52" rx="10"/>
  <text class="name" x="760" y="517">this work's purpose</text>
  <text class="kind" x="760" y="535">you decide it</text>
  <path class="line" d="M760,448 V486" marker-end="url(#arrow)"/>
  <text class="label" x="772" y="472">applied to</text>

  <path class="box" d="M410,580 H572 L590,598 V640 H410 Z"/>
  <path class="fold" d="M572,580 V598 H590"/>
  <text class="name" x="500" y="615">the work</text>

  <path class="line" d="M760,554 V610 H598" marker-end="url(#arrow)"/>
  <text class="label" x="772" y="590">decides it</text>
  <path class="line" d="M240,448 V610 H402" marker-end="url(#arrow)"/>
  <text class="label end" x="228" y="530">judges it</text>
</svg>
