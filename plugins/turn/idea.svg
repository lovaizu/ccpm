<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Claude Code alone and turn, side by side</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .you { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .head-text { fill: #1f2328; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .split { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .you { fill: #0d2a4a; stroke: #4493f8; }
      .head-text, .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .split { stroke: #3d444d; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the two columns -->
  <text class="head-text" x="210" y="40">Claude Code alone</text>
  <text class="head-text" x="660" y="40">turn</text>
  <path class="split" d="M430,20 V540"/>

  <!-- what the blue boxes mean -->
  <rect class="you" x="115" y="140" width="28" height="18" rx="4"/>
  <text class="label" x="153" y="154">where you spend effort</text>

  <!-- Claude Code alone, set beside the rows of turn it matches -->
  <rect class="box" x="40" y="270" width="340" height="70" rx="35"/>
  <text class="name" x="210" y="310">the AI writes the work</text>

  <rect class="box" x="40" y="370" width="340" height="70" rx="35"/>
  <text class="name" x="210" y="410">the same AI checks it</text>

  <rect class="you" x="40" y="470" width="340" height="70" rx="8"/>
  <text class="name" x="210" y="510">you find what it missed</text>

  <path class="line" d="M210,340 V370" marker-end="url(#arrow)"/>
  <path class="line" d="M210,440 V470" marker-end="url(#arrow)"/>

  <!-- turn -->
  <rect class="you" x="480" y="70" width="360" height="70" rx="8"/>
  <text class="name" x="660" y="100">you approve a format and a checklist</text>
  <text class="kind" x="660" y="120">that turn draws from good works, once for each kind</text>

  <rect class="you" x="480" y="170" width="360" height="70" rx="8"/>
  <text class="name" x="660" y="200">you answer only the points</text>
  <text class="kind" x="660" y="220">that you alone can decide</text>

  <rect class="box" x="480" y="270" width="360" height="70" rx="35"/>
  <text class="name" x="660" y="310">turn makes the work</text>

  <rect class="box" x="480" y="370" width="360" height="70" rx="35"/>
  <text class="name" x="660" y="394">a second AI</text>
  <text class="kind" x="660" y="413">sees only the work and the checklist,</text>
  <text class="kind" x="660" y="428">and uses the work as its reader would</text>

  <rect class="box" x="480" y="470" width="360" height="70" rx="8"/>
  <text class="name" x="660" y="500">the work comes to you</text>
  <text class="kind" x="660" y="520">once every answer is yes</text>

  <path class="line" d="M660,140 V170" marker-end="url(#arrow)"/>
  <path class="line" d="M660,240 V270" marker-end="url(#arrow)"/>
  <path class="line" d="M660,340 V370" marker-end="url(#arrow)"/>
  <path class="line" d="M660,440 V470" marker-end="url(#arrow)"/>
  <path class="line" d="M840,405 H870 V305 H840" marker-end="url(#arrow)"/>
  <text class="label" x="880" y="340">not yet</text>
  <text class="label" x="880" y="357">all yes:</text>
  <text class="label" x="880" y="374">remake</text>
</svg>
