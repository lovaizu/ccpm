<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Best practice refined into a Standard and a Practice, and used through a design tree</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .area { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 2; stroke-dasharray: 8 6; }
    .fold { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .title { fill: #1f2328; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .turn { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 13px; text-anchor: middle; }
    .part { fill: #1f2328; font-size: 13px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .area, .frame, .fold { stroke: #3d444d; }
      .title, .turn, .name, .part, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- best practice: what a good deliverable is, and how to make one -->
  <rect class="box" x="40" y="20" width="920" height="114" rx="10"/>
  <text class="title" x="500" y="46">Best practice</text>
  <text class="kind" x="500" y="66">guides and examples of good deliverables of a kind</text>
  <rect class="area" x="70" y="80" width="400" height="38" rx="6"/>
  <text class="part" x="270" y="104">what a good deliverable is</text>
  <rect class="area" x="530" y="80" width="400" height="38" rx="6"/>
  <text class="part" x="730" y="104">how to make a good deliverable</text>

  <!-- refined into Turn's Standard and Practice -->
  <rect class="frame" x="40" y="176" width="920" height="396" rx="14"/>
  <text class="turn" x="60" y="200">Turn</text>

  <path class="line" d="M270,118 V198" marker-end="url(#arrow)"/>
  <text class="label" x="282" y="156">refined into one form</text>
  <path class="line" d="M730,118 V198" marker-end="url(#arrow)"/>
  <text class="label" x="742" y="156">refined into one form</text>

  <rect class="box" x="90" y="206" width="360" height="96" rx="10"/>
  <text class="name" x="270" y="234">Standard</text>
  <text class="kind" x="270" y="254">what a good deliverable of a kind is</text>
  <text class="part" x="270" y="284">Goal · Parts · Checklist</text>

  <rect class="box" x="550" y="206" width="360" height="96" rx="10"/>
  <text class="name" x="730" y="234">Practice</text>
  <text class="kind" x="730" y="254">how to make a good deliverable</text>
  <text class="part" x="730" y="284">a way and steps for each question</text>

  <path class="line" d="M542,254 H458" marker-end="url(#arrow)"/>
  <text class="label mid" x="500" y="274">one for</text>
  <text class="label mid" x="500" y="289">each</text>
  <text class="label mid" x="500" y="304">question</text>

  <!-- the design tree: this deliverable's purpose, the questions, and the decisions under them -->
  <rect class="box" x="320" y="370" width="360" height="80" rx="10"/>
  <text class="name" x="500" y="398">Design tree</text>
  <text class="kind" x="500" y="420">your purpose, the questions,</text>
  <text class="kind" x="500" y="437">and the decisions that answer them</text>

  <path class="line" d="M270,310 V410 H312" marker-end="url(#arrow)"/>
  <text class="label" x="282" y="345">its questions</text>
  <path class="line" d="M730,310 V410 H688" marker-end="url(#arrow)"/>
  <text class="label end" x="718" y="345">decides each by</text>

  <!-- the deliverable: built from the design tree, judged against the standard alone -->
  <path class="box" d="M420,490 H562 L580,508 V550 H420 Z"/>
  <path class="fold" d="M562,490 V508 H580"/>
  <text class="name" x="500" y="526">Deliverable</text>
  <path class="line" d="M500,458 V482" marker-end="url(#arrow)"/>
  <text class="label" x="512" y="475">built from it</text>
  <path class="line" d="M150,310 V520 H412" marker-end="url(#arrow)"/>
  <text class="label" x="162" y="500">evaluates it alone</text>
</svg>
