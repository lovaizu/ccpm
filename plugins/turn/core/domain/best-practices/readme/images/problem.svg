<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The usual way and Turn, with the five problems marked</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="500"/>
  <rect class="frame" x="10" y="10" width="980" height="190" rx="8"/>
  <text class="frame-name" x="24" y="32">The usual way: an AI asked in one prompt, its draft read and mended</text>
  <rect class="box" x="40" y="60" width="120" height="60" rx="6"/>
  <text class="name" x="100.0" y="95.0">You</text>
  <rect class="box" x="300" y="60" width="170" height="60" rx="6"/>
  <text class="name" x="385.0" y="88.0">AI</text>
  <text class="kind" x="385.0" y="106.0">starts from scratch</text>
  <rect class="store" x="580" y="60" width="120" height="60" rx="6"/>
  <text class="name" x="640.0" y="88.0">Draft</text>
  <text class="kind" x="640.0" y="106.0">and its review</text>
  <rect class="box" x="810" y="60" width="160" height="60" rx="6"/>
  <text class="name" x="890.0" y="88.0">You</text>
  <text class="kind" x="890.0" y="106.0">read and mend</text>
  <path class="line" d="M160,90 L296,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="228" y="80">a request</text>
  <text class="label small mid halo" x="228" y="105">with gaps</text>
  <path class="line" d="M470,90 L576,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="523" y="80">each gap</text>
  <text class="label small mid halo" x="523" y="105">a guess</text>
  <path class="line" d="M700,90 L806,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="753" y="80">many findings,</text>
  <text class="label small mid halo" x="753" y="105">few that matter</text>
  <path class="line dashed" d="M890,120 L890,148 L640,148 L640,124" marker-end="url(#a)"/>
  <text class="label small mid halo" x="765" y="166">each fix added on</text>
  <text class="label small" x="60" y="182">You find what falls short only as you use the work.</text>
  <circle class="lane" cx="300" cy="60" r="11"/>
  <text class="name" x="300" y="65">1</text>
  <circle class="lane" cx="523" cy="58" r="11"/>
  <text class="name" x="523" y="63">3</text>
  <circle class="lane" cx="753" cy="58" r="11"/>
  <text class="name" x="753" y="63">2</text>
  <circle class="lane" cx="45" cy="177" r="11"/>
  <text class="name" x="45" y="182">4</text>
  <circle class="lane" cx="890" cy="148" r="11"/>
  <text class="name" x="890" y="153">5</text>
  <rect class="frame" x="10" y="220" width="980" height="270" rx="8"/>
  <text class="frame-name" x="24" y="242">Turn</text>
  <rect class="box" x="40" y="280" width="120" height="60" rx="6"/>
  <text class="name" x="100.0" y="315.0">You</text>
  <rect class="store" x="300" y="270" width="170" height="80" rx="6"/>
  <text class="name" x="385.0" y="308.0">Design</text>
  <text class="kind" x="385.0" y="326.0">each point settled</text>
  <rect class="store" x="580" y="270" width="120" height="80" rx="6"/>
  <text class="name" x="640.0" y="315.0">Work</text>
  <rect class="box" x="810" y="280" width="160" height="60" rx="6"/>
  <text class="name" x="890.0" y="308.0">You</text>
  <text class="kind" x="890.0" y="326.0">use the work</text>
  <path class="line" d="M160,300 L296,300" marker-end="url(#a)"/>
  <text class="label small mid halo" x="228" y="278">your decisions,</text>
  <text class="label small mid halo" x="228" y="292">one at a time</text>
  <path class="line" d="M296,326 L164,326" marker-end="url(#a)"/>
  <text class="label small mid halo" x="228" y="344">facts to confirm</text>
  <path class="line" d="M470,310 L576,310" marker-end="url(#a)"/>
  <text class="label small mid halo" x="523" y="288">by the kind’s</text>
  <text class="label small mid halo" x="523" y="302">best practice</text>
  <path class="line" d="M700,310 L806,310" marker-end="url(#a)"/>
  <text class="label small mid halo" x="753" y="300">as it comes</text>
  <rect class="lane" x="560" y="400" width="160" height="56" rx="6"/>
  <text class="name" x="640.0" y="424.0">A fresh AI</text>
  <text class="kind" x="640.0" y="442.0">asks only the questions</text>
  <path class="line" d="M640,400 L640,354" marker-end="url(#a)"/>
  <text class="label small start" x="650" y="374">tries it as its reader would</text>
  <path class="line dashed" d="M560,428 L385,428 L385,354" marker-end="url(#a)"/>
  <text class="label small mid halo" x="470" y="414">a question not met</text>
  <text class="label small mid halo" x="470" y="446">back to its decision</text>
  <circle class="lane" cx="300" cy="270" r="11"/>
  <text class="name" x="300" y="275">3</text>
  <circle class="lane" cx="523" cy="268" r="11"/>
  <text class="name" x="523" y="273">1</text>
  <circle class="lane" cx="720" cy="400" r="11"/>
  <text class="name" x="720" y="405">2</text>
  <circle class="lane" cx="642" cy="378" r="11"/>
  <text class="name" x="642" y="383">4</text>
  <circle class="lane" cx="385" cy="428" r="11"/>
  <text class="name" x="385" y="433">5</text>
</svg>
