<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How the product works</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="440"/>
  <rect class="box" x="20" y="150" width="150" height="60" rx="6"/>
  <text class="name mid" x="95.0" y="184" text-anchor="middle">&lt;user&gt;</text>
  <rect class="frame" x="230" y="20" width="750" height="360" rx="8"/>
  <text class="frame-name start" x="244" y="42" text-anchor="start">&lt;Product&gt;</text>
  <rect class="box" x="270" y="70" width="190" height="60" rx="6"/>
  <text class="name mid" x="365.0" y="106" text-anchor="middle">&lt;part&gt;</text>
  <path class="store" d="M560,66 A95.0,9 0 0 1 750,66 V126 A95.0,9 0 0 1 560,126 Z"/>
  <path class="store" d="M560,66 A95.0,9 0 0 0 750,66"/>
  <text class="name mid" x="655.0" y="108" text-anchor="middle">&lt;data&gt;</text>
  <rect class="unit" x="445" y="255" width="330" height="90" rx="10"/>
  <text class="frame-name mid" x="610" y="365" text-anchor="middle">&lt;doubt&gt;: these lines do it</text>
  <rect class="box" x="270" y="270" width="190" height="60" rx="6"/>
  <text class="name mid" x="365.0" y="306" text-anchor="middle">&lt;part&gt;</text>
  <rect class="box" x="760" y="270" width="190" height="60" rx="6"/>
  <text class="name mid" x="855.0" y="306" text-anchor="middle">&lt;part&gt;</text>
  <path class="line" d="M170,168 L266,110" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="95" y="128" text-anchor="middle">&lt;what the user gives&gt;</text>
  <path class="line" d="M460,100 L556,100" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="508" y="90" text-anchor="middle">&lt;does what&gt;</text>
  <path class="line" d="M655,140 L366,266" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="560" y="200" text-anchor="start">&lt;does what&gt;</text>
  <path class="line" d="M460,300 L756,300" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="608" y="290" text-anchor="middle">&lt;does what&gt;</text>
  <path class="line" d="M855,330 L855,410 L95,410 L95,214" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="475" y="402" text-anchor="middle">&lt;what the user gets&gt;</text>
</svg>
