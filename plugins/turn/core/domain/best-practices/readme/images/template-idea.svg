<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The usual way and the product</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="420"/>
  <rect class="frame" x="10" y="10" width="980" height="190" rx="8"/>
  <text class="frame-name start" x="24" y="32" text-anchor="start">&lt;The usual way&gt;</text>
  <rect class="box" x="40" y="60" width="200" height="60" rx="6"/>
  <text class="name mid" x="140.0" y="94" text-anchor="middle">&lt;who&gt;</text>
  <rect class="box" x="400" y="60" width="200" height="60" rx="6"/>
  <text class="name mid" x="500.0" y="94" text-anchor="middle">&lt;whom&gt;</text>
  <rect class="box" x="760" y="60" width="200" height="60" rx="6"/>
  <text class="name mid" x="860.0" y="94" text-anchor="middle">&lt;whom&gt;</text>
  <path class="line" d="M240,90 L396,90" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="318" y="82" text-anchor="middle">&lt;does what&gt;</text>
  <path class="line dashed" d="M600,90 L756,90" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="678" y="82" text-anchor="middle">&lt;does what&gt;</text>
  <text class="label small halo mid" x="678" y="112" text-anchor="middle">where the usual way</text>
  <text class="label small halo mid" x="678" y="127" text-anchor="middle">falls short</text>
  <text class="label small start" x="40" y="182" text-anchor="start">Each row: who does what to whom, one box for each one that takes part.</text>
  <rect class="frame" x="10" y="220" width="980" height="190" rx="8"/>
  <text class="frame-name start" x="24" y="242" text-anchor="start">&lt;Product&gt;</text>
  <rect class="box" x="40" y="270" width="200" height="60" rx="6"/>
  <text class="name mid" x="140.0" y="304" text-anchor="middle">&lt;who&gt;</text>
  <rect class="lane" x="400" y="270" width="200" height="60" rx="6"/>
  <text class="name mid" x="500.0" y="304" text-anchor="middle">&lt;Product&gt;</text>
  <rect class="box" x="760" y="270" width="200" height="60" rx="6"/>
  <text class="name mid" x="860.0" y="304" text-anchor="middle">&lt;whom&gt;</text>
  <path class="line" d="M240,300 L396,300" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="318" y="292" text-anchor="middle">&lt;does what&gt;</text>
  <path class="line" d="M600,300 L756,300" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="678" y="292" text-anchor="middle">&lt;does what&gt;</text>
  <text class="label small halo mid" x="678" y="322" text-anchor="middle">what &lt;Product&gt; does</text>
  <text class="label small halo mid" x="678" y="337" text-anchor="middle">there instead</text>
  <text class="label small start" x="40" y="392" text-anchor="start">The same work, with &lt;Product&gt; at each step where the usual way falls short.</text>
</svg>
