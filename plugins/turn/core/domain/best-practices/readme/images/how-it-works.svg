<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How Turn works, with the lines that answer each doubt marked A and B</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="480"/>

  <rect class="box" x="20" y="150" width="140" height="56" rx="8"/>
  <text class="name" x="90.0" y="183.0">you</text>
  <rect class="frame" x="230" y="20" width="750" height="400" rx="10"/>
  <text class="frame-name" x="244" y="42">Turn</text>

  <rect class="box lane" x="270" y="70" width="190" height="66" rx="8"/>
  <text class="name" x="365.0" y="94">Pin</text>
  <text class="kind" x="365.0" y="113">settles the design</text>
  <rect class="store" x="560" y="70" width="190" height="66" rx="8"/>
  <text class="name" x="655.0" y="94">design-tree.json</text>
  <text class="kind" x="655.0" y="113">every point, and who settled it</text>
  <rect class="store" x="270" y="190" width="190" height="66" rx="8"/>
  <text class="name" x="365.0" y="214">the best practices</text>
  <text class="kind" x="365.0" y="233">template, practices, questions</text>
  <rect class="box" x="270" y="310" width="190" height="66" rx="8"/>
  <text class="name" x="365.0" y="334">generator</text>
  <text class="kind" x="365.0" y="353">makes the work</text>
  <rect class="store" x="560" y="310" width="190" height="66" rx="8"/>
  <text class="name" x="655.0" y="334">the work</text>
  <text class="kind" x="655.0" y="353">such as README.md</text>
  <rect class="box" x="790" y="310" width="170" height="66" rx="8"/>
  <text class="name" x="875.0" y="334">evaluator</text>
  <text class="kind" x="875.0" y="353">judges the work</text>

  <path class="line" d="M160,165 L270,95" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="40" y="110">your request,</text>
  <text class="label small halo start" x="40" y="126">each answer</text>
  <path class="line" d="M270,120 L160,185" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="222" y="168">each point</text>
  <path class="line" d="M460,103 L560,103" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="510" y="94">writes</text>
  <path class="line" d="M600,136 L440,310" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="560" y="178">reads</text>
  <path class="line" d="M365,256 L365,310" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="408" y="288">its kind's</text>
  <path class="line" d="M460,343 L560,343" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="510" y="334">writes</text>
  <path class="line" d="M750,343 L790,343" marker-end="url(#arrow)"/>
  <path class="line" d="M460,223 L875,223 L875,310" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="700" y="214">the questions alone</text>
  <path class="line dashed" d="M920,310 L920,50 L365,50 L365,70" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="650" y="64">a question not met, back to its decision</text>
  <path class="line" d="M655,376 L655,450 L90,450 L90,206" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="380" y="442">the work, not committed</text>
  <circle class="lane" cx="258" cy="66" r="11"/>
  <text class="name" x="258" y="71">A</text>
  <circle class="lane" cx="958" cy="312" r="11"/>
  <text class="name" x="958" y="317">B</text>
</svg>
