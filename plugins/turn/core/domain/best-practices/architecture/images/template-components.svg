<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The product's components</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="620"/>
  <circle class="ext" cx="190.0" cy="40" r="11"/>
  <rect class="ext" x="40" y="50" width="300" height="90" rx="22"/>
  <text class="name mid" x="190.0" y="90" text-anchor="middle">&lt;role&gt;</text>
  <text class="kind mid" x="190.0" y="110" text-anchor="middle">[&lt;who they are&gt;]</text>
  <rect class="box" x="40" y="260" width="300" height="100" rx="0"/>
  <text class="name mid" x="190.0" y="306" text-anchor="middle">&lt;component&gt;</text>
  <text class="kind mid" x="190.0" y="326" text-anchor="middle">[&lt;type&gt; · &lt;technology&gt;]</text>
  <rect class="box" x="480" y="260" width="300" height="100" rx="0"/>
  <text class="name mid" x="630.0" y="306" text-anchor="middle">&lt;component&gt;</text>
  <text class="kind mid" x="630.0" y="326" text-anchor="middle">[&lt;type&gt; · &lt;technology&gt;]</text>
  <path class="store" d="M480,450 A150.0,9 0 0 1 780,450 V520 A150.0,9 0 0 1 480,520 Z"/>
  <path class="store" d="M480,450 A150.0,9 0 0 0 780,450"/>
  <text class="name mid" x="630.0" y="487" text-anchor="middle">&lt;store&gt;</text>
  <text class="kind mid" x="630.0" y="507" text-anchor="middle">[&lt;type&gt; · &lt;technology&gt;]</text>
  <rect class="ext" x="880" y="260" width="280" height="100" rx="6"/>
  <text class="name mid" x="1020.0" y="306" text-anchor="middle">&lt;outside&gt;</text>
  <text class="kind mid" x="1020.0" y="326" text-anchor="middle">[&lt;technology&gt;]</text>
  <path class="line" d="M190,140 L190,256" marker-end="url(#arrow)"/>
  <text class="label small start" x="200" y="190" text-anchor="start">&lt;does what&gt;</text>
  <text class="data start" x="200" y="206" text-anchor="start">&lt;Data&gt;</text>
  <path class="line" d="M340,310 L476,310" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="408" y="296" text-anchor="middle">&lt;does what&gt;</text>
  <text class="data halo mid" x="408" y="330" text-anchor="middle">&lt;Data&gt;</text>
  <path class="line" d="M630,360 L630,446" marker-end="url(#arrow)"/>
  <text class="label small start" x="640" y="398" text-anchor="start">&lt;does what&gt;</text>
  <text class="data start" x="640" y="414" text-anchor="start">&lt;Data&gt;</text>
  <path class="line" d="M780,310 L876,310" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="828" y="296" text-anchor="middle">&lt;uses what&gt;</text>
  <text class="label small halo mid" x="828" y="330" text-anchor="middle">[&lt;tool&gt;]</text>
  <text class="frame-name start" x="40" y="585" text-anchor="start">Legend</text>
  <rect class="box" x="110" y="570" width="36" height="22" rx="0"/>
  <text class="label small start" x="154" y="585" text-anchor="start">component</text>
  <path class="store" d="M260,575 A18,9 0 0 1 296,575 V589 A18,9 0 0 1 260,589 Z"/>
  <path class="store" d="M260,575 A18,9 0 0 0 296,575"/>
  <text class="label small start" x="304" y="585" text-anchor="start">store of data</text>
  <rect class="ext" x="410" y="570" width="36" height="22" rx="6"/>
  <text class="label small start" x="454" y="585" text-anchor="start">outside the product; with a head: a role of the product vision</text>
  <text class="label small start" x="840" y="577" text-anchor="start">a box: name and [type · technology]</text>
  <text class="data start" x="840" y="593" text-anchor="start">data handed on, named as in the data model</text>
</svg>
