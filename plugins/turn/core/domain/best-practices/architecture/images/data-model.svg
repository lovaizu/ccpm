  <text class="label small halo" x="575" y="625" text-anchor="end">asks</text>
  <path class="head" d="M670.0,660.0 L666.4,649.8 L655.6,649.2 L659.2,659.4 Z"/>
  <text class="label small halo mid" x="506" y="555">1..*</text>
  <path class="line" d="M940,696 L850,696"/>
  <text class="label small halo" x="895" y="682" text-anchor="middle">is taken from</text>
  <text class="label small halo mid" x="922" y="713">0..*</text>
  <text class="label small halo mid" x="868" y="713">1</text>
  <path class="line" d="M940,496 L850,496"/>
  <text class="label small halo" x="895" y="482" text-anchor="middle">checks</text>
  <text class="label small halo mid" x="922" y="513">0..*</text>
  <text class="label small halo mid" x="868" y="513">1</text>
  <path class="line" d="M1150,496 L1240,496"/>
  <text class="label small halo" x="1195" y="482" text-anchor="middle">is answered in</text>
  <text class="label small halo mid" x="1168" y="513">1</text>
  <text class="label small halo mid" x="1222" y="513">1..*</text>
  <path class="line" d="M990,532 L830,660"/>
  <text class="label small halo" x="925" y="600" text-anchor="start">asks the Questions of</text>
  <text class="label small halo mid" x="970" y="537">0..*</text>
  <text class="label small halo mid" x="850" y="663">1</text>
  <text class="frame-name" x="40" y="875" text-anchor="start">Legend</text>
  <text class="label small" x="115" y="875" text-anchor="start">a number at a line's end: how many of the data at that end the other joins: 1 one, 0..1 none or one, 1..* one or more, 0..* any number</text>
  <path class="head" d="M1010,870 L1019,864 L1028,870 L1019,876 Z"/>
  <path class="line" d="M1028,870 L1060,870"/>
  <text class="label small" x="1070" y="875" text-anchor="start">at the whole, which holds its parts; a box: a data's name</text>
</svg>
