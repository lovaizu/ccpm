  <text class="label small halo" x="830" y="762" text-anchor="middle">answers each</text>
  <text class="label small halo" x="1269" y="554" text-anchor="end">0..*</text>
  <text class="label small halo" x="384" y="554" text-anchor="end">1..*</text>
