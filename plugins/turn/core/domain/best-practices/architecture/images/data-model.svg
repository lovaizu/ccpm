  <rect class="box" x="940" y="660" width="210" height="72" rx="0"/>
  <text class="name" x="1045.0" y="701" text-anchor="middle">Standard</text>
  <path class="line" d="M340,96 L250,96"/>
  <text class="label small halo" x="295" y="82" text-anchor="middle">answers</text>
  <text class="label small halo mid" x="322" y="113">1</text>
  <text class="label small halo mid" x="268" y="113">0..1</text>
  <path class="line" d="M445,132 L445,260"/>
