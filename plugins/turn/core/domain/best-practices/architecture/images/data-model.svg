  <text class="label small halo" x="459" y="354" text-anchor="end">0..*</text>
  <text class="label small halo" x="459" y="446" text-anchor="end">1..*</text>
  <path class="line" d="M340,496 L250,496"/>
  <text class="label small halo" x="295" y="482" text-anchor="middle">serves</text>
  <text class="label small halo mid" x="322" y="513">0..*</text>
  <text class="label small halo mid" x="268" y="513">1..*</text>
  <path class="line" d="M680,460 L515,332"/>
  <text class="label small halo" x="600" y="430" text-anchor="end">is designed in</text>
  <text class="label small halo mid" x="675" y="445">1</text>
  <text class="label small halo mid" x="520" y="355">1</text>
  <path class="line" d="M745,332 L745,460"/>
  <text class="label small halo" x="753" y="400" text-anchor="start">makes, in order</text>
  <text class="label small halo" x="739" y="354" text-anchor="end">1</text>
  <text class="label small halo" x="739" y="446" text-anchor="end">1..*</text>
  <path class="line" d="M940,296 L850,296"/>
