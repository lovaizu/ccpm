  <text class="label small halo mid" x="922" y="313">0..*</text>
  <text class="label small halo mid" x="868" y="313">1</text>
  <path class="line" d="M1045,332 L1045,460"/>
  <text class="label small halo" x="1053" y="400" text-anchor="start">names a group of</text>
  <text class="label small halo" x="1039" y="354" text-anchor="end">0..*</text>
  <text class="label small halo" x="1039" y="446" text-anchor="end">0..1</text>
