<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>For a kind rn has no best practice for, rn makes one first</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="270"/>
  <rect class="box" x="20" y="50" width="190" height="70" rx="6"/>
  <text class="name" x="115.0" y="82.0">Your kind of work</text>
  <text class="kind" x="115.0" y="101.0">no best practice yet</text>
  <rect class="store" x="320" y="45" width="220" height="80" rx="6"/>
  <text class="name" x="430.0" y="82.0">Best practice</text>
  <text class="kind" x="430.0" y="101.0">for best practices</text>
  <rect class="store" x="640" y="45" width="340" height="80" rx="6"/>
  <text class="name" x="810.0" y="82.0">Your kind's best practice</text>
  <text class="kind" x="810.0" y="101.0">.rn/&lt;date&gt;-&lt;goal&gt;/best-practices/</text>
  <rect class="store" x="710" y="190" width="200" height="60" rx="6"/>
  <text class="name" x="810.0" y="225.0">Your piece</text>
  <path class="line" d="M210,85 L316,85" marker-end="url(#a)"/>
  <path class="line" d="M540,85 L636,85" marker-end="url(#a)"/>
  <text class="label small mid halo" x="588" y="75">rn makes one</text>
  <path class="line" d="M810,125 L810,186" marker-end="url(#a)"/>
  <text class="label small start halo" x="820" y="160">made by it</text>
</svg>
