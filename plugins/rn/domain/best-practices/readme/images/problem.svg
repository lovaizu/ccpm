<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>In the usual way you are in the fix loop, and with rn the loop runs without you</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
      <rect class="bg" width="1000" height="530"/>
  <rect class="frame" x="10" y="10" width="980" height="180" rx="8"/>
  <text class="frame-name" x="24" y="32">The usual way: you ask an AI in one prompt, and you are in the fix loop</text>
  <rect class="box" x="40" y="60" width="120" height="60" rx="6"/>
  <text class="name" x="100.0" y="95.0">You</text>
  <rect class="box" x="330" y="60" width="150" height="60" rx="6"/>
  <text class="name" x="405.0" y="95.0">AI</text>
  <rect class="store" x="620" y="60" width="120" height="60" rx="6"/>
  <text class="name" x="680.0" y="95.0">Draft</text>
  <path class="line" d="M160,90 L326,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="243" y="80">a prompt</text>
  <path class="line" d="M480,90 L616,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="548" y="80">writes</text>
  <path class="line" d="M680,120 L680,165 L100,165 L100,124" marker-end="url(#a)"/>
  <text class="label small mid halo" x="390" y="155">you read each draft and ask for fixes, and the fixes pile up</text>
  <rect class="frame" x="10" y="205" width="980" height="315" rx="8"/>
  <text class="frame-name" x="24" y="227">rn: the fix loop runs without you</text>
  <rect class="box" x="30" y="280" width="100" height="60" rx="6"/>
  <text class="name" x="80.0" y="315.0">You</text>
  <rect class="store" x="260" y="260" width="180" height="100" rx="6"/>
  <text class="name" x="350.0" y="297.0">Design tree</text>
  <text class="kind" x="350.0" y="316.0">only the decisions</text>
  <text class="kind" x="350.0" y="332.0">that matter</text>
  <rect class="box" x="510" y="280" width="150" height="60" rx="6"/>
  <text class="name" x="585.0" y="315.0">Generator</text>
  <rect class="store" x="710" y="270" width="120" height="80" rx="6"/>
  <text class="name" x="770.0" y="315.0">Piece</text>
  <rect class="box" x="900" y="280" width="80" height="60" rx="6"/>
  <text class="name" x="940.0" y="315.0">You</text>
  <path class="line" d="M130,295 L256,295" marker-end="url(#a)"/>
  <text class="label small mid halo" x="193" y="285">your words</text>
  <path class="line dashed" d="M256,325 L134,325" marker-end="url(#a)"/>
  <text class="label small mid halo" x="193" y="350">only your points,</text>
  <text class="label small mid halo" x="193" y="365">one at a time</text>
  <path class="line" d="M440,310 L506,310" marker-end="url(#a)"/>
  <text class="label small mid halo" x="473" y="285">by its kind's</text>
  <text class="label small mid halo" x="473" y="300">best practice</text>
  <path class="line" d="M660,310 L706,310" marker-end="url(#a)"/>
  <text class="label small mid halo" x="683" y="300">builds</text>
  <path class="line" d="M830,310 L896,310" marker-end="url(#a)"/>
  <text class="label small mid halo" x="863" y="300">to merge</text>
  <rect class="lane" x="685" y="420" width="170" height="50" rx="6"/>
  <text class="name" x="770.0" y="450.0">Evaluator</text>
  <path class="line" d="M770,420 L770,354" marker-end="url(#a)"/>
  <text class="label small start halo" x="788" y="390">reads it as its users do</text>
  <path class="line dashed" d="M685,445 L350,445 L350,364" marker-end="url(#a)"/>
  <text class="label small mid halo" x="515" y="435">a shortfall: back to its decision</text>
</svg>
