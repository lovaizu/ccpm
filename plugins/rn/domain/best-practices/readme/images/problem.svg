<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The usual way and rn, with the five problems marked</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="540"/>
  <rect class="frame" x="10" y="10" width="980" height="200" rx="8"/>
  <text class="frame-name" x="24" y="32">The usual way: you ask an AI in one prompt, then read and fix its draft</text>
  <rect class="box" x="40" y="60" width="120" height="60" rx="6"/>
  <text class="name" x="100.0" y="95.0">You</text>
  <rect class="box" x="300" y="60" width="170" height="60" rx="6"/>
  <text class="name" x="385.0" y="95.0">AI</text>
  <rect class="store" x="580" y="60" width="120" height="60" rx="6"/>
  <text class="name" x="640.0" y="95.0">Draft</text>
  <rect class="box" x="810" y="60" width="160" height="60" rx="6"/>
  <text class="name" x="890.0" y="95.0">You</text>
  <path class="line" d="M160,90 L296,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="228" y="80">a request,</text>
  <text class="label small mid halo" x="228" y="105">each gap a guess</text>
  <text class="label small mid halo" x="385" y="140">from what similar texts say</text>
  <path class="line" d="M470,90 L576,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="523" y="80">one piece,</text>
  <text class="label small mid halo" x="523" y="105">the rest missed</text>
  <path class="line" d="M700,90 L806,90" marker-end="url(#a)"/>
  <text class="label small mid halo" x="753" y="80">many findings,</text>
  <text class="label small mid halo" x="753" y="105">few that matter</text>
  <text class="label small" x="60" y="190">The AI keeps a step one time and skips it the next, and a new conversation starts the work over.</text>
  <circle class="lane" cx="228" cy="58" r="11"/>
  <text class="name" x="228" y="63">4</text>
  <circle class="lane" cx="300" cy="60" r="11"/>
  <text class="name" x="300" y="65">2</text>
  <circle class="lane" cx="523" cy="58" r="11"/>
  <text class="name" x="523" y="63">1</text>
  <circle class="lane" cx="753" cy="58" r="11"/>
  <text class="name" x="753" y="63">3</text>
  <circle class="lane" cx="45" cy="185" r="11"/>
  <text class="name" x="45" y="190">5</text>
  <rect class="frame" x="10" y="230" width="980" height="300" rx="8"/>
  <text class="frame-name" x="24" y="252">rn</text>
  <rect class="box" x="40" y="300" width="120" height="60" rx="6"/>
  <text class="name" x="100.0" y="335.0">You</text>
  <rect class="store" x="230" y="290" width="160" height="80" rx="6"/>
  <text class="name" x="310.0" y="327.0">Plan</text>
  <text class="kind" x="310.0" y="346.0">every piece, in order</text>
  <rect class="box" x="480" y="300" width="150" height="60" rx="6"/>
  <text class="name" x="555.0" y="335.0">Generator</text>
  <rect class="store" x="710" y="290" width="120" height="80" rx="6"/>
  <text class="name" x="770.0" y="335.0">Piece</text>
  <rect class="box" x="880" y="300" width="100" height="60" rx="6"/>
  <text class="name" x="930.0" y="335.0">You</text>
  <path class="line" d="M160,315 L226,315" marker-end="url(#a)"/>
  <text class="label small mid halo" x="193" y="300">your words</text>
  <path class="line dashed" d="M226,345 L164,345" marker-end="url(#a)"/>
  <text class="label small mid halo" x="193" y="385">only your questions,</text>
  <text class="label small mid halo" x="193" y="400">one at a time</text>
  <path class="line" d="M390,330 L476,330" marker-end="url(#a)"/>
  <text class="label small mid halo" x="433" y="305">by its kind's</text>
  <text class="label small mid halo" x="433" y="320">best practice</text>
  <path class="line" d="M630,330 L706,330" marker-end="url(#a)"/>
  <text class="label small mid halo" x="668" y="320">builds</text>
  <path class="line" d="M830,330 L876,330" marker-end="url(#a)"/>
  <rect class="lane" x="690" y="410" width="160" height="50" rx="6"/>
  <text class="name" x="770.0" y="440.0">Evaluator</text>
  <path class="line" d="M770,410 L770,374" marker-end="url(#a)"/>
  <text class="label small start halo" x="788" y="395">tries it as its users would</text>
  <path class="line dashed" d="M690,435 L555,435 L555,364" marker-end="url(#a)"/>
  <text class="label small mid halo" x="620" y="425">an item not met</text>
  <rect class="lane" x="230" y="480" width="620" height="36" rx="6"/>
  <text class="name" x="540.0" y="503.0">Lane enforces every step, and .rn/ keeps the work to pick up</text>
  <circle class="lane" cx="310" cy="290" r="11"/>
  <text class="name" x="310" y="295">1</text>
  <circle class="lane" cx="480" cy="300" r="11"/>
  <text class="name" x="480" y="305">2</text>
  <circle class="lane" cx="770" cy="392" r="11"/>
  <text class="name" x="770" y="397">3</text>
  <circle class="lane" cx="193" cy="345" r="11"/>
  <text class="name" x="193" y="350">4</text>
  <circle class="lane" cx="230" cy="498" r="11"/>
  <text class="name" x="230" y="503">5</text>
</svg>
