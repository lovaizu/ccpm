<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The product's deployment</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1260" height="520"/>
  <rect class="frame" x="20" y="20" width="840" height="400" rx="8"/>
  <text class="frame-name start" x="34" y="42" text-anchor="start">&lt;environment&gt;</text>
  <text class="kind start" x="260" y="42" text-anchor="start">[&lt;technology&gt;]</text>
  <rect class="unit" x="60" y="80" width="330" height="110" rx="6"/>
  <text class="name mid" x="225.0" y="115" text-anchor="middle">&lt;deployment unit&gt;</text>
  <text class="kind mid" x="225.0" y="135" text-anchor="middle">[&lt;technology&gt;]</text>
  <text class="label small mid" x="225.0" y="151" text-anchor="middle">&lt;component&gt;, &lt;component&gt;</text>
  <text class="data mid" x="225.0" y="167" text-anchor="middle">&lt;data&gt;</text>
  <rect class="unit" x="490" y="80" width="330" height="110" rx="6"/>
  <text class="name mid" x="655.0" y="115" text-anchor="middle">&lt;deployment unit&gt;</text>
  <text class="kind mid" x="655.0" y="135" text-anchor="middle">[&lt;technology&gt;]</text>
  <text class="label small mid" x="655.0" y="151" text-anchor="middle">&lt;component&gt;, &lt;component&gt;</text>
  <text class="data mid" x="655.0" y="167" text-anchor="middle">&lt;data&gt;</text>
  <rect class="unit" x="60" y="280" width="330" height="110" rx="6"/>
  <text class="name mid" x="225.0" y="315" text-anchor="middle">&lt;deployment unit&gt;</text>
  <text class="kind mid" x="225.0" y="335" text-anchor="middle">[&lt;technology&gt;]</text>
  <text class="label small mid" x="225.0" y="351" text-anchor="middle">&lt;component&gt;, &lt;component&gt;</text>
  <text class="data mid" x="225.0" y="367" text-anchor="middle">&lt;data&gt;</text>
  <rect class="ext" x="1000" y="80" width="230" height="70" rx="6"/>
  <text class="name mid" x="1115.0" y="111" text-anchor="middle">&lt;outside&gt;</text>
  <text class="kind mid" x="1115.0" y="131" text-anchor="middle">[&lt;protocol or tool&gt;]</text>
  <path class="line" d="M390,135 L486,135" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="438" y="125" text-anchor="middle">&lt;does what&gt;</text>
  <path class="line" d="M225,190 L225,276" marker-end="url(#arrow)"/>
  <text class="label small start" x="235" y="238" text-anchor="start">&lt;does what&gt; [&lt;tool&gt;]</text>
  <path class="line" d="M820,115 L996,115" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="930" y="105" text-anchor="middle">&lt;what is used&gt;</text>
  <text class="frame-name start" x="40" y="470" text-anchor="start">Legend</text>
  <rect class="frame" x="110" y="455" width="36" height="22" rx="4"/>
  <text class="label small start" x="154" y="470" text-anchor="start">environment [technology]</text>
  <rect class="unit" x="340" y="455" width="36" height="22" rx="4"/>
  <text class="label small start" x="384" y="470" text-anchor="start">deployment unit [technology]: the components that run in it</text>
  <text class="data start" x="780" y="470" text-anchor="start">data kept</text>
  <rect class="ext" x="860" y="455" width="36" height="22" rx="4"/>
  <text class="label small start" x="904" y="470" text-anchor="start">outside the product, an arrow: what it uses</text>
</svg>
