<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <title>The product's data</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="420"/>
  <rect class="frame" x="24" y="26" width="252" height="122" rx="8"/>
  <text class="frame-name start" x="36" y="46" text-anchor="start">&lt;component that keeps it&gt;</text>
  <rect class="box" x="40" y="60" width="220" height="72" rx="0"/>
  <text class="name mid" x="150.0" y="101" text-anchor="middle">&lt;Data&gt;</text>
  <rect class="box" x="640" y="60" width="220" height="72" rx="0"/>
  <text class="name mid" x="750.0" y="101" text-anchor="middle">&lt;Data&gt;</text>
  <rect class="box" x="340" y="250" width="220" height="72" rx="0"/>
  <text class="name mid" x="450.0" y="291" text-anchor="middle">&lt;Data&gt;</text>
  <path class="line" d="M260,96 L640,96"/>
  <text class="label small halo mid" x="292" y="113" text-anchor="middle">1</text>
  <text class="label small halo mid" x="618" y="113" text-anchor="middle">0..*</text>
  <text class="label small halo mid" x="450" y="86" text-anchor="middle">&lt;relation&gt;</text>
  <path class="line" d="M180,132 L400,250"/>
  <text class="label small halo mid" x="226" y="168" text-anchor="middle">0..1</text>
  <text class="label small halo mid" x="398" y="226" text-anchor="middle">1..*</text>
  <text class="label small halo" x="270" y="200" text-anchor="end">&lt;relation&gt;</text>
  <path class="line" d="M760,132 L500,250"/>
  <path class="head" d="M760.0,132.0 L754.3,142.5 L743.6,139.4 L749.3,128.9 Z"/>
  <text class="label small halo mid" x="526" y="228" text-anchor="middle">1..*</text>
  <text class="label small halo start" x="650" y="200" text-anchor="start">&lt;relation&gt;</text>
  <text class="frame-name start" x="40" y="385" text-anchor="start">Legend</text>
  <text class="label small start" x="115" y="385" text-anchor="start">a number at a line's end: how many of the data at that end the other joins</text>
  <path class="head" d="M590,380 L599,374 L608,380 L599,386 Z"/>
  <path class="line" d="M608,380 L640,380"/>
  <text class="label small start" x="650" y="385" text-anchor="start">at the whole, which holds its parts</text>
  <text class="label small start" x="115" y="405" text-anchor="start">a frame: the data one component keeps</text>
</svg>
