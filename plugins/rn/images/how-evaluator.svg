<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>The evaluator gets the piece and its questions, never the design</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="300"/>
  <rect class="store" x="20" y="70" width="160" height="70" rx="6"/>
  <text class="name" x="100.0" y="110.0">Design</text>
  <rect class="box" x="260" y="75" width="170" height="60" rx="6"/>
  <text class="name" x="345.0" y="110.0">Generator</text>
  <rect class="store" x="520" y="70" width="140" height="70" rx="6"/>
  <text class="name" x="590.0" y="110.0">Piece</text>
  <rect class="lane" x="760" y="75" width="200" height="60" rx="6"/>
  <text class="name" x="860.0" y="110.0">Evaluator</text>
  <rect class="store" x="760" y="200" width="200" height="60" rx="6"/>
  <text class="name" x="860.0" y="227.0">Questions</text>
  <text class="kind" x="860.0" y="246.0">of the piece's kind</text>
  <path class="line" d="M180,105 L256,105" marker-end="url(#a)"/>
  <path class="line" d="M430,105 L516,105" marker-end="url(#a)"/>
  <text class="label small mid halo" x="473" y="95">makes</text>
  <path class="line" d="M660,105 L756,105" marker-end="url(#a)"/>
  <text class="label small mid halo" x="708" y="95">the piece</text>
  <path class="line" d="M860,200 L860,139" marker-end="url(#a)"/>
  <path class="line dashed" d="M860,75 L860,30 L345,30 L345,71" marker-end="url(#a)"/>
  <text class="label small mid halo" x="600" y="22">a question not met: made again</text>
  <path class="line dashed" d="M100,140 L100,280 L690,280"/>
  <path class="line" d="M684,270 L704,290 M704,270 L684,290"/>
  <text class="label small mid halo" x="400" y="270">never reaches the evaluator</text>
</svg>
