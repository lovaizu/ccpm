<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Working with an AI, small fixes pile up and bury the few points that matter, and with rn only those few build up</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="500"/>
  <rect class="frame" x="10" y="10" width="980" height="230" rx="8"/>
  <text class="frame-name" x="24" y="32">Working with an AI: small fixes pile up</text>
  <rect class="box" x="40" y="85" width="120" height="60" rx="6"/>
  <text class="name" x="100" y="120">You</text>
  <rect class="box" x="300" y="85" width="140" height="60" rx="6"/>
  <text class="name" x="370" y="120">AI</text>
  <rect class="store" x="600" y="45" width="360" height="150" rx="6"/>
  <text class="name" x="780" y="68">Your work</text>
  <rect class="lane" x="640" y="120" width="80" height="24" rx="4"/>
  <rect class="lane" x="745" y="150" width="80" height="24" rx="4"/>
  <rect class="lane" x="850" y="100" width="80" height="24" rx="4"/>
  <rect class="box" x="854" y="160" width="28" height="12" rx="2"/>
  <rect class="box" x="731" y="104" width="28" height="12" rx="2"/>
  <rect class="box" x="893" y="140" width="28" height="12" rx="2"/>
  <rect class="box" x="689" y="146" width="28" height="12" rx="2"/>
  <rect class="box" x="619" y="165" width="28" height="12" rx="2"/>
  <rect class="box" x="644" y="100" width="28" height="12" rx="2"/>
  <rect class="box" x="914" y="85" width="28" height="12" rx="2"/>
  <rect class="box" x="766" y="83" width="28" height="12" rx="2"/>
  <rect class="box" x="916" y="172" width="28" height="12" rx="2"/>
  <rect class="box" x="830" y="130" width="28" height="12" rx="2"/>
  <rect class="box" x="661" y="84" width="28" height="12" rx="2"/>
  <rect class="box" x="766" y="133" width="28" height="12" rx="2"/>
  <rect class="box" x="730" y="123" width="28" height="12" rx="2"/>
  <rect class="box" x="695" y="169" width="28" height="12" rx="2"/>
  <rect class="box" x="822" y="99" width="28" height="12" rx="2"/>
  <rect class="box" x="862" y="82" width="28" height="12" rx="2"/>
  <rect class="box" x="915" y="156" width="28" height="12" rx="2"/>
  <rect class="box" x="775" y="102" width="28" height="12" rx="2"/>
  <rect class="box" x="698" y="90" width="28" height="12" rx="2"/>
  <rect class="box" x="629" y="147" width="28" height="12" rx="2"/>
  <rect class="box" x="821" y="84" width="28" height="12" rx="2"/>
  <rect class="box" x="845" y="176" width="28" height="12" rx="2"/>
  <rect class="box" x="612" y="87" width="28" height="12" rx="2"/>
  <rect class="box" x="748" y="176" width="28" height="12" rx="2"/>
  <rect class="box" x="862" y="130" width="28" height="12" rx="2"/>
  <rect class="box" x="800" y="176" width="28" height="12" rx="2"/>
  <path class="line" d="M160,115 L296,115" marker-end="url(#a)"/>
  <text class="label small mid halo" x="228" y="105">asks</text>
  <path class="line" d="M440,115 L596,115" marker-end="url(#a)"/>
  <text class="label small mid halo" x="518" y="105">adds to it</text>
  <path class="line" d="M780,195 L780,220 L100,220 L100,149" marker-end="url(#a)"/>
  <text class="label small mid halo" x="440" y="224">you review it and ask for fixes, round after round</text>
  <rect class="frame" x="10" y="255" width="980" height="235" rx="8"/>
  <text class="frame-name" x="24" y="277">rn: only the few points that matter build up</text>
  <rect class="box" x="40" y="330" width="120" height="60" rx="6"/>
  <text class="name" x="100" y="365">You</text>
  <rect class="box" x="300" y="320" width="140" height="80" rx="6"/>
  <text class="name" x="370" y="352">rn</text>
  <text class="kind" x="370" y="372">by the best practice</text>
  <text class="kind" x="370" y="387">for each kind of work</text>
  <rect class="store" x="600" y="290" width="360" height="150" rx="6"/>
  <text class="name" x="780" y="313">Your work</text>
  <rect class="lane" x="640" y="365" width="80" height="24" rx="4"/>
  <rect class="lane" x="745" y="395" width="80" height="24" rx="4"/>
  <rect class="lane" x="850" y="345" width="80" height="24" rx="4"/>
  <path class="line" d="M160,360 L296,360" marker-end="url(#a)"/>
  <text class="label small mid halo" x="228" y="350">your goal</text>
  <path class="line" d="M440,360 L596,360" marker-end="url(#a)"/>
  <text class="label small mid halo" x="518" y="350">builds it</text>
  <path class="line dashed" d="M780,440 L780,465 L370,465 L370,404" marker-end="url(#a)"/>
  <text class="label small mid halo" x="575" y="469">checks it as its users would, and takes a problem back to the plan</text>
  <rect class="lane" x="40" y="425" width="40" height="14" rx="3"/>
  <text class="label small" x="88" y="436">a point that matters</text>
  <rect class="box" x="40" y="447" width="28" height="12" rx="2"/>
  <text class="label small" x="88" y="457">a small fix</text>
</svg>
