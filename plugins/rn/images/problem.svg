<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>In the usual way you are in the fix loop, and with rn the loop runs without you, with the five problems marked</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
    <rect class="bg" width="1000" height="610"/>
  <rect class="frame" x="10" y="10" width="980" height="230" rx="8"/>
  <text class="frame-name" x="24" y="32">The usual way: you ask an AI in one prompt, and you are in the fix loop</text>
  <rect class="box" x="40" y="70" width="120" height="60" rx="6"/>
  <text class="name" x="100.0" y="105.0">You</text>
  <rect class="box" x="330" y="70" width="150" height="60" rx="6"/>
  <text class="name" x="405.0" y="105.0">AI</text>
  <rect class="store" x="620" y="70" width="120" height="60" rx="6"/>
  <text class="name" x="680.0" y="105.0">Draft</text>
  <path class="line" d="M160,100 L326,100" marker-end="url(#a)"/>
  <text class="label small mid halo" x="243" y="90">a prompt,</text>
  <text class="label small mid halo" x="243" y="118">each gap a guess</text>
  <path class="line" d="M480,100 L616,100" marker-end="url(#a)"/>
  <text class="label small mid halo" x="548" y="90">one piece,</text>
  <text class="label small mid halo" x="548" y="118">the rest missed</text>
  <path class="line" d="M680,130 L680,185 L100,185 L100,134" marker-end="url(#a)"/>
  <text class="label small mid halo" x="290" y="172">judged by how it reads to you</text>
  <text class="label small mid halo" x="530" y="172">fixes pile up, few that matter</text>
  <text class="label small" x="60" y="220">The AI keeps a step one time and skips it the next, and a new conversation starts the work over.</text>
  <circle class="lane" cx="243" cy="58" r="11"/>
  <text class="name" x="243" y="63">3</text>
  <circle class="lane" cx="548" cy="58" r="11"/>
  <text class="name" x="548" y="63">4</text>
  <circle class="lane" cx="290" cy="150" r="11"/>
  <text class="name" x="290" y="155">2</text>
  <circle class="lane" cx="530" cy="150" r="11"/>
  <text class="name" x="530" y="155">1</text>
  <circle class="lane" cx="45" cy="215" r="11"/>
  <text class="name" x="45" y="220">5</text>
  <rect class="frame" x="10" y="255" width="980" height="345" rx="8"/>
  <text class="frame-name" x="24" y="277">rn: the fix loop runs without you</text>
  <rect class="box" x="30" y="330" width="100" height="60" rx="6"/>
  <text class="name" x="80.0" y="365.0">You</text>
  <rect class="store" x="260" y="310" width="180" height="100" rx="6"/>
  <text class="name" x="350.0" y="347.0">Design tree</text>
  <text class="kind" x="350.0" y="366.0">every piece, in order,</text>
  <text class="kind" x="350.0" y="382.0">only the decisions that matter</text>
  <rect class="box" x="510" y="330" width="150" height="60" rx="6"/>
  <text class="name" x="585.0" y="365.0">Generator</text>
  <rect class="store" x="710" y="320" width="120" height="80" rx="6"/>
  <text class="name" x="770.0" y="365.0">Piece</text>
  <rect class="box" x="900" y="330" width="80" height="60" rx="6"/>
  <text class="name" x="940.0" y="365.0">You</text>
  <path class="line" d="M130,345 L256,345" marker-end="url(#a)"/>
  <text class="label small mid halo" x="193" y="335">your words</text>
  <path class="line dashed" d="M256,375 L134,375" marker-end="url(#a)"/>
  <text class="label small mid halo" x="193" y="400">only your points,</text>
  <text class="label small mid halo" x="193" y="415">one at a time</text>
  <path class="line" d="M440,360 L506,360" marker-end="url(#a)"/>
  <text class="label small mid halo" x="473" y="335">by its kind's</text>
  <text class="label small mid halo" x="473" y="350">best practice</text>
  <path class="line" d="M660,360 L706,360" marker-end="url(#a)"/>
  <text class="label small mid halo" x="683" y="350">makes</text>
  <path class="line" d="M830,360 L896,360" marker-end="url(#a)"/>
  <text class="label small mid halo" x="863" y="350">to merge</text>
  <rect class="lane" x="685" y="455" width="170" height="50" rx="6"/>
  <text class="name" x="770.0" y="485.0">Evaluator</text>
  <path class="line" d="M770,455 L770,404" marker-end="url(#a)"/>
  <text class="label small start halo" x="788" y="433">reads it as its users do</text>
  <path class="line dashed" d="M685,480 L350,480 L350,414" marker-end="url(#a)"/>
  <text class="label small mid halo" x="515" y="470">a shortfall: back to its decision</text>
  <rect class="lane" x="240" y="540" width="640" height="36" rx="6"/>
  <text class="name" x="560.0" y="563.0">Lane holds every step on every run, and the repository keeps the work</text>
  <circle class="lane" cx="260" cy="310" r="11"/>
  <text class="name" x="260" y="315">1</text>
  <circle class="lane" cx="440" cy="310" r="11"/>
  <text class="name" x="440" y="315">4</text>
  <circle class="lane" cx="193" cy="375" r="11"/>
  <text class="name" x="193" y="380">3</text>
  <circle class="lane" cx="770" cy="430" r="11"/>
  <text class="name" x="770" y="435">2</text>
  <circle class="lane" cx="240" cy="558" r="11"/>
  <text class="name" x="240" y="563">5</text>
</svg>
