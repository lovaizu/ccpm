<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>rn settles what the purpose or a best practice settles, and asks you the rest</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="300"/>
  <rect class="box" x="20" y="50" width="190" height="70" rx="6"/>
  <text class="name" x="115.0" y="82.0">rn making a piece</text>
  <text class="kind" x="115.0" y="101.0">generator, evaluator</text>
  <rect class="box" x="330" y="50" width="240" height="70" rx="6"/>
  <text class="name" x="450.0" y="82.0">Your conversation</text>
  <text class="kind" x="450.0" y="101.0">with rn</text>
  <rect class="store" x="720" y="45" width="260" height="80" rx="6"/>
  <text class="name" x="850.0" y="82.0">Decided</text>
  <text class="kind" x="850.0" y="101.0">said to you at the end</text>
  <path class="line" d="M210,72 L326,72" marker-end="url(#a)"/>
  <text class="label small mid halo" x="268" y="62">a point open</text>
  <path class="line dashed" d="M330,100 L214,100" marker-end="url(#a)"/>
  <text class="label small mid halo" x="268" y="120">made again</text>
  <path class="line" d="M570,85 L716,85" marker-end="url(#a)"/>
  <text class="label small mid halo" x="643" y="60">the purpose or a</text>
  <text class="label small mid halo" x="643" y="75">best practice settles it</text>
  <rect class="box" x="330" y="220" width="240" height="60" rx="6"/>
  <text class="name" x="450.0" y="255.0">You</text>
  <path class="line" d="M420,120 L420,216" marker-end="url(#a)"/>
  <text class="label small halo" x="410" y="165" text-anchor="end">otherwise, one point</text>
  <text class="label small halo" x="410" y="180" text-anchor="end">at a time</text>
  <path class="line dashed" d="M480,220 L480,124" marker-end="url(#a)"/>
  <text class="label small start halo" x="490" y="165">your answer,</text>
  <text class="label small start halo" x="490" y="180">in your own words</text>
</svg>
