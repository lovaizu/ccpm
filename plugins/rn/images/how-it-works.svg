<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>How rn works: your goal and decisions in a design tree, each deliverable made by a best practice, tried in a copy, read by evaluators as its people, and handed to you in a pull request for your sign-off</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="540"/>

  <!-- You -->
  <rect class="box" x="20" y="85" width="150" height="60" rx="6"/>
  <text class="name" x="95" y="120">You</text>

  <!-- rn, held by Lane -->
  <rect class="frame" x="250" y="20" width="890" height="500" rx="8"/>
  <text class="frame-name start" x="264" y="44">rn</text>
  <text class="quote end" x="1126" y="44">“Does it skip a step when no one watches?”</text>
  <text class="gets end" x="1126" y="61">Lane, installed with rn, holds each part to its steps.</text>

  <!-- Design tree -->
  <path class="store" d="M310,80 A110,9 0 0 1 530,80 V150 A110,9 0 0 1 310,150 Z"/>
  <path class="store" d="M310,80 A110,9 0 0 0 530,80"/>
  <text class="name" x="420" y="116">Design tree</text>
  <text class="kind" x="420" y="136">your goal and each decision</text>
  <text class="quote start" x="552" y="104">“It builds the wrong thing.”</text>
  <text class="gets start" x="552" y="121">You get the deliverable you mean.</text>

  <path class="line" d="M172,105 L306,105" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="239" y="80">your request, answers,</text>
  <text class="label halo mid" x="239" y="97">what to change</text>
  <path class="line" d="M306,130 L174,130" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="239" y="149">one question at a time</text>

  <!-- Making -->
  <path class="line" d="M380,161 V296" marker-end="url(#arrow)"/>
  <text class="label halo start" x="388" y="250">decisions</text>

  <rect class="box" x="310" y="300" width="200" height="60" rx="6"/>
  <text class="name" x="410" y="326">Maker</text>
  <text class="kind" x="410" y="346">by its kind's best practice</text>
  <text class="quote mid" x="410" y="390">“It misses what this kind of work needs.”</text>
  <text class="gets mid" x="410" y="407">You get what that kind needs.</text>

  <rect class="box" x="590" y="300" width="200" height="60" rx="6"/>
  <text class="name" x="690" y="326">Throwaway copy</text>
  <text class="kind" x="690" y="346">of your repository</text>
  <text class="quote mid" x="690" y="390">“Does it change files, or merge?”</text>
  <text class="gets mid" x="690" y="407">Its own worktree and a copy. You merge.</text>

  <rect class="box" x="880" y="300" width="200" height="60" rx="6"/>
  <text class="name" x="980" y="326">Evaluators</text>
  <text class="kind" x="980" y="346">read it as its people</text>
  <text class="quote start" x="884" y="390">“Its people can't use it.”</text>
  <text class="gets start" x="884" y="407">You get one they can use.</text>

  <path class="line" d="M510,330 L586,330" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="548" y="320">tries it</text>
  <path class="line" d="M790,330 L876,330" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="833" y="320">what it gave</text>

  <!-- A shortfall goes back to the tree -->
  <path class="line" d="M1080,330 H1110 V190 H450 V161" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="780" y="194">a shortfall: back to the decision it comes from</text>
  <text class="quote mid" x="780" y="222">“Each fix breaks something else.”</text>
  <text class="gets mid" x="780" y="239">The fix changes the decision, not the deliverable.</text>

  <!-- Handed over -->
  <path class="line" d="M1068,362 V446" marker-end="url(#arrow)"/>
  <text class="label halo end" x="1060" y="432">each aim met</text>
  <rect class="box" x="880" y="450" width="200" height="54" rx="6"/>
  <text class="name" x="980" y="474">Pull request</text>
  <text class="kind" x="980" y="492">draft until your last sign-off</text>
  <path class="line" d="M880,477 H95 V149" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="560" y="481">each deliverable, for your /rn:ty or /rn:gm, then your merge</text>
</svg>
