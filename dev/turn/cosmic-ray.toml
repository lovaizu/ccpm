# Mutation testing of turn, run from the top of the repository on a copy that may be changed.
[cosmic-ray]
module-path = "turn"
timeout = 30.0
excluded-modules = []
# The type checker runs first: a change to a type annotation changes no behavior a test could see,
# and the type checker is what checks annotations.
test-command = "sh -c 'pyrefly check --search-path dev/turn/tests --search-path dev/turn/trials --search-path dev/turn/trials/flow --search-path dev/turn/trials/readme --search-path dev/turn/trials/roles --search-path turn/hooks --search-path turn/hooks/checks --search-path turn/scripts turn dev/turn && python -m unittest discover -f -s dev/turn/tests'"

[cosmic-ray.distributor]
name = "local"
