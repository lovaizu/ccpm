# Mutation testing of Turn's code, its checks in core/domain/ and their commands in scripts/, run
# from the top of the repository on a copy that may be changed. What Turn takes from Lane through a
# link, schema.py and hooks/lane/, is mutated there, with Lane's tests.
[cosmic-ray]
module-path = ["plugins/turn/core/domain", "plugins/turn/scripts"]
excluded-modules = ["plugins/turn/core/domain/schema.py"]
timeout = 30.0
# The type checker and the linter run first, as a change to a type annotation, or a comparison of a
# string with `is` where CPython keeps one copy of it, changes no behavior a test could see.
# A line marked `# pragma: no mutate` compares a value with one of the few the code ever gives it,
# where no input tells a mutant of it apart: the place Turn's code goes on sys.path, no module
# before it there having the name of one of Turn's; `__name__`, which is "__main__" or, imported by
# the tests, the script's name; a count at values the code there never meets, such as one counting up by one to its limit, or of
# an item in the list it is taken from; flags joined that are bits apart, the same by `|`, `+` or
# `^`; and a line Cosmic Ray 8.7.0 fails to mutate, its ExceptionReplacer failing on a dotted name
# among the exceptions, so no mutant of it can be tested.
test-command = "sh -c 'ruff check --select F632 plugins/turn && sh dev/scripts/typecheck.sh turn && python -m unittest discover -f -s dev/turn/tests'"
