<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>turn&#x27;s deployment</title>
  <style>
