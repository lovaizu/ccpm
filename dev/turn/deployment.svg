<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>turn's deployment</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the user's computer -->
  <rect class="frame" x="20" y="20" width="680" height="400" rx="10"/>
  <text class="frame-name" x="32" y="39">the user's computer</text>

  <!-- runtimes, with the roles that run there -->
  <rect class="box" x="380" y="60" width="300" height="150" rx="6"/>
  <text class="name" x="530" y="86">Claude Code</text>
  <text class="kind" x="530" y="110">main conversation</text>
  <text class="kind" x="530" y="128">calling AI</text>
  <text class="kind" x="530" y="146">orchestrator, as the agent turn:up</text>
  <text class="kind" x="530" y="164">generator, as an agent</text>
  <text class="kind" x="530" y="182">first user, as an agent</text>

  <rect class="box" x="40" y="60" width="300" height="150" rx="6"/>
  <text class="name" x="190" y="86">python3, 3.9 or later</text>
  <text class="kind" x="190" y="110">turn's script, run with Bash</text>
  <text class="kind" x="190" y="128">guard, run by Claude Code's hooks</text>

  <path class="line" d="M380,135 H340" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="360" y="127">runs</text>

  <!-- places, with the data kept there -->
  <rect class="box" x="40" y="250" width="300" height="150" rx="6"/>
  <text class="name" x="190" y="276">the user's repository</text>
  <text class="kind" x="190" y="300">CCS, checklists, work</text>
  <text class="kind" x="190" y="318">result, where the call says</text>
  <text class="kind" x="190" y="336">run's folder, under .turn/ at its root:</text>
  <text class="kind" x="190" y="354">call, claim, reading</text>

  <rect class="box" x="380" y="250" width="300" height="150" rx="6"/>
  <text class="name" x="530" y="276">turn's installed folder</text>
  <text class="kind" x="530" y="300">lanes</text>
  <text class="kind" x="530" y="318">the schemas of the claim and the reading</text>
  <text class="kind" x="530" y="336">each role's steps and code</text>

  <!-- outside the product -->
  <rect class="box" x="840" y="60" width="200" height="60" rx="6"/>
  <text class="name" x="940" y="86">Claude's models</text>
  <text class="kind" x="940" y="106">reached by Claude Code</text>
  <path class="line" d="M680,90 H840" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="770" y="82">each AI's turns</text>

  <rect class="box" x="840" y="160" width="200" height="60" rx="6"/>
  <text class="name" x="940" y="186">ccpm on GitHub</text>
  <text class="kind" x="940" y="206">the marketplace</text>
  <path class="line" d="M680,190 H840" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="770" y="182">installs turn</text>
</svg>
