<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Turn&#x27;s test table</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="560"/>
  <text class="name start" x="42" y="46" text-anchor="start">Deployment unit</text>
  <text class="name start" x="284" y="40" text-anchor="start">unit</text>
  <text class="kind start" x="284" y="58" text-anchor="start">one part against its contract</text>
  <text class="name start" x="614" y="40" text-anchor="start">architecture</text>
  <text class="kind start" x="614" y="58" text-anchor="start">the parts joined, against this document</text>
  <text class="name start" x="944" y="40" text-anchor="start">ux</text>
  <text class="kind start" x="944" y="58" text-anchor="start">Turn in real use, against the UX</text>
  <rect class="box" x="30" y="80" width="232" height="130" rx="6"/>
  <text class="name start" x="42" y="110" text-anchor="start">script process</text>
  <text class="kind start" x="42" y="128" text-anchor="start">[python3 3.9 or later]</text>
  <rect class="unit" x="272" y="80" width="320" height="130" rx="6"/>
  <text class="name start" x="284" y="108" text-anchor="start">unittest, Cosmic Ray, Hypothesis · ●●●</text>
  <text class="label" x="284" y="130" text-anchor="start">each class of a best practice, a hand-over,</text>
  <text class="label" x="284" y="150" text-anchor="start">a round and its Answers, the table of</text>
  <text class="label" x="284" y="170" text-anchor="start">the phase, and each script&#x27;s three results</text>
  <rect class="unit" x="602" y="80" width="320" height="130" rx="6"/>
  <text class="name start" x="614" y="108" text-anchor="start">unittest · ●●●</text>
  <text class="label" x="614" y="130" text-anchor="start">each script run real at each step of</text>
  <text class="label" x="614" y="150" text-anchor="start">each path, on the files the doubles write</text>
  <rect class="box" x="932" y="80" width="320" height="130" rx="6"/>
  <text class="name start" x="944" y="108" text-anchor="start">a trial on Opus · ●○○</text>
  <text class="label" x="944" y="130" text-anchor="start">each script run by the real roles</text>
  <rect class="box" x="30" y="220" width="232" height="130" rx="6"/>
  <text class="name start" x="42" y="250" text-anchor="start">hook process</text>
  <text class="kind start" x="42" y="268" text-anchor="start">[python3 3.9 or later]</text>
  <rect class="ext" x="272" y="220" width="320" height="130" rx="6"/>
  <text class="name start" x="284" y="248" text-anchor="start">empty</text>
  <text class="label" x="284" y="270" text-anchor="start">Lane&#x27;s unit tests test the guard,</text>
  <text class="label" x="284" y="290" text-anchor="start">and Turn writes none of its code</text>
  <rect class="unit" x="602" y="220" width="320" height="130" rx="6"/>
  <text class="name start" x="614" y="248" text-anchor="start">unittest · ●●●</text>
  <text class="label" x="614" y="270" text-anchor="start">Turn&#x27;s guard on Turn&#x27;s Rules laid, a</text>
  <text class="label" x="614" y="290" text-anchor="start">double of Claude Code: each start, result,</text>
  <text class="label" x="614" y="310" text-anchor="start">call and read on every path</text>
  <rect class="box" x="932" y="220" width="320" height="130" rx="6"/>
  <text class="name start" x="944" y="248" text-anchor="start">a trial on Opus · ●○○</text>
  <text class="label" x="944" y="270" text-anchor="start">the guards on the real roles</text>
  <rect class="box" x="30" y="360" width="232" height="130" rx="6"/>
  <text class="name start" x="42" y="390" text-anchor="start">Claude Code process</text>
  <text class="kind start" x="42" y="408" text-anchor="start">[Claude Code 2.1.317 or later]</text>
  <rect class="ext" x="272" y="360" width="320" height="130" rx="6"/>
  <text class="name start" x="284" y="388" text-anchor="start">empty</text>
  <text class="label" x="284" y="410" text-anchor="start">no level tries a prompt alone:</text>
  <text class="label" x="284" y="430" text-anchor="start">the guards hold the rules that</text>
  <text class="label" x="284" y="450" text-anchor="start">must hold</text>
  <rect class="unit" x="602" y="360" width="320" height="130" rx="6"/>
  <text class="name start" x="614" y="388" text-anchor="start">unittest · ●●○</text>
  <text class="label" x="614" y="410" text-anchor="start">the entries as Claude Code takes them,</text>
  <text class="label" x="614" y="430" text-anchor="start">every role a double: each path of the</text>
  <text class="label" x="614" y="450" text-anchor="start">three sequences</text>
  <rect class="box" x="932" y="360" width="320" height="130" rx="6"/>
  <text class="name start" x="944" y="388" text-anchor="start">trials on Opus · ●●○</text>
  <text class="label" x="944" y="410" text-anchor="start">O1 on tidy&#x27;s README and on a kind new</text>
  <text class="label" x="944" y="430" text-anchor="start">to Turn, O2 through a plugin made for</text>
  <text class="label" x="944" y="450" text-anchor="start">the test: each key result measured</text>
  <text class="frame-name" x="30" y="525" text-anchor="start">Legend</text>
  <rect class="unit" x="105" y="510" width="36" height="22" rx="4"/>
  <text class="label small" x="149" y="525" text-anchor="start">runs on every push and in CI</text>
  <rect class="box" x="380" y="510" width="36" height="22" rx="4"/>
  <text class="label small" x="424" y="525" text-anchor="start">runs once every lower level passes</text>
  <rect class="ext" x="690" y="510" width="36" height="22" rx="4"/>
  <text class="label small" x="734" y="525" text-anchor="start">empty, with why</text>
  <text class="label small" x="880" y="525" text-anchor="start">tool · weight (●●● heaviest), then what the tests check</text>
</svg>
