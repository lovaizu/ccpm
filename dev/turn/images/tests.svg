<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Turn's tests</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1460" height="900"/>
  <text class="name start" x="42" y="46" text-anchor="start">Deployment unit</text>
  <text class="name start" x="284" y="40" text-anchor="start">unit</text>
  <text class="kind start" x="284" y="58" text-anchor="start">one part against its contract</text>
  <text class="name start" x="674" y="40" text-anchor="start">architecture</text>
  <text class="kind start" x="674" y="58" text-anchor="start">the parts joined, against this document</text>
  <text class="name start" x="1064" y="40" text-anchor="start">ux</text>
  <text class="kind start" x="1064" y="58" text-anchor="start">Turn in real use, against the product vision</text>
  <rect class="box" x="30" y="80" width="232" height="110" rx="6"/>
  <text class="name start" x="42" y="110" text-anchor="start">script process</text>
  <text class="kind start" x="42" y="128" text-anchor="start">[python3 3.9 or later]</text>
  <rect class="unit" x="272" y="80" width="380" height="110" rx="6"/>
  <text class="name start" x="284" y="108" text-anchor="start">unittest, Cosmic Ray, Hypothesis · FULL</text>
  <text class="label start" x="284" y="130" text-anchor="start">each class of a best practice, a Call, a round</text>
  <text class="label start" x="284" y="149" text-anchor="start">and its Answers, each rule of the phase's</text>
  <text class="label start" x="284" y="168" text-anchor="start">table, and each script's three results</text>
  <rect class="unit" x="662" y="80" width="380" height="110" rx="6"/>
  <text class="name start" x="674" y="108" text-anchor="start">unittest · FULL</text>
  <text class="label start" x="674" y="130" text-anchor="start">each script run real at each step of each</text>
  <text class="label start" x="674" y="149" text-anchor="start">path, on the files the doubles write</text>
  <rect class="box" x="1052" y="80" width="380" height="110" rx="6"/>
  <text class="name start" x="1064" y="108" text-anchor="start">a trial on Opus · SMOKE</text>
  <text class="label start" x="1064" y="130" text-anchor="start">each script run by the real roles</text>
  <rect class="box" x="30" y="200" width="232" height="110" rx="6"/>
  <text class="name start" x="42" y="230" text-anchor="start">hook process</text>
  <text class="kind start" x="42" y="248" text-anchor="start">[python3 3.9 or later]</text>
  <rect class="ext" x="272" y="200" width="380" height="110" rx="6"/>
  <text class="name start" x="284" y="228" text-anchor="start">empty</text>
  <text class="label start" x="284" y="250" text-anchor="start">Lane's unit tests test the guard,</text>
  <text class="label start" x="284" y="269" text-anchor="start">and Turn writes none of its code</text>
  <rect class="unit" x="662" y="200" width="380" height="110" rx="6"/>
  <text class="name start" x="674" y="228" text-anchor="start">unittest · FULL</text>
  <text class="label start" x="674" y="250" text-anchor="start">Turn's guard on Turn's Rules laid, a double</text>
  <text class="label start" x="674" y="269" text-anchor="start">of Claude Code: each start, result, call and</text>
  <text class="label start" x="674" y="288" text-anchor="start">read on every path</text>
  <rect class="box" x="1052" y="200" width="380" height="110" rx="6"/>
  <text class="name start" x="1064" y="228" text-anchor="start">a trial on Opus · SMOKE</text>
  <text class="label start" x="1064" y="250" text-anchor="start">the guard on the real roles</text>
  <rect class="box" x="30" y="320" width="232" height="110" rx="6"/>
  <text class="name start" x="42" y="350" text-anchor="start">Claude Code process</text>
  <text class="kind start" x="42" y="368" text-anchor="start">[Claude Code 2.1.317 or later]</text>
  <rect class="ext" x="272" y="320" width="380" height="110" rx="6"/>
  <text class="name start" x="284" y="348" text-anchor="start">empty</text>
  <text class="label start" x="284" y="370" text-anchor="start">no level tries a prompt alone: the guards</text>
  <text class="label start" x="284" y="389" text-anchor="start">hold the rules that must hold</text>
  <rect class="unit" x="662" y="320" width="380" height="110" rx="6"/>
  <text class="name start" x="674" y="348" text-anchor="start">unittest · HAPPY</text>
  <text class="label start" x="674" y="370" text-anchor="start">the entries as Claude Code takes them, every</text>
  <text class="label start" x="674" y="389" text-anchor="start">role a double: each path of each sequence</text>
  <rect class="box" x="1052" y="320" width="380" height="110" rx="6"/>
  <text class="name start" x="1064" y="348" text-anchor="start">trials on Opus · HAPPY</text>
  <text class="label start" x="1064" y="370" text-anchor="start">O1 on tidy's README and on a man page, by</text>
  <text class="label start" x="1064" y="389" text-anchor="start">/turn:up and through a plugin made for the</text>
  <text class="label start" x="1064" y="408" text-anchor="start">test: KR1.1 and KR1.2 measured</text>
  <text class="frame-name" x="30" y="455" text-anchor="start">Legend</text>
  <rect class="unit" x="105" y="440" width="36" height="22" rx="4"/>
  <text class="label small" x="149" y="455" text-anchor="start">runs on every push and in CI</text>
  <rect class="box" x="380" y="440" width="36" height="22" rx="4"/>
  <text class="label small" x="424" y="455" text-anchor="start">runs once every lower level passes</text>
  <rect class="ext" x="690" y="440" width="36" height="22" rx="4"/>
  <text class="label small" x="734" y="455" text-anchor="start">empty, with why</text>
  <text class="label small" x="880" y="455" text-anchor="start">tool · FULL, HAPPY or SMOKE, then what the tests check</text>
  <text class="label start" x="30" y="490" text-anchor="start">No row: installed Turn, the repository and the temporary folder hold files and run nothing, and the tests reach them through the processes that read them.</text>
  <text class="label start" x="30" y="509" text-anchor="start">Pin's tree.py and Lane's code, linked into Turn, are tested by their own plugins.</text>
  <rect class="frame" x="20" y="522" width="1420" height="368" rx="8"/>
  <text class="frame-name" x="36" y="544" text-anchor="start">Where Turn's tests differ from the best practices</text>
  <text class="name start" x="42" y="572" text-anchor="start">unit</text>
  <text class="label start" x="42" y="594" text-anchor="start">No stand-in, as no user takes part.</text>
  <text class="name start" x="512" y="572" text-anchor="start">architecture</text>
  <text class="label start" x="512" y="594" text-anchor="start">Real: Turn's scripts by the commands the rules name,</text>
  <text class="label start" x="512" y="612" text-anchor="start">the guard by Turn's hook entries on Rules laid, and</text>
  <text class="label start" x="512" y="630" text-anchor="start">the entries' files as Claude Code takes them.</text>
  <text class="label start" x="512" y="648" text-anchor="start">Doubles: the orchestrator, the planner, the designer,</text>
  <text class="label start" x="512" y="666" text-anchor="start">the generator, the evaluator and Claude Code, each giving</text>
  <text class="label start" x="512" y="684" text-anchor="start">only what its part's contract allows: design trees that</text>
  <text class="label start" x="512" y="702" text-anchor="start">pass the design's check, Answers that pass rounds.py,</text>
  <text class="label start" x="512" y="720" text-anchor="start">a hand-over only through plan.py, each Message and</text>
  <text class="label start" x="512" y="738" text-anchor="start">Answer unchanged.</text>
  <text class="label start" x="512" y="756" text-anchor="start">Stand-in: a set answer for the user.</text>
  <text class="label start" x="512" y="774" text-anchor="start">Subject: tidy, with the repository's own README best</text>
  <text class="label start" x="512" y="792" text-anchor="start">practice of three questions, so each round runs the</text>
  <text class="label start" x="512" y="810" text-anchor="start">evaluator three times.</text>
  <text class="name start" x="982" y="572" text-anchor="start">ux</text>
  <text class="label start" x="982" y="594" text-anchor="start">Subject: tidy at the size of a real request: several</text>
  <text class="label start" x="982" y="612" text-anchor="start">modules, tests and packaging, and no README. One</text>
  <text class="label start" x="982" y="630" text-anchor="start">trial asks for a kind new to Turn, a man page.</text>
  <text class="label start" x="982" y="648" text-anchor="start">Stand-in: an AI on Opus, given an intent written</text>
  <text class="label start" x="982" y="666" text-anchor="start">before the run and never shown to Turn.</text>
  <text class="label start" x="982" y="684" text-anchor="start">Each trial runs twice: the stand-in types /turn:up,</text>
  <text class="label start" x="982" y="702" text-anchor="start">and a plugin made for the test has its AI call the</text>
  <text class="label start" x="982" y="720" text-anchor="start">skill turn:up for the stand-in.</text>
  <text class="label start" x="982" y="738" text-anchor="start">Measures KR1.1, the share of works gone wrong in a</text>
  <text class="label start" x="982" y="756" text-anchor="start">way the product vision names, judged by the stand-in</text>
  <text class="label start" x="982" y="774" text-anchor="start">from its intent, and KR1.2, the time from the start</text>
  <text class="label start" x="982" y="792" text-anchor="start">to the work the stand-in puts to use, each against</text>
  <text class="label start" x="982" y="810" text-anchor="start">the last trial's.</text>
  <text class="label start" x="42" y="842" text-anchor="start">A fault found higher: a step a role broke, where a hook can see it, becomes a rule of the guard, with an architecture test that fails first. Another fault of a</text>
  <text class="label start" x="42" y="861" text-anchor="start">prompt is mended in the prompt, for a cause the trial's records confirm. A fault in how Claude Code acts is recorded beside its double, which then sends what the try showed.</text>
</svg>
