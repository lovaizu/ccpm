<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>turn's components</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .drift { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- turn's own parts -->
  <rect class="frame" x="20" y="150" width="1060" height="610" rx="10"/>
  <text class="frame-name" x="32" y="169">turn</text>

  <!-- roles outside turn -->
  <rect class="box" x="100" y="20" width="240" height="92" rx="20"/>
  <text class="name" x="220" y="48">calling AI</text>
  <text class="kind" x="220" y="70">writes the CCS and calls turn;</text>
  <text class="kind" x="220" y="86">checks each item at its lines</text>

  <rect class="box" x="760" y="20" width="240" height="92" rx="20"/>
  <text class="name" x="880" y="48">main conversation</text>
  <text class="kind" x="880" y="70">puts each question to the user;</text>
  <text class="kind" x="880" y="86">keeps the answer in the CCS</text>

  <!-- turn's roles -->
  <rect class="box" x="100" y="200" width="240" height="92" rx="20"/>
  <text class="name" x="220" y="228">orchestrator</text>
  <text class="kind" x="220" y="250">starts the generator, then the</text>
  <text class="kind" x="220" y="266">first user; has the result</text>
  <text class="kind" x="220" y="282">written; reads no work</text>

  <rect class="box" x="760" y="200" width="240" height="92" rx="20"/>
  <text class="name" x="880" y="228">generator</text>
  <text class="kind" x="880" y="250">makes the work; asks what only</text>
  <text class="kind" x="880" y="266">the user decides; claims each</text>
  <text class="kind" x="880" y="282">item's lines; mends for needs</text>

  <rect class="box" x="480" y="400" width="240" height="92" rx="0"/>
  <text class="name" x="600" y="428">turn's script</text>
  <text class="kind" x="600" y="450">lays out each role input;</text>
  <text class="kind" x="600" y="466">checks each claim and reading;</text>
  <text class="kind" x="600" y="482">waits; writes the result</text>

  <rect class="box" x="430" y="600" width="240" height="92" rx="20"/>
  <text class="name" x="550" y="628">first user</text>
  <text class="kind" x="550" y="650">uses the work as the receiver;</text>
  <text class="kind" x="550" y="666">gives each item its lines</text>
  <text class="kind" x="550" y="682">or what the receiver would need</text>

  <rect class="box" x="60" y="600" width="200" height="92" rx="0"/>
  <text class="name" x="160" y="628">guard</text>
  <text class="kind" x="160" y="650">lane's code; tells each</text>
  <text class="kind" x="160" y="666">AI role a step again</text>
  <text class="kind" x="160" y="682">when it drifts</text>

  <!-- calling AI and orchestrator -->
  <path class="line" d="M200,112 V200" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="192" y="136">call</text>
  <path class="line" d="M240,200 V112" marker-end="url(#arrow)"/>
  <text class="label" x="248" y="136">the result's path</text>

  <!-- generator and main conversation -->
  <path class="line" d="M860,200 V112" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="852" y="136">question</text>
  <path class="line" d="M900,112 V200" marker-end="url(#arrow)"/>
  <text class="label" x="908" y="136">answer</text>

  <!-- orchestrator and generator -->
  <path class="line" d="M340,225 H760" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="550" y="217">the result's path</text>

  <!-- orchestrator and turn's script -->
  <path class="line" d="M340,262 L500,400" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="322">call</text>
  <path class="line" d="M480,418 L320,292" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="400" y="365">the result's</text>
  <text class="label" text-anchor="end" x="400" y="381">path</text>

  <!-- orchestrator and first user -->
  <path class="line" d="M260,292 L430,620" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="332" y="445">the result's path,</text>
  <text class="label" text-anchor="end" x="332" y="461">the generator's ID</text>

  <!-- turn's script and generator -->
  <path class="line" d="M650,400 L810,292" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="726" y="335">role input</text>
  <path class="line" d="M835,292 L720,425" marker-end="url(#arrow)"/>
  <text class="label" x="790" y="385">claim</text>

  <!-- turn's script and first user -->
  <path class="line" d="M570,492 V600" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="562" y="552">role input</text>
  <path class="line" d="M620,600 V492" marker-end="url(#arrow)"/>
  <text class="label" x="628" y="552">reading</text>

  <!-- first user and generator -->
  <path class="line" d="M670,615 L900,292" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="728" y="520">needs</text>
  <path class="line" d="M930,292 L670,645" marker-end="url(#arrow)"/>
  <text class="label" x="775" y="520">reply</text>

  <!-- guard -->
  <path class="line drift" d="M160,600 V292" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="152" y="440">a step</text>
  <text class="label" text-anchor="end" x="152" y="456">again</text>
  <path class="line drift" d="M260,655 H430" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="345" y="647">a step again</text>
  <path class="line drift" d="M160,692 V735 H1050 V246 H1000" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="1042" y="480">a step</text>
  <text class="label" text-anchor="end" x="1042" y="496">again</text>

  <!-- legend -->
  <rect class="box" x="780" y="775" width="40" height="22" rx="11"/>
  <text class="label" x="828" y="791">AI</text>
  <rect class="box" x="880" y="775" width="40" height="22" rx="0"/>
  <text class="label" x="928" y="791">code</text>
</svg>
