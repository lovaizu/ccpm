<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 910" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Turn&#x27;s components</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .env { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 7 4; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .tag { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .envname { fill: #0969da; font-size: 13px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #9198a1; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #9198a1; }
      .env { stroke: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .tag { fill: #9198a1; }
      .envname { fill: #4493f8; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .data { fill: #c297ff; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1500" height="910"/>

  <!-- Row A: the person, the main conversation, check.py -->
  <circle class="box" cx="90" cy="44" r="12"/>
  <rect class="box" x="20" y="60" width="140" height="60" rx="22"/>
  <text class="name" x="90" y="88">Person</text>
  <text class="tag" x="90" y="105">[person]</text>
  <rect class="ext" x="300" y="30" width="580" height="80" rx="4"/>
  <text class="name" x="590" y="67">Main conversation</text>
  <text class="tag" x="590" y="84">[Claude Code conversation]</text>
  <rect class="box" x="1290" y="30" width="190" height="80" rx="0"/>
  <text class="name" x="1385" y="67">check.py</text>
  <text class="tag" x="1385" y="84">[script · Python 3.9 stdlib]</text>

  <!-- Row B: a plugin's step, the internet, the work -->
  <rect class="ext" x="20" y="190" width="180" height="80" rx="4"/>
  <text class="name" x="110" y="227">A plugin&#x27;s step</text>
  <text class="tag" x="110" y="244">[AI · such as Rn&#x27;s]</text>
  <rect class="ext" x="570" y="190" width="160" height="80" rx="4"/>
  <text class="name" x="650" y="227">Internet</text>
  <text class="tag" x="650" y="244">[web pages]</text>
  <path class="store" d="M990,199 A125,9 0 0 1 1240,199 V261 A125,9 0 0 1 990,261 Z"/>
  <path class="store" d="M990,199 A125,9 0 0 0 1240,199"/>
  <text class="name" x="1115" y="232">The work</text>
  <text class="tag" x="1115" y="249">[files of its kind]</text>

  <!-- Row C: Turn's agents, and wait.py -->
  <rect class="env" x="245" y="315" width="1020" height="190" rx="10"/>
  <text class="envname" x="257" y="334">Turn&#x27;s agents</text>
  <rect class="box" x="260" y="390" width="180" height="80" rx="14"/>
  <text class="name" x="350" y="427">turn:up</text>
  <text class="tag" x="350" y="444">[subagent · Markdown]</text>
  <rect class="env" x="530" y="345" width="715" height="150" rx="10"/>
  <text class="envname" x="872" y="364">Turn&#x27;s roles</text>
  <rect class="box" x="545" y="390" width="160" height="80" rx="14"/>
  <text class="name" x="625" y="427">Planner</text>
  <text class="tag" x="625" y="444">[subagent · Markdown]</text>
  <rect class="box" x="720" y="390" width="160" height="80" rx="14"/>
  <text class="name" x="800" y="427">Designer</text>
  <text class="tag" x="800" y="444">[subagent · Markdown]</text>
  <rect class="box" x="895" y="390" width="160" height="80" rx="14"/>
  <text class="name" x="975" y="427">Builder</text>
  <text class="tag" x="975" y="444">[subagent · Markdown]</text>
  <rect class="box" x="1070" y="390" width="160" height="80" rx="14"/>
  <text class="name" x="1150" y="427">Evaluator</text>
  <text class="tag" x="1150" y="444">[subagent · Markdown]</text>
  <rect class="box" x="1330" y="390" width="150" height="80" rx="0"/>
  <text class="name" x="1405" y="427">wait.py</text>
  <text class="tag" x="1405" y="444">[script · Python 3.9]</text>

  <!-- Row D: Lane's check script, Best practices, standard.py -->
  <rect class="box" x="20" y="560" width="190" height="80" rx="0"/>
  <text class="name" x="115" y="597">Check script</text>
  <text class="tag" x="115" y="614">[hooks · Python 3.9, Lane]</text>
  <path class="store" d="M520,649 A270,9 0 0 1 1060,649 V711 A270,9 0 0 1 520,711 Z"/>
  <path class="store" d="M520,649 A270,9 0 0 0 1060,649"/>
  <text class="name" x="790" y="682">Best practices</text>
  <text class="tag" x="790" y="699">[JSON files]</text>
  <rect class="box" x="1080" y="560" width="170" height="80" rx="0"/>
  <text class="name" x="1165" y="597">standard.py</text>
  <text class="tag" x="1165" y="614">[script · Python 3.9 stdlib]</text>

  <!-- Row E: the items adapter, Forms, Run files -->
  <rect class="box" x="20" y="740" width="190" height="80" rx="0"/>
  <text class="name" x="115" y="777">Items adapter</text>
  <text class="tag" x="115" y="794">[script · Python 3.9 stdlib]</text>
  <path class="store" d="M240,749 A80,9 0 0 1 400,749 V811 A80,9 0 0 1 240,811 Z"/>
  <path class="store" d="M240,749 A80,9 0 0 0 400,749"/>
  <text class="name" x="320" y="782">Forms</text>
  <text class="tag" x="320" y="799">[JSON Schema files]</text>
  <path class="store" d="M480,749 A382,9 0 0 1 1245,749 V811 A382,9 0 0 1 480,811 Z"/>
  <path class="store" d="M480,749 A382,9 0 0 0 1245,749"/>
  <text class="name" x="862" y="782">Run files</text>
  <text class="tag" x="862" y="799">[JSON files]</text>

  <!-- The person and the main conversation -->
  <path class="line" d="M160,75 L300,75" marker-end="url(#arrow)"/>
  <text class="label" x="230" y="66" text-anchor="middle">asks, answers</text>
  <text class="data" x="230" y="92" text-anchor="middle">request, decision</text>

  <!-- Starting turn:up -->
  <path class="line" d="M360,110 L360,390" marker-end="url(#arrow)"/>
  <text class="label" x="352" y="144" text-anchor="end">starts in the background,</text>
  <text class="label" x="352" y="158" text-anchor="end">gets the work [Agent tool]</text>
  <text class="data" x="352" y="172" text-anchor="end">request, work</text>
  <path class="line" d="M190,270 L270,390" marker-end="url(#arrow)"/>
  <text class="label" x="20" y="300">starts, gets the work</text>
  <text class="label" x="20" y="314">[Agent tool]</text>
  <text class="data" x="20" y="328">request, work</text>

  <!-- turn:up's moves -->
  <path class="line" d="M440,430 L530,430" marker-end="url(#arrow)"/>
  <text class="label" x="485" y="420" text-anchor="middle">starts each</text>
  <text class="label" x="485" y="448" text-anchor="middle">[Agent tool]</text>
  <text class="data" x="485" y="462" text-anchor="middle">request</text>
  <path class="line" d="M420,470 L420,780 L480,780" marker-end="url(#arrow)"/>
  <text class="label" x="428" y="600">writes</text>
  <text class="data" x="428" y="614">request</text>

  <!-- Asks to the person, and the wait for the answer -->
  <path class="line" d="M560,390 L560,110" marker-end="url(#arrow)"/>
  <text class="label" x="552" y="130" text-anchor="end">asks to confirm,</text>
  <text class="label" x="552" y="144" text-anchor="end">approve [SendMessage]</text>
  <text class="data" x="552" y="158" text-anchor="end">standard</text>
  <path class="line" d="M860,390 L860,110" marker-end="url(#arrow)"/>
  <text class="label" x="868" y="130">asks to decide, approve</text>
  <text class="label" x="868" y="144">[SendMessage]</text>
  <text class="data" x="868" y="158">decision, design tree</text>
  <path class="line" d="M1245,430 L1330,430" marker-end="url(#arrow)"/>
  <text class="label" x="1287" y="420" text-anchor="middle">waits</text>
  <text class="label" x="1287" y="448" text-anchor="middle">[Bash]</text>

  <!-- Research, and the checks -->
  <path class="line" d="M640,390 L640,270" marker-end="url(#arrow)"/>
  <text class="label" x="648" y="290">reads guides and examples</text>
  <text class="label" x="648" y="304">[WebSearch, WebFetch]</text>
  <path class="line" d="M1245,360 L1272,360 L1272,70 L1290,70" marker-end="url(#arrow)"/>
  <text class="label" x="1280" y="150">each role checks</text>
  <text class="label" x="1280" y="164">its file [Bash]</text>
  <text class="data" x="1280" y="178">best practice, design tree,</text>
  <text class="data" x="1280" y="192">answers</text>

  <!-- The roles and the work -->
  <path class="line" d="M1000,390 L1040,270" marker-end="url(#arrow)"/>
  <text class="label" x="1010" y="290" text-anchor="end">makes, betters</text>
  <text class="data" x="1010" y="304" text-anchor="end">work</text>
  <path class="line" d="M1150,390 L1140,270" marker-end="url(#arrow)"/>
  <text class="label" x="1134" y="283" text-anchor="end">uses it as</text>
  <text class="label" x="1134" y="296" text-anchor="end">its user would</text>
  <text class="data" x="1134" y="309" text-anchor="end">work</text>

  <!-- The roles and Best practices -->
  <path class="line" d="M625,470 L625,645" marker-end="url(#arrow)"/>
  <text class="label" x="633" y="540">reads, keeps</text>
  <text class="data" x="633" y="554">best practice</text>
  <path class="line" d="M800,470 L800,645" marker-end="url(#arrow)"/>
  <text class="label" x="808" y="540">reads</text>
  <text class="data" x="808" y="554">best practice</text>
  <path class="line" d="M960,470 L960,645" marker-end="url(#arrow)"/>
  <text class="label" x="968" y="540">reads</text>
  <text class="data" x="968" y="554">best practice</text>
  <path class="line" d="M1150,470 L1150,560" marker-end="url(#arrow)"/>
  <text class="label" x="1142" y="522" text-anchor="end">runs [Bash]</text>
  <text class="data" x="1142" y="536" text-anchor="end">standard</text>
  <path class="line" d="M1100,640 L1100,680 L1062,680" marker-end="url(#arrow)"/>
  <text class="label" x="1108" y="668">reads</text>
  <text class="data" x="1108" y="682">best practice</text>

  <!-- The roles and Run files -->
  <path class="line" d="M1245,480 L1285,480 L1285,780 L1245,780" marker-end="url(#arrow)"/>
  <text class="label" x="1293" y="600">designer, builder: write, read</text>
  <text class="data" x="1293" y="614">request, design tree, answers</text>
  <text class="label" x="1293" y="634">evaluator: writes</text>
  <text class="data" x="1293" y="648">answers</text>

  <!-- Lane's check script -->
  <path class="line" d="M170,560 L290,470" marker-end="url(#arrow)"/>
  <text class="label" x="262" y="530">tells each move</text>
  <text class="label" x="262" y="544">[hooks]</text>
  <path class="line" d="M90,560 L245,490" marker-end="url(#arrow)"/>
  <text class="label" x="20" y="470">holds each agent to</text>
  <text class="label" x="20" y="484">its lanes [hooks]</text>
  <path class="line" d="M115,640 L115,740" marker-end="url(#arrow)"/>
  <text class="label" x="123" y="690">asks question IDs</text>
  <text class="data" x="123" y="704">best practice</text>
  <path class="line" d="M200,640 L280,745" marker-end="url(#arrow)"/>
  <text class="label" x="246" y="672">reads the forms</text>

  <!-- Legend -->
  <text class="envname" x="20" y="865">Legend</text>
  <rect class="box" x="90" y="850" width="36" height="24" rx="12"/>
  <text class="label" x="134" y="867">person</text>
  <rect class="box" x="200" y="850" width="36" height="24" rx="8"/>
  <text class="label" x="244" y="867">AI agent</text>
  <rect class="box" x="320" y="850" width="36" height="24" rx="0"/>
  <text class="label" x="364" y="867">code</text>
  <path class="store" d="M420,854 A18,4 0 0 1 456,854 V870 A18,4 0 0 1 420,870 Z"/>
  <path class="store" d="M420,854 A18,4 0 0 0 456,854"/>
  <text class="label" x="464" y="867">store of data</text>
  <rect class="ext" x="560" y="850" width="36" height="24" rx="3"/>
  <text class="label" x="604" y="867">outside Turn</text>
  <rect class="env" x="700" y="850" width="36" height="24" rx="4"/>
  <text class="label" x="744" y="867">a group, its name in blue</text>
  <text class="label" x="920" y="858">[type · technology] in a box; [protocol or tool] on an arrow</text>
  <text class="data" x="920" y="876">data handed on, named as in the data model</text>
</svg>
