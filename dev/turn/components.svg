<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>turn&#x27;s components</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .env { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 7 4; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .tag { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .envname { fill: #0969da; font-size: 13px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #9198a1; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #9198a1; }
      .env { stroke: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .tag { fill: #9198a1; }
      .envname { fill: #4493f8; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .data { fill: #c297ff; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1660" height="920"/>

  <!-- Row A: the person, the main conversation, check.py -->
  <circle class="box" cx="90" cy="44" r="12"/>
  <rect class="box" x="20" y="60" width="140" height="60" rx="22"/>
  <text class="name" x="90" y="88">Person</text>
  <text class="tag" x="90" y="105">[person]</text>
  <rect class="ext" x="300" y="30" width="240" height="80" rx="4"/>
  <text class="name" x="420" y="67">Main conversation</text>
  <text class="tag" x="420" y="84">[Claude Code conversation]</text>
  <rect class="box" x="1420" y="30" width="220" height="80" rx="0"/>
  <text class="name" x="1530" y="67">check.py</text>
  <text class="tag" x="1530" y="84">[script · Python 3.9 stdlib]</text>

  <!-- Row B: a plugin's step, the internet, the work -->
  <rect class="ext" x="20" y="190" width="180" height="80" rx="4"/>
  <text class="name" x="110" y="227">A plugin&#x27;s step</text>
  <text class="tag" x="110" y="244">[AI · such as rn&#x27;s]</text>
  <rect class="ext" x="560" y="190" width="160" height="80" rx="4"/>
  <text class="name" x="640" y="227">Internet</text>
  <text class="tag" x="640" y="244">[web pages]</text>
  <path class="store" d="M1075,199 A160,9 0 0 1 1395,199 V261 A160,9 0 0 1 1075,261 Z"/>
  <path class="store" d="M1075,199 A160,9 0 0 0 1395,199"/>
  <text class="name" x="1235" y="232">The work</text>
  <text class="tag" x="1235" y="249">[files of its kind]</text>

  <!-- Row C: flow.py, turn:up and the roles -->
  <rect class="box" x="20" y="390" width="150" height="80" rx="0"/>
  <text class="name" x="95" y="427">flow.py</text>
  <text class="tag" x="95" y="444">[script · lane]</text>
  <rect class="box" x="260" y="390" width="180" height="80" rx="14"/>
  <text class="name" x="350" y="427">turn:up</text>
  <text class="tag" x="350" y="444">[orchestrator · Markdown]</text>
  <rect class="env" x="505" y="330" width="1125" height="165" rx="10"/>
  <text class="envname" x="890" y="348">turn&#x27;s roles</text>
  <rect class="box" x="520" y="390" width="170" height="80" rx="14"/>
  <text class="name" x="605" y="427">Planner</text>
  <text class="tag" x="605" y="444">[subagent · Markdown]</text>
  <rect class="box" x="705" y="390" width="170" height="80" rx="14"/>
  <text class="name" x="790" y="427">Designer</text>
  <text class="tag" x="790" y="444">[subagent · Markdown]</text>
  <rect class="box" x="890" y="390" width="170" height="80" rx="14"/>
  <text class="name" x="975" y="427">Builder</text>
  <text class="tag" x="975" y="444">[subagent · Markdown]</text>
  <rect class="box" x="1075" y="390" width="170" height="80" rx="14"/>
  <text class="name" x="1160" y="427">Evaluator</text>
  <text class="tag" x="1160" y="444">[subagent · Markdown]</text>
  <rect class="box" x="1260" y="390" width="170" height="80" rx="14"/>
  <text class="name" x="1345" y="427">Refactorer</text>
  <text class="tag" x="1345" y="444">[subagent · Markdown]</text>
  <rect class="box" x="1445" y="390" width="170" height="80" rx="14"/>
  <text class="name" x="1530" y="420">Refactor-</text>
  <text class="name" x="1530" y="438">evaluator</text>
  <text class="tag" x="1530" y="455">[subagent · Markdown]</text>

  <!-- Row D: the guard and the stores -->
  <rect class="box" x="20" y="560" width="190" height="80" rx="0"/>
  <text class="name" x="115" y="597">Guard</text>
  <text class="tag" x="115" y="614">[hooks · Python 3.9, lane]</text>
  <path class="store" d="M520,649 A80,9 0 0 1 680,649 V711 A80,9 0 0 1 520,711 Z"/>
  <path class="store" d="M520,649 A80,9 0 0 0 680,649"/>
  <text class="name" x="600" y="682">Templates</text>
  <text class="tag" x="600" y="699">[JSON files]</text>
  <path class="store" d="M705,649 A455,9 0 0 1 1615,649 V711 A455,9 0 0 1 705,711 Z"/>
  <path class="store" d="M705,649 A455,9 0 0 0 1615,649"/>
  <text class="name" x="1160" y="682">Run files</text>
  <text class="tag" x="1160" y="699">[JSON files]</text>

  <!-- Row E: what the guard reads -->
  <rect class="box" x="20" y="740" width="190" height="80" rx="0"/>
  <text class="name" x="115" y="777">Items adapter</text>
  <text class="tag" x="115" y="794">[script · Python 3.9 stdlib]</text>
  <path class="store" d="M260,749 A80,9 0 0 1 420,749 V811 A80,9 0 0 1 260,811 Z"/>
  <path class="store" d="M260,749 A80,9 0 0 0 420,749"/>
  <text class="name" x="340" y="782">Forms</text>
  <text class="tag" x="340" y="799">[JSON Schema files]</text>

  <!-- Person and main conversation -->
  <path class="line" d="M160,75 L300,75" marker-end="url(#arrow)"/>
  <text class="label" x="230" y="66" text-anchor="middle">asks, answers</text>
  <text class="data" x="230" y="92" text-anchor="middle">request, decision</text>

  <!-- Starting turn:up -->
  <path class="line" d="M360,110 L360,390" marker-end="url(#arrow)"/>
  <text class="label" x="352" y="144" text-anchor="end">starts in the background,</text>
  <text class="label" x="352" y="158" text-anchor="end">gets the work [Agent tool]</text>
  <text class="data" x="352" y="172" text-anchor="end">request, work</text>
  <path class="line" d="M190,270 L270,390" marker-end="url(#arrow)"/>
  <text class="label" x="20" y="300">starts, gets the work</text>
  <text class="label" x="20" y="314">[Agent tool]</text>
  <text class="data" x="20" y="328">request, work</text>

  <!-- turn:up's moves -->
  <path class="line" d="M260,430 L170,430" marker-end="url(#arrow)"/>
  <text class="label" x="215" y="418" text-anchor="middle">asks the next</text>
  <text class="label" x="215" y="452" text-anchor="middle">move [Bash]</text>
  <path class="line" d="M440,430 L505,430" marker-end="url(#arrow)"/>
  <text class="label" x="472" y="382" text-anchor="middle">starts each</text>
  <text class="label" x="472" y="488" text-anchor="middle">[Agent tool]</text>
  <text class="data" x="472" y="502" text-anchor="middle">request</text>

  <!-- Asks to the person -->
  <path class="line" d="M530,390 L530,110" marker-end="url(#arrow)"/>
  <text class="label" x="538" y="130">asks to confirm,</text>
  <text class="label" x="538" y="144">approve [SendMessage]</text>
  <text class="data" x="538" y="158">template</text>
  <path class="line" d="M790,390 L790,70 L540,70" marker-end="url(#arrow)"/>
  <text class="label" x="798" y="150">asks to decide, approve</text>
  <text class="label" x="798" y="164">[SendMessage]</text>
  <text class="data" x="798" y="178">decision, design tree</text>

  <!-- Research and checks -->
  <path class="line" d="M640,390 L640,270" marker-end="url(#arrow)"/>
  <text class="label" x="648" y="300">reads how good</text>
  <text class="label" x="648" y="314">works are made</text>
  <text class="label" x="648" y="328">[WebSearch, WebFetch]</text>
  <path class="line" d="M1590,330 L1590,110" marker-end="url(#arrow)"/>
  <text class="label" x="1582" y="150" text-anchor="end">checks its file [Bash]</text>
  <text class="data" x="1582" y="164" text-anchor="end">template, design tree, answers</text>

  <!-- The roles and the work -->
  <path class="line" d="M975,390 L1090,270" marker-end="url(#arrow)"/>
  <text class="label" x="1030" y="305" text-anchor="end">makes</text>
  <text class="data" x="1030" y="319" text-anchor="end">work</text>
  <path class="line" d="M1160,390 L1180,270" marker-end="url(#arrow)"/>
  <text class="label" x="1182" y="300">uses as its</text>
  <text class="label" x="1182" y="314">user would</text>
  <text class="data" x="1182" y="328">work</text>
  <path class="line" d="M1345,390 L1330,270" marker-end="url(#arrow)"/>
  <text class="label" x="1346" y="300">betters</text>
  <text class="data" x="1346" y="314">work</text>
  <path class="line" d="M1500,390 L1385,270" marker-end="url(#arrow)"/>
  <text class="label" x="1450" y="296">uses as its</text>
  <text class="label" x="1450" y="310">user would</text>
  <text class="data" x="1450" y="324">work</text>

  <!-- The guard -->
  <path class="line" d="M150,560 L300,470" marker-end="url(#arrow)"/>
  <text class="label" x="232" y="540">holds to its lanes [hooks]</text>
  <path class="line" d="M210,620 L512,620 L512,495" marker-end="url(#arrow)"/>
  <text class="label" x="350" y="612" text-anchor="middle">holds each to its lanes [hooks]</text>
  <path class="line" d="M115,640 L115,740" marker-end="url(#arrow)"/>
  <text class="label" x="123" y="690">asks question IDs</text>
  <text class="data" x="123" y="704">template</text>
  <path class="line" d="M200,640 L300,740" marker-end="url(#arrow)"/>
  <text class="label" x="262" y="684">reads the forms</text>

  <!-- The roles and the stores -->
  <path class="line" d="M560,470 L600,640" marker-end="url(#arrow)"/>
  <text class="label" x="588" y="536">reads, keeps</text>
  <text class="data" x="588" y="550">template</text>
  <path class="line" d="M672,470 L720,640" marker-end="url(#arrow)"/>
  <text class="label" x="712" y="582">writes</text>
  <text class="data" x="712" y="596">template</text>
  <path class="line" d="M790,470 L790,640" marker-end="url(#arrow)"/>
  <text class="label" x="798" y="530">writes, reads</text>
  <text class="data" x="798" y="544">design tree,</text>
  <text class="data" x="798" y="558">answers</text>
  <path class="line" d="M975,470 L975,640" marker-end="url(#arrow)"/>
  <text class="label" x="983" y="530">writes, reads</text>
  <text class="data" x="983" y="544">answers,</text>
  <text class="data" x="983" y="558">design tree</text>
  <path class="line" d="M1160,470 L1160,640" marker-end="url(#arrow)"/>
  <text class="label" x="1168" y="530">writes</text>
  <text class="data" x="1168" y="544">answers</text>
  <path class="line" d="M1345,470 L1345,640" marker-end="url(#arrow)"/>
  <text class="label" x="1353" y="530">writes, reads</text>
  <text class="data" x="1353" y="544">answers</text>
  <path class="line" d="M1530,470 L1530,640" marker-end="url(#arrow)"/>
  <text class="label" x="1538" y="530">writes</text>
  <text class="data" x="1538" y="544">answers</text>

  <!-- Legend -->
  <text class="envname" x="20" y="875">Legend</text>
  <rect class="box" x="90" y="860" width="36" height="24" rx="12"/>
  <text class="label" x="134" y="877">person</text>
  <rect class="box" x="210" y="860" width="36" height="24" rx="8"/>
  <text class="label" x="254" y="877">AI agent</text>
  <rect class="box" x="340" y="860" width="36" height="24" rx="0"/>
  <text class="label" x="384" y="877">code</text>
  <path class="store" d="M450,864 A18,4 0 0 1 486,864 V880 A18,4 0 0 1 450,880 Z"/>
  <path class="store" d="M450,864 A18,4 0 0 0 486,864"/>
  <text class="label" x="494" y="877">store of data</text>
  <rect class="ext" x="600" y="860" width="36" height="24" rx="3"/>
  <text class="label" x="644" y="877">outside turn</text>
  <text class="label" x="760" y="868">[type · technology] in a box; [protocol or tool] on an arrow</text>
  <text class="data" x="760" y="886">data handed on, named as in the data model</text>
</svg>
