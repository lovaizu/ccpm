# Mutation testing of rn's scripts, run from the top of the repository on a copy that may
# be changed.
[cosmic-ray]
module-path = ["rn/scripts"]
timeout = 60.0
# The type checker runs first: a change to a type annotation changes no behavior a test could see,
# and the type checker is what checks annotations.
test-command = "sh -c 'pyrefly check --search-path dev/lane --search-path dev/rn/tests --search-path rn/scripts rn/scripts dev/rn/tests && python -m unittest discover -f -s dev/rn/tests'"

[cosmic-ray.distributor]
name = "local"
