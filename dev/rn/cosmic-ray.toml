# Mutation testing of rn's scripts, run from the top of the repository on a copy that may
# be changed.
[cosmic-ray]
module-path = ["rn/scripts"]
timeout = 60.0
# The type checker and the linter run first: a change to a type annotation changes no behavior a
# test could see, and the type checker is what checks annotations, the linter what checks `is`
# against a literal.
# A line marked `# pragma: no mutate` compares a value with one of the few the code ever gives it,
# where no input tells a mutant of it apart: by order with the first or the last of them, such as
# "plan", the last of the sign-offs, or `__name__`, which is "__main__" or, imported by the tests,
# "rn", after it; or by `is` with a text CPython keeps one copy of, a name such as "__main__" or a
# character such as a tick, or with the very text the value was taken from, such as the number of
# a work's latest call. Each such line holds that comparison alone, as the mark leaves out every
# mutant of its line.
# Where the code compares a value with one it knows, its tests take values on either side of that
# one in order too, such as a stage before the sign-off asked and one after, so a comparison changed
# to `<=` or `>=` fails a test; their comments say what each value is, not where it sorts.
test-command = "sh -c 'ruff check --select F632 rn && sh dev/typecheck.sh rn && python -m unittest discover -f -s dev/rn/tests'"
