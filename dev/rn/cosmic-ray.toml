# The mutation testing of rn's own code that dev/scripts/quality.sh runs in CI, as N7 of
# plugins/rn/domain/best-practices/code/best-practice.md says: its domain, the scripts that run it,
# and its adapters for Lane. The check fails on each mutant under which every test still passes. A
# line marked `# pragma: no mutate` holds only changes that can't alter what the code does.
[cosmic-ray]
module-path = ["plugins/rn/domain", "plugins/rn/scripts", "plugins/rn/lane/adapters"]
timeout = 60.0
excluded-modules = []
# The unit tests try each case of each command of rn's code through the command, in seconds on every
# core, where the integration tests take far longer for each mutant and add no case of a command.
test-command = "python -m pytest -x -q -n auto -p no:cacheprovider dev/rn/tests/unit"

[cosmic-ray.distributor]
name = "local"

# rn's code writes `|` only in type annotations, which `from __future__ import annotations` never
# evaluates, so a change to it can't alter what the code does.
[cosmic-ray.filters.operators-filter]
exclude-operators = [
  "core/ReplaceBinaryOperator_BitOr_.*",
]
