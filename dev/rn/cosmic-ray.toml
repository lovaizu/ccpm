# Mutation testing of rn's scripts and hooks, run from the top of the repository on a copy that may
# be changed.
[cosmic-ray]
module-path = ["rn/scripts", "rn/hooks"]
timeout = 60.0
# What rn takes from lane through a link is mutated there, with lane's tests.
excluded-modules = ["rn/hooks/shell.py", "rn/hooks/hook.py"]
# The type checker runs first: a change to a type annotation changes no behavior a test could see,
# and the type checker is what checks annotations.
test-command = "sh -c 'pyrefly check --search-path dev/lane --search-path dev/rn/tests --search-path rn/scripts --search-path rn/hooks rn/scripts rn/hooks dev/rn/tests && python -m unittest discover -f -s dev/rn/tests'"

[cosmic-ray.distributor]
name = "local"
