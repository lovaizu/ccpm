<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460">
  <title>rn&#x27;s deployment</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="460"/>
  <rect class="frame" x="20" y="20" width="640" height="420" rx="10"/>
  <text class="frame-name" x="36" y="42">the user&#x27;s computer [macOS or Linux]</text>
  <rect class="unit" x="40" y="60" width="600" height="150" rx="8"/>
  <text class="frame-name" x="56" y="82">Claude Code</text>
  <rect class="box" x="60" y="100" width="170" height="80" rx="6"/>
  <text class="name" x="145.0" y="136.0">orchestrator</text>
  <text class="kind" x="145.0" y="156.0">[the main conversation]</text>
  <rect class="box" x="255" y="100" width="170" height="80" rx="6"/>
  <text class="name" x="340.0" y="136.0">generator</text>
  <text class="kind" x="340.0" y="156.0">[subagent]</text>
  <rect class="box" x="450" y="100" width="170" height="80" rx="6"/>
  <text class="name" x="535.0" y="136.0">evaluator</text>
  <text class="kind" x="535.0" y="156.0">[subagent]</text>
  <rect class="box" x="40" y="250" width="280" height="90" rx="6"/>
  <text class="name" x="180.0" y="291.0">rn and Lane</text>
  <text class="kind" x="180.0" y="311.0">[plugins: prompts, best practices]</text>
  <rect class="store" x="340" y="250" width="300" height="140" rx="6"/>
  <text class="name" x="490.0" y="316.0">the run&#x27;s worktree</text>
  <text class="kind" x="490.0" y="336.0">[design tree, rounds, deliverables]</text>
  <rect class="ext" x="720" y="60" width="200" height="80" rx="6"/>
  <text class="name" x="820.0" y="96.0">Claude</text>
  <text class="kind" x="820.0" y="116.0">[the model]</text>
  <rect class="ext" x="720" y="250" width="200" height="80" rx="6"/>
  <text class="name" x="820.0" y="286.0">GitHub</text>
  <text class="kind" x="820.0" y="306.0">[the pull request]</text>
  <rect class="ext" x="720" y="360" width="200" height="70" rx="6"/>
  <text class="name" x="820.0" y="391.0">ccpm marketplace</text>
  <text class="kind" x="820.0" y="411.0">[on GitHub]</text>
  <path class="line" d="M640,100 L720,100" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="680" y="92">each call</text>
  <path class="line" d="M640,290 L720,290" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="680" y="282">pushes</text>
  <path class="line" d="M720,418 L180,418 L180,340" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="500" y="410">installs</text>
  <path class="line" d="M180,250 L180,210" marker-end="url(#arrow)"/>
  <text class="data halo start" x="188" y="234">loads</text>
  <path class="line" d="M490,210 L490,250" marker-end="url(#arrow)"/>
  <text class="data halo start" x="498" y="234">reads and writes</text>
</svg>
