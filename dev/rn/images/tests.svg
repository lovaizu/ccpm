<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 632">
  <title>rn&#x27;s tests</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="16" refY="5" markerWidth="14" markerHeight="9" orient="auto-start-reverse">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
    <marker id="kindof" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path class="hole" d="M0,0 L12,6 L0,12 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="632"/>
  <text class="name start" x="250" y="50">unit</text>
  <text class="kind start" x="250" y="68">one part against its contract</text>
  <text class="name start" x="560" y="50">architecture</text>
  <text class="kind start" x="560" y="68">the parts joined, against this document</text>
  <text class="name start" x="870" y="50">product vision</text>
  <text class="kind start" x="870" y="68">rn in real use, against the product vision</text>
  <text class="name start" x="30" y="50">Deployment unit</text>
  <rect class="box" x="20" y="90" width="210" height="56" rx="4"/>
  <text class="name" x="125.0" y="123.0" text-anchor="middle">tree.py process</text>
  <rect class="lane" x="250" y="90" width="290" height="56" rx="4"/>
  <text class="name start" x="262" y="123">unittest · FULL</text>
  <rect class="lane" x="560" y="90" width="290" height="56" rx="4"/>
  <text class="name start" x="572" y="123">unittest · FULL</text>
  <rect class="box" x="870" y="90" width="290" height="56" rx="4"/>
  <text class="name start" x="882" y="123">a trial · SMOKE</text>
  <rect class="box" x="20" y="158" width="210" height="56" rx="4"/>
  <text class="name" x="125.0" y="191.0" text-anchor="middle">throwaway.py process</text>
  <rect class="lane" x="250" y="158" width="290" height="56" rx="4"/>
  <text class="name start" x="262" y="191">unittest · FULL</text>
  <rect class="lane" x="560" y="158" width="290" height="56" rx="4"/>
  <text class="name start" x="572" y="191">unittest · HAPPY</text>
  <rect class="box" x="870" y="158" width="290" height="56" rx="4"/>
  <text class="name start" x="882" y="191">a trial · SMOKE</text>
  <rect class="box" x="20" y="226" width="210" height="56" rx="4"/>
  <text class="name" x="125.0" y="259.0" text-anchor="middle">adapter process</text>
  <rect class="lane" x="250" y="226" width="290" height="56" rx="4"/>
  <text class="name start" x="262" y="259">unittest · FULL</text>
  <rect class="lane" x="560" y="226" width="290" height="56" rx="4"/>
  <text class="name start" x="572" y="259">unittest · FULL</text>
  <rect class="box" x="870" y="226" width="290" height="56" rx="4"/>
  <text class="name start" x="882" y="259">a trial · SMOKE</text>
  <rect class="box" x="20" y="294" width="210" height="56" rx="4"/>
  <text class="name" x="125.0" y="327.0" text-anchor="middle">hook process</text>
  <text class="label small" x="262" y="318">Empty, as Lane's own tests try the guard.</text>
  <rect class="lane" x="560" y="294" width="290" height="56" rx="4"/>
  <text class="name start" x="572" y="327">unittest · FULL</text>
  <rect class="box" x="870" y="294" width="290" height="56" rx="4"/>
  <text class="name start" x="882" y="327">a trial · SMOKE</text>
  <rect class="box" x="20" y="362" width="210" height="56" rx="4"/>
  <text class="name" x="125.0" y="395.0" text-anchor="middle">Claude Code process</text>
  <text class="label small" x="262" y="386">Empty, as a prompt tried alone meets only</text>
  <text class="label small" x="262" y="401">its developer's cases.</text>
  <rect class="lane" x="560" y="362" width="290" height="56" rx="4"/>
  <text class="name start" x="572" y="395">claude plugin validate · HAPPY</text>
  <rect class="box" x="870" y="362" width="290" height="56" rx="4"/>
  <text class="name start" x="882" y="395">a trial · HAPPY</text>
  <text class="frame-name" x="30" y="454">Legend</text>
  <rect class="lane" x="100" y="440" width="30" height="20" rx="4"/>
  <text class="label small" x="140" y="454" text-anchor="start">runs on every push and in CI</text>
  <rect class="box" x="380" y="440" width="30" height="20" rx="4"/>
  <text class="label small" x="420" y="454" text-anchor="start">runs once every lower level passes</text>
  <text class="label small" x="700" y="454" text-anchor="start">tool · FULL each case, HAPPY the main paths, or SMOKE one run</text>
  <rect class="frame" x="20" y="480" width="1140" height="132" rx="6"/>
  <text class="frame-name" x="36" y="504">Where rn&#x27;s tests differ from the best practices</text>
  <text class="label small" x="36" y="530" text-anchor="start">Architecture: Lane&#x27;s double of Claude Code stands in for each role, with a set answer for each point and sign-off put to the user.</text>
  <text class="label small" x="36" y="552" text-anchor="start">It also checks that each role has its agent and its part, that its forms carry the data its sequences hand on, and that Lane holds each lane a principle rests on.</text>
  <text class="label small" x="36" y="574" text-anchor="start">Product vision: the README&#x27;s walkthrough on lovaizu/playground, run by an AI on Opus that holds an intent rn never sees. It passes where 3 runs of 3 come through every step.</text>
  <text class="label small" x="36" y="596" text-anchor="start">Only it shows each judgment of the orchestrator&#x27;s and whether an intent is good, as only an AI makes them.</text>
</svg>
