<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580">
  <title>rn&#x27;s concepts</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="580"/>
  <rect class="box" x="60" y="60" width="180" height="60" rx="6"/>
  <text class="name" x="150.0" y="95.0">Steering</text>
  <rect class="box" x="390" y="60" width="180" height="60" rx="6"/>
  <text class="name" x="480.0" y="95.0">Step</text>
  <rect class="box" x="720" y="60" width="180" height="60" rx="6"/>
  <text class="name" x="810.0" y="95.0">Deliverable</text>
  <rect class="box" x="60" y="260" width="180" height="60" rx="6"/>
  <text class="name" x="150.0" y="295.0">Opportunity</text>
  <rect class="box" x="480" y="260" width="180" height="60" rx="6"/>
  <text class="name" x="570.0" y="295.0">Best practice</text>
  <rect class="box" x="60" y="460" width="180" height="60" rx="6"/>
  <text class="name" x="150.0" y="495.0">Solution</text>
  <rect class="box" x="480" y="460" width="180" height="60" rx="6"/>
  <text class="name" x="570.0" y="495.0">Round</text>
  <rect class="box" x="720" y="460" width="180" height="60" rx="6"/>
  <text class="name" x="810.0" y="495.0">Fix</text>
  <path class="line" d="M240,90 L390,90"/>
  <text class="label halo mid" x="315" y="80">lists</text>
  <text class="label small halo start" x="252" y="82">1</text>
  <text class="label small halo end" x="378" y="82">1..*</text>
  <path class="line" d="M570,90 L720,90"/>
  <text class="label halo mid" x="645" y="80">makes</text>
  <text class="label small halo start" x="582" y="82">1</text>
  <text class="label small halo end" x="708" y="82">*</text>
  <path class="line" d="M150,120 L150,260"/>
  <text class="label halo start" x="160" y="195">holds</text>
  <text class="label small halo end" x="140" y="140">1</text>
  <text class="label small halo end" x="140" y="252">1..*</text>
  <path class="line" d="M150,320 L150,460"/>
  <text class="label halo start" x="160" y="395">is met by</text>
  <text class="label small halo end" x="140" y="340">1</text>
  <text class="label small halo end" x="140" y="452">0..1</text>
  <path class="line" d="M240,280 L300,280 L300,305 L240,305"/>
  <text class="label halo start" x="308" y="297">holds the more specific</text>
  <text class="label small halo start" x="252" y="272">0..1</text>
  <text class="label small halo start" x="252" y="322">*</text>
  <path class="line" d="M430,120 L220,260"/>
  <text class="label halo end" x="318" y="182">meets</text>
  <text class="label small halo start" x="440" y="140">*</text>
  <text class="label small halo start" x="232" y="250">1</text>
  <path class="line" d="M760,120 L620,260"/>
  <text class="label halo start" x="700" y="196">is made by</text>
  <text class="label small halo start" x="764" y="140">*</text>
  <text class="label small halo start" x="640" y="256">1</text>
  <path class="line" d="M780,120 L650,460"/>
  <text class="label halo start" x="722" y="330">takes</text>
  <text class="label small halo start" x="790" y="142">1</text>
  <text class="label small halo start" x="664" y="450">1..*</text>
  <path class="line" d="M840,120 L840,460"/>
  <text class="label halo start" x="850" y="400">takes</text>
  <text class="label small halo start" x="850" y="140">1</text>
  <text class="label small halo start" x="850" y="452">*</text>
  <path class="line" d="M570,460 L570,320"/>
  <text class="label halo end" x="560" y="395">judges by</text>
  <text class="label small halo start" x="580" y="452">*</text>
  <text class="label small halo start" x="580" y="340">1</text>
</svg>
