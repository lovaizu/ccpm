  <path class="line" d="M620,102 L260,102" marker-end="url(#arrow)"/>
  <text class="label small halo" x="440" y="94" text-anchor="middle">merges the pull request</text>
  <path class="line" d="M700,144 L700,260" marker-end="url(#arrow)"/>
  <text class="label small halo" x="692" y="188" text-anchor="end">types /rn:up, /rn:dn,</text>
  <text class="label small halo" x="692" y="202" text-anchor="end">/rn:ty, /rn:gm, answers</text>
  <path class="line" d="M760,260 L760,144" marker-end="url(#arrow)"/>
  <text class="label small halo" x="768" y="174" text-anchor="start">asks each point that&#x27;s theirs,</text>
  <text class="label small halo" x="768" y="188" text-anchor="start">and puts up each sign-off</text>
  <text class="data halo" x="768" y="202" text-anchor="start">Point, Sign-off</text>
  <path class="line" d="M160,260 L160,144" marker-end="url(#arrow)"/>
  <text class="label small halo" x="168" y="168" text-anchor="start">pushes, keeps the pull request,</text>
  <text class="label small halo" x="168" y="182" text-anchor="start">marks it ready, reads its</text>
  <text class="label small halo" x="168" y="196" text-anchor="start">comments, opens each issue</text>
  <text class="label small halo" x="168" y="210" text-anchor="start">the user says yes to [git, gh]</text>
  <path class="line" d="M160,480 L160,324" marker-end="url(#arrow)"/>
  <text class="label small halo" x="168" y="380" text-anchor="start">runs each git</text>
  <text class="label small halo" x="168" y="394" text-anchor="start">and gh command</text>
  <text class="label small halo" x="168" y="408" text-anchor="start">by it [import]</text>
  <path class="line" d="M620,312 L290,312 L290,496 L260,496" marker-end="url(#arrow)"/>
  <text class="data halo" x="465" y="304" text-anchor="middle">Cut, Sign-off, Place, Comment</text>
  <text class="label small halo" x="465" y="332" text-anchor="middle">makes the run&#x27;s worktree, gets each cut,</text>
  <text class="label small halo" x="465" y="346" text-anchor="middle">lists the runs left, puts up each sign-off,</text>
  <text class="label small halo" x="465" y="360" text-anchor="middle">approves or sends it back as /rn:ty or</text>
  <text class="label small halo" x="465" y="374" text-anchor="middle">/rn:gm loads, pushes, commits a pause,</text>
  <text class="label small halo" x="465" y="388" text-anchor="middle">gets the comments, marks the pull request</text>
  <text class="label small halo" x="465" y="402" text-anchor="middle">ready, opens each issue [Bash]</text>
  <path class="line" d="M380,544 L380,630"/>
  <path class="line" d="M640,544 L640,630 L210,630 L210,544" marker-end="url(#arrow)"/>
  <text class="label small halo" x="425" y="648" text-anchor="middle">the tree-keeper writes the tree and keeps each lack,</text>
  <text class="label small halo" x="425" y="662" text-anchor="middle">and the generator commits each step&#x27;s work [Bash]</text>
  <text class="data halo" x="425" y="676" text-anchor="middle">Design tree, Lack kept, Place</text>
  <path class="line" d="M120,544 L120,940" marker-end="url(#arrow)"/>
  <text class="label small halo" x="128" y="800" text-anchor="start">writes, reads,</text>
  <text class="label small halo" x="128" y="814" text-anchor="start">cuts, commits</text>
  <text class="data halo" x="128" y="828" text-anchor="start">Design tree, Sign-off</text>
  <path class="line" d="M720,324 L720,440"/>
  <path class="line" d="M440,440 L1000,440"/>
  <path class="line" d="M440,440 L440,480" marker-end="url(#arrow)"/>
  <path class="line" d="M720,440 L720,480" marker-end="url(#arrow)"/>
  <path class="line" d="M1000,440 L1000,480" marker-end="url(#arrow)"/>
  <text class="label small halo" x="730" y="346" text-anchor="start">starts each role, gets its result, resumes the</text>
  <text class="label small halo" x="730" y="360" text-anchor="start">tree-keeper or a generator, and stops each</text>
  <text class="label small halo" x="730" y="374" text-anchor="start">[Agent, SendMessage, TaskStop]</text>
  <text class="data halo" x="730" y="390" text-anchor="start">Cut, Decision, Lack kept, Place</text>
  <path class="line" d="M720,544 L720,720" marker-end="url(#arrow)"/>
  <text class="label small halo" x="712" y="680" text-anchor="end">tries it [Bash]</text>
  <text class="data halo" x="712" y="694" text-anchor="end">Try record</text>
  <path class="line" d="M820,516 L860,516 L860,752 L900,752" marker-end="url(#arrow)"/>
  <text class="label small halo" x="868" y="670" text-anchor="start">makes</text>
  <text class="label small halo" x="868" y="684" text-anchor="start">[Write, Edit]</text>
  <text class="data halo" x="868" y="698" text-anchor="start">Deliverable</text>
  <path class="line" d="M1000,544 L1000,720" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1008" y="650" text-anchor="start">reads</text>
  <text class="data halo" x="1008" y="664" text-anchor="start">Deliverable</text>
  <path class="line" d="M1080,544 L1080,1080 L400,1080 L400,1004" marker-end="url(#arrow)"/>
  <text class="label small halo" x="740" y="1072" text-anchor="middle">writes</text>
  <text class="data halo" x="740" y="1096" text-anchor="middle">Answers</text>
  <path class="line" d="M720,784 L720,940" marker-end="url(#arrow)"/>
  <text class="label small halo" x="728" y="860" text-anchor="start">writes</text>
  <text class="data halo" x="728" y="874" text-anchor="start">Try record</text>
  <path class="line" d="M1120,302 L1180,302" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1112" y="288" text-anchor="end">records each step and practice [Bash]</text>
  <text class="data halo" x="1112" y="320" text-anchor="end">Record</text>
  <path class="line" d="M1180,272 L1150,272 L1150,46"/>
  <path class="line" d="M1280,480 L1280,324" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1288" y="392" text-anchor="start">runs rn&#x27;s check</text>
  <text class="label small halo" x="1288" y="406" text-anchor="start">at each end [stdio]</text>
  <text class="data halo" x="1288" y="420" text-anchor="start">Record</text>
  <path class="line" d="M1180,510 L1120,510" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1272" y="440" text-anchor="end">holds each call,</text>
  <text class="label small halo" x="1272" y="454" text-anchor="end">start, and end [hooks]</text>
  <path class="line" d="M1380,510 L1420,510 L1420,112 L1380,112" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1412" y="340" text-anchor="end">runs</text>
  <text class="label small halo" x="1412" y="354" text-anchor="end">[stdio]</text>
  <path class="line" d="M1280,544 L1280,720" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1288" y="636" text-anchor="start">reads</text>
  <path class="line" d="M1280,144 L1280,260" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1288" y="190" text-anchor="start">gets each result</text>
  <text class="label small halo" x="1288" y="204" text-anchor="start">kept [import]</text>
  <text class="data halo" x="1288" y="218" text-anchor="start">Record</text>
  <path class="line" d="M1200,80 L1200,46 L30,46 L30,512 L60,512" marker-end="url(#arrow)"/>
  <text class="label small halo" x="600" y="24" text-anchor="middle">the adapters get the work of each role that tree.py gave its turn, and each Cut, and</text>
  <text class="label small halo" x="600" y="38" text-anchor="middle">record.py gets the Cut, the Answers, and the best practice of the role it checks [import]</text>
  <text class="data halo" x="38" y="340" text-anchor="start">Cut, Answers,</text>
  <text class="data halo" x="38" y="354" text-anchor="start">Best practice</text>
  <path class="line" d="M1380,302 L1450,302 L1450,1130 L300,1130 L300,1004" marker-end="url(#arrow)"/>
  <text class="label small halo" x="870" y="1122" text-anchor="middle">writes and reads each record</text>
  <text class="data halo" x="870" y="1146" text-anchor="middle">Record</text>
  <path class="line" d="M1120,560 L1150,560 L1150,972 L1180,972" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1158" y="840" text-anchor="start">each reads its best practice</text>
  <text class="data halo" x="1158" y="854" text-anchor="start">Best practice</text>
  <text class="frame-name" x="30" y="1190">Legend</text>
  <rect class="box" x="100" y="1176" width="30" height="20"/>
  <text class="label small" x="140" y="1190" text-anchor="start">a component of rn, or a store of its data</text>
  <rect class="ext" x="440" y="1176" width="30" height="20" rx="6"/>
  <text class="label small" x="480" y="1190" text-anchor="start">outside rn; with a head: the product vision&#x27;s role</text>
  <rect class="frame" x="820" y="1176" width="30" height="20"/>
  <text class="label small" x="860" y="1190" text-anchor="start">an arrow to or from it: one for each component in it</text>
  <text class="label small" x="100" y="1216" text-anchor="start">a box: name and [type · technology]. An arrow: what it does [tool]</text>
