<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 790">
  <title>rn&#x27;s components</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1020" height="790"/>
  <rect class="box" x="600" y="20" width="180" height="70" rx="6"/>
  <text class="name" x="690.0" y="51.0">vital few</text>
  <text class="kind" x="690.0" y="71.0">[prompt]</text>
  <path class="line" d="M560,150 L620,90" marker-end="url(#arrow)"/>
  <text class="data halo end" x="584" y="112">weighs by</text>
  <path class="line" d="M820,150 L760,90" marker-end="url(#arrow)"/>
  <text class="data halo start" x="796" y="112">weighs by</text>
  <g transform="translate(0,110)">
  <rect class="frame" x="40" y="340" width="560" height="170" rx="10"/>
  <text class="frame-name" x="56" y="362">round: one making and judging of a deliverable</text>
  <rect class="box" x="40" y="40" width="180" height="80" rx="6"/>
  <text class="name" x="130.0" y="85.0">user</text>
  <rect class="box" x="340" y="40" width="240" height="80" rx="6"/>
  <text class="name" x="460.0" y="76.0">orchestrator</text>
  <text class="kind" x="460.0" y="96.0">[prompt]</text>
  <rect class="box" x="800" y="40" width="180" height="80" rx="6"/>
  <text class="name" x="890.0" y="76.0">pruner</text>
  <text class="kind" x="890.0" y="96.0">[prompt]</text>
  <rect class="store" x="800" y="220" width="180" height="80" rx="6"/>
  <text class="name" x="890.0" y="265.0">design tree</text>
  <rect class="box" x="590" y="220" width="150" height="80" rx="6"/>
  <text class="name" x="665.0" y="256.0">scripts</text>
  <text class="kind" x="665.0" y="276.0">[script]</text>
  <rect class="box" x="800" y="400" width="180" height="80" rx="6"/>
  <text class="name" x="890.0" y="436.0">hook</text>
  <text class="kind" x="890.0" y="456.0">[hook]</text>
  <rect class="box" x="80" y="400" width="200" height="80" rx="6"/>
  <text class="name" x="180.0" y="436.0">generator</text>
  <text class="kind" x="180.0" y="456.0">[prompt]</text>
  <rect class="box" x="340" y="400" width="200" height="80" rx="6"/>
  <text class="name" x="440.0" y="436.0">evaluator</text>
  <text class="kind" x="440.0" y="456.0">[prompt]</text>
  <rect class="store" x="210" y="570" width="200" height="60" rx="6"/>
  <text class="name" x="310.0" y="605.0">best practice</text>
  <path class="line" d="M220,65 L340,65" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="280" y="56">request, answers, /rn:ty</text>
  <path class="line" d="M340,95 L220,95" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="280" y="114">points, sign-offs</text>
  <path class="line" d="M580,60 L800,60" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="690" y="51">starts, with each fact</text>
  <path class="line dashed" d="M800,90 L580,90" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="690" y="109">done, with points to ask</text>
  <path class="line" d="M890,120 L890,220" marker-end="url(#arrow)"/>
  <text class="data halo end" x="882" y="174">writes the vital few</text>
  <path class="line" d="M580,112 L800,232" marker-end="url(#arrow)"/>
  <text class="data halo start" x="716" y="168">reads</text>
  <path class="line" d="M545,120 L620,220" marker-end="url(#arrow)"/>
  <text class="data halo start" x="592" y="165">runs</text>
  <path class="line" d="M740,260 L800,260" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="770" y="251">commits</text>
  <path class="line" d="M890,400 L890,300" marker-end="url(#arrow)"/>
  <text class="data halo end" x="882" y="356">refuses other writes</text>
  <path class="line" d="M800,440 L600,440" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="700" y="431">sends deletes to a script</text>
  <path class="line" d="M380,120 L380,340" marker-end="url(#arrow)"/>
  <text class="data halo end" x="372" y="240">starts each, with its Cut</text>
  <path class="line dashed" d="M460,340 L460,120" marker-end="url(#arrow)"/>
  <text class="data halo start" x="468" y="200">done, with the Round</text>
  <path class="line" d="M580,340 L630,300" marker-end="url(#arrow)"/>
  <text class="data halo start" x="612" y="332">run</text>
  <path class="line" d="M180,480 L280,570" marker-end="url(#arrow)"/>
  <text class="data halo end" x="222" y="535">makes by</text>
  <path class="line" d="M440,480 L340,570" marker-end="url(#arrow)"/>
  <text class="data halo start" x="402" y="535">judges by</text>
  <text class="label" x="660" y="548">Legend</text>
  <rect class="box" x="660" y="560" width="22" height="16" rx="3"/>
  <text class="label small" x="692" y="573">a role</text>
  <rect class="store" x="660" y="586" width="22" height="16" rx="3"/>
  <text class="label small" x="692" y="599">a store of data</text>
  <rect class="frame" x="660" y="612" width="22" height="16" rx="3"/>
  <text class="label small" x="692" y="625">a round</text>
  <path class="line dashed" d="M660,646 L682,646" marker-end="url(#arrow)"/>
  <text class="label small" x="692" y="650">a result handed back</text>
  </g>
</svg>
