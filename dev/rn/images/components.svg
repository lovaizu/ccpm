<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630">
  <title>rn&#x27;s components</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="630"/>
  <rect class="frame" x="300" y="24" width="620" height="150" rx="10"/>
  <text class="frame-name" x="316" y="46">turn: at each event</text>
  <rect class="frame" x="230" y="300" width="480" height="150" rx="10"/>
  <text class="frame-name" x="246" y="322">round: one for each deliverable due</text>
  <rect class="box" x="40" y="70" width="180" height="80" rx="6"/>
  <text class="name" x="130.0" y="106.0">user</text>
  <text class="kind" x="130.0" y="126.0">[person]</text>
  <rect class="box" x="340" y="70" width="240" height="80" rx="6"/>
  <text class="name" x="460.0" y="106.0">orchestrator</text>
  <text class="kind" x="460.0" y="126.0">[the main conversation]</text>
  <rect class="store" x="700" y="70" width="200" height="80" rx="6"/>
  <text class="name" x="800.0" y="106.0">design tree</text>
  <text class="kind" x="800.0" y="126.0">[JSON · checked by tree.py]</text>
  <rect class="box" x="260" y="340" width="180" height="80" rx="6"/>
  <text class="name" x="350.0" y="376.0">generator</text>
  <text class="kind" x="350.0" y="396.0">[subagent]</text>
  <rect class="box" x="500" y="340" width="180" height="80" rx="6"/>
  <text class="name" x="590.0" y="376.0">evaluator</text>
  <text class="kind" x="590.0" y="396.0">[subagent]</text>
  <rect class="store" x="380" y="530" width="180" height="70" rx="6"/>
  <text class="name" x="470.0" y="561.0">best practice</text>
  <text class="kind" x="470.0" y="581.0">[Markdown]</text>
  <rect class="box" x="740" y="360" width="180" height="70" rx="6"/>
  <text class="name" x="830.0" y="391.0">rn&#x27;s developers</text>
  <text class="kind" x="830.0" y="411.0">[person]</text>
  <path class="line" d="M220,95 L340,95" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="280" y="86">request, answers, /rn:ty</text>
  <path class="line" d="M340,125 L220,125" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="280" y="144">points, sign-offs</text>
  <path class="line" d="M580,110 L700,110" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="640" y="101">reviews and edits</text>
  <path class="line" d="M410,150 L350,340" marker-end="url(#arrow)"/>
  <text class="data halo end" x="338" y="250">starts, with its Cut</text>
  <path class="line" d="M510,150 L590,340" marker-end="url(#arrow)"/>
  <text class="data halo start" x="602" y="250">starts, with its Cut</text>
  <path class="line dashed" d="M470,300 L470,150" marker-end="url(#arrow)"/>
  <text class="data halo start" x="478" y="214">done, with the Round</text>
  <path class="line" d="M350,420 L430,530" marker-end="url(#arrow)"/>
  <text class="data halo end" x="372" y="488">makes by</text>
  <path class="line" d="M590,420 L510,530" marker-end="url(#arrow)"/>
  <text class="data halo start" x="568" y="488">judges by</text>
  <path class="line" d="M570,150 L790,360" marker-end="url(#arrow)"/>
  <text class="data halo start" x="700" y="250">each lesson signed off, as an issue</text>
  <text class="label" x="740" y="500">Legend</text>
  <rect class="box" x="740" y="512" width="22" height="16" rx="3"/>
  <text class="label small" x="772" y="525">a role</text>
  <rect class="store" x="740" y="538" width="22" height="16" rx="3"/>
  <text class="label small" x="772" y="551">a store of data</text>
  <rect class="frame" x="740" y="564" width="22" height="16" rx="3"/>
  <text class="label small" x="772" y="577">a turn or a round</text>
  <path class="line dashed" d="M740,598 L762,598" marker-end="url(#arrow)"/>
  <text class="label small" x="772" y="602">a result handed back</text>
</svg>
