<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
  <title>rn&#x27;s components</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="700"/>
  <rect class="box" x="40" y="40" width="160" height="70" rx="6"/>
  <text class="name" x="120.0" y="80.0">user</text>
  <rect class="box" x="300" y="40" width="220" height="70" rx="6"/>
  <text class="name" x="410.0" y="71.0">orchestrator</text>
  <text class="kind" x="410.0" y="91.0">[prompt]</text>
  <rect class="box" x="640" y="40" width="180" height="70" rx="6"/>
  <text class="name" x="730.0" y="71.0">references</text>
  <text class="kind" x="730.0" y="91.0">[document]</text>
  <rect class="box" x="40" y="220" width="160" height="70" rx="6"/>
  <text class="name" x="120.0" y="251.0">hook</text>
  <text class="kind" x="120.0" y="271.0">[hook]</text>
  <rect class="box" x="330" y="220" width="190" height="70" rx="6"/>
  <text class="name" x="425.0" y="251.0">scripts</text>
  <text class="kind" x="425.0" y="271.0">[script]</text>
  <rect class="store" x="640" y="220" width="180" height="70" rx="6"/>
  <text class="name" x="730.0" y="260.0">steering</text>
  <rect class="frame" x="20" y="380" width="800" height="140" rx="10"/>
  <text class="frame-name" x="36" y="402">roles started for the work</text>
  <rect class="box" x="40" y="420" width="140" height="70" rx="6"/>
  <text class="name" x="110.0" y="451.0">generator</text>
  <text class="kind" x="110.0" y="471.0">[prompt]</text>
  <rect class="box" x="195" y="420" width="140" height="70" rx="6"/>
  <text class="name" x="265.0" y="451.0">evaluator</text>
  <text class="kind" x="265.0" y="471.0">[prompt]</text>
  <rect class="box" x="350" y="420" width="140" height="70" rx="6"/>
  <text class="name" x="420.0" y="451.0">fixer</text>
  <text class="kind" x="420.0" y="471.0">[prompt]</text>
  <rect class="box" x="505" y="420" width="140" height="70" rx="6"/>
  <text class="name" x="575.0" y="451.0">refactorer</text>
  <text class="kind" x="575.0" y="471.0">[prompt]</text>
  <rect class="box" x="660" y="420" width="140" height="70" rx="6"/>
  <text class="name" x="730.0" y="451.0">inspector</text>
  <text class="kind" x="730.0" y="471.0">[prompt]</text>
  <rect class="store" x="860" y="420" width="200" height="70" rx="6"/>
  <text class="name" x="960.0" y="460.0">Rounds and Fixes</text>
  <rect class="store" x="290" y="600" width="200" height="60" rx="6"/>
  <text class="name" x="390.0" y="635.0">best practice</text>
  <path class="line" d="M200,65 L300,65" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="250" y="56">request, answers</text>
  <path class="line" d="M300,95 L200,95" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="250" y="114">points, what to try</text>
  <path class="line" d="M520,75 L640,75" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="580" y="66">weighs by</text>
  <path class="line" d="M520,255 L640,255" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="580" y="246">writes the aim and where it stands</text>
  <path class="line" d="M440,110 L440,220" marker-end="url(#arrow)"/>
  <text class="data halo start" x="448" y="170">runs, with the aim</text>
  <path class="line dashed" d="M380,220 L380,110" marker-end="url(#arrow)"/>
  <text class="data halo end" x="372" y="170">what&#x27;s due</text>
  <path class="line" d="M200,255 L330,255" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="265" y="246">runs as a role ends</text>
  <path class="line" d="M310,110 L310,380" marker-end="url(#arrow)"/>
  <text class="data halo end" x="302" y="350">starts each</text>
  <path class="line dashed" d="M560,380 L560,320 L500,320 L500,110" marker-end="url(#arrow)"/>
  <text class="data halo start" x="568" y="340">done, with each result</text>
  <path class="line" d="M430,380 L430,290" marker-end="url(#arrow)"/>
  <text class="data halo start" x="438" y="350">runs a trial</text>
  <path class="line" d="M820,455 L860,455" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="840" y="446">writes</text>
  <path class="line" d="M110,490 L300,600" marker-end="url(#arrow)"/>
  <text class="data halo end" x="196" y="560">makes by</text>
  <path class="line" d="M265,490 L350,600" marker-end="url(#arrow)"/>
  <text class="data halo end" x="300" y="545">judges by</text>
  <path class="line" d="M420,490 L410,600" marker-end="url(#arrow)"/>
  <text class="data halo start" x="420" y="560">mends by</text>
  <path class="line" d="M575,490 L480,600" marker-end="url(#arrow)"/>
  <text class="data halo start" x="540" y="545">refactors by</text>
  <text class="label" x="860" y="560">Legend</text>
  <rect class="box" x="860" y="572" width="22" height="16" rx="3"/>
  <text class="label small" x="892" y="585">a role</text>
  <rect class="store" x="860" y="598" width="22" height="16" rx="3"/>
  <text class="label small" x="892" y="611">a store of data</text>
  <rect class="frame" x="860" y="624" width="22" height="16" rx="3"/>
  <text class="label small" x="892" y="637">roles started together</text>
  <path class="line dashed" d="M860,658 L882,658" marker-end="url(#arrow)"/>
  <text class="label small" x="892" y="662">a result handed back</text>
</svg>
