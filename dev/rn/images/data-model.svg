<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400">
  <title>rn&#x27;s data</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="820" height="400"/>
  <rect class="box" x="60" y="60" width="200" height="60" rx="6"/>
  <text class="name" x="160.0" y="95.0">Design tree</text>
  <rect class="box" x="560" y="60" width="200" height="60" rx="6"/>
  <text class="name" x="660.0" y="95.0">Best practice</text>
  <rect class="box" x="60" y="300" width="200" height="60" rx="6"/>
  <text class="name" x="160.0" y="335.0">Cut</text>
  <rect class="box" x="560" y="300" width="200" height="60" rx="6"/>
  <text class="name" x="660.0" y="335.0">Round</text>
  <path class="line" d="M260,90 L560,90"/>
  <path class="line" d="M160,120 L160,300"/>
  <path class="line" d="M260,330 L560,330"/>
  <path class="line" d="M660,300 L660,120"/>
  <text class="label halo mid" x="410" y="80">names each deliverable&#x27;s kind by</text>
  <text class="label small halo start" x="272" y="82">1</text>
  <text class="label small halo end" x="548" y="82">1..*</text>
  <text class="label halo start" x="172" y="215">gives each role its part as</text>
  <text class="label small halo end" x="150" y="140">1</text>
  <text class="label small halo end" x="150" y="292">*</text>
  <text class="label halo mid" x="410" y="320">starts</text>
  <text class="label small halo start" x="272" y="322">1..*</text>
  <text class="label small halo end" x="548" y="322">1</text>
  <text class="label halo end" x="648" y="215">judges by</text>
  <text class="label small halo start" x="670" y="292">*</text>
  <text class="label small halo start" x="670" y="140">1</text>
</svg>
