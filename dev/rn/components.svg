<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>rn's components</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- roles, each with the responsibilities placed in it -->
  <rect class="box" x="460" y="20" width="240" height="70" rx="8"/>
  <text class="name" x="580" y="46">user</text>
  <text class="kind" x="580" y="66">asks, answers, approves,</text>
  <text class="kind" x="580" y="81">merges</text>

  <rect class="box" x="430" y="230" width="300" height="90" rx="45"/>
  <text class="name" x="580" y="258">orchestrator</text>
  <text class="kind" x="580" y="278">talks with the user, decides each move,</text>
  <text class="kind" x="580" y="293">writes the plan, the learnings</text>
  <text class="kind" x="580" y="308">and each issue</text>

  <rect class="box" x="20" y="230" width="270" height="90" rx="45"/>
  <text class="name" x="155" y="258">compressor</text>
  <text class="kind" x="155" y="278">gives what of a CCS needs</text>
  <text class="kind" x="155" y="293">judgment, returns a point no</text>
  <text class="kind" x="155" y="308">file or decision settles</text>

  <rect class="box" x="880" y="230" width="270" height="90" rx="45"/>
  <text class="name" x="1015" y="258">turn</text>
  <text class="kind" x="1015" y="278">makes every other work,</text>
  <text class="kind" x="1015" y="293">has it used in the receiver's</text>
  <text class="kind" x="1015" y="308">place before it returns it</text>

  <rect class="box" x="440" y="460" width="280" height="90" rx="0"/>
  <text class="name" x="580" y="488">rn's scripts</text>
  <text class="kind" x="580" y="508">keep the steering and each call,</text>
  <text class="kind" x="580" y="523">make each proposal, take an</text>
  <text class="kind" x="580" y="538">answer only where it was typed</text>

  <rect class="box" x="880" y="460" width="270" height="90" rx="8"/>
  <text class="name" x="1015" y="488">GitHub</text>
  <text class="kind" x="1015" y="508">holds the branch, the pull request</text>
  <text class="kind" x="1015" y="523">and each issue, protects the</text>
  <text class="kind" x="1015" y="538">default branch</text>

  <!-- user and orchestrator -->
  <path class="line" d="M560,90 V230" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="550" y="140">request, answer,<tspan x="550" dy="17">approval, feedback</tspan></text>
  <path class="line" d="M600,230 V90" marker-end="url(#arrow)"/>
  <text class="label" x="610" y="132">point to decide, learning,<tspan x="610" dy="17">proposal, line told,</tspan><tspan x="610" dy="17">issue</tspan></text>

  <!-- orchestrator and compressor -->
  <path class="line" d="M435,255 H285" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="360" y="247">CCS, question</text>
  <path class="line" d="M287,290 H433" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="360" y="310">compressor's reply</text>

  <!-- orchestrator and turn -->
  <path class="line" d="M721,248 H889" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="805" y="240">CCS, answer</text>
  <path class="line" d="M880,270 H730" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="805" y="288">question, result</text>

  <!-- orchestrator and rn's scripts -->
  <path class="line" d="M560,320 V460" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="550" y="350">answer, decision, plan,<tspan x="550" dy="17">learning, question,</tspan><tspan x="550" dy="17">compressor's reply,</tspan><tspan x="550" dy="17">approval, feedback</tspan></text>
  <path class="line" d="M600,460 V320" marker-end="url(#arrow)"/>
  <text class="label" x="610" y="345">steering, steering<tspan x="610" dy="17">Markdown, plan, CCS,</tspan><tspan x="610" dy="17">proposal, line told,</tspan><tspan x="610" dy="17">history, conversation</tspan><tspan x="610" dy="17">records</tspan></text>

  <!-- to GitHub -->
  <path class="line" d="M722,300 H800 V490 H880" marker-end="url(#arrow)"/>
  <text class="label" x="808" y="420">issue</text>
  <path class="line" d="M720,525 H880" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="800" y="545">history,</text>
  <text class="label" text-anchor="middle" x="800" y="562">pull request</text>
  <path class="line" d="M700,40 H1185 V505 H1150" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="940" y="32">pull request, merged</text>

  <!-- legend -->
  <rect class="box" x="760" y="612" width="40" height="22" rx="11"/>
  <text class="label" x="808" y="628">AI</text>
  <rect class="box" x="850" y="612" width="40" height="22" rx="0"/>
  <text class="label" x="898" y="628">code</text>
  <rect class="box" x="960" y="612" width="40" height="22" rx="5"/>
  <text class="label" x="1008" y="628">person, or outside rn</text>
</svg>
