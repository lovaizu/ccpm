<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>rn's logical view</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .drift { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>


  <!-- rn's own parts, and the user's repository -->
  <rect class="frame" x="250" y="172" width="290" height="268" rx="10"/>
  <text class="frame-name" x="262" y="191">rn</text>
  <rect class="frame" x="630" y="345" width="315" height="255" rx="10"/>
  <text class="frame-name" x="642" y="589">the user's repository</text>

  <!-- components -->
  <rect class="box" x="315" y="32" width="170" height="48" rx="8"/>
  <text class="name" x="400" y="61">user</text>
  <rect class="box" x="315" y="200" width="170" height="48" rx="24"/>
  <text class="name" x="400" y="229">orchestrator</text>
  <rect class="box" x="315" y="372" width="170" height="48" rx="0"/>
  <text class="name" x="400" y="401">rn's scripts</text>
  <rect class="box" x="755" y="200" width="170" height="48" rx="24"/>
  <text class="name" x="840" y="229">turn</text>
  <rect class="box" x="640" y="372" width="285" height="48" rx="8"/>
  <text class="name" x="782" y="401">record</text>
  <rect class="box" x="755" y="532" width="170" height="48" rx="8"/>
  <text class="name" x="840" y="561">pull request</text>
  <rect class="box" x="15" y="200" width="185" height="48" rx="8"/>
  <text class="name" x="107" y="229">issue to rn's makers</text>
  <rect class="box" x="15" y="372" width="185" height="48" rx="8"/>
  <text class="name" x="107" y="401">conversation records</text>

  <!-- user and orchestrator -->
  <path class="line" d="M388,80 V200" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="378" y="136">asks, answers,<tspan x="378" dy="17">approves</tspan></text>
  <path class="line" d="M412,200 V80" marker-end="url(#arrow)"/>
  <text class="label" x="422" y="136">asks, shows,<tspan x="422" dy="17">tells each step</tspan></text>

  <!-- orchestrator and turn -->
  <path class="line" d="M485,216 H755" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="620" y="206">hands a call</text>
  <path class="line" d="M755,232 H485" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="620" y="252">returns the work, asks</text>

  <!-- orchestrator and rn's scripts -->
  <path class="line" d="M388,248 V372" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="378" y="306">keeps each move</text>
  <path class="line" d="M412,372 V248" marker-end="url(#arrow)"/>
  <text class="label" x="422" y="306">gives where<tspan x="422" dy="17">it stands</tspan></text>

  <!-- the record -->
  <path class="line" d="M485,396 H640" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="585" y="418">writes the<tspan x="585" dy="17">steering,</tspan><tspan x="585" dy="17">commits</tspan></text>
  <path class="line" d="M470,248 L680,372" marker-end="url(#arrow)"/>
  <text class="label" x="600" y="300">writes the plan,<tspan x="600" dy="17">reads each result</tspan></text>
  <path class="line" d="M840,248 V372" marker-end="url(#arrow)"/>
  <text class="label" x="852" y="306">reads the CCS,<tspan x="852" dy="17">writes the work</tspan></text>

  <!-- learnings -->
  <path class="line" d="M315,224 H200" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="225" y="214">sends</text>
  <path class="line" d="M315,396 H200" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="225" y="386">reads</text>

  <!-- the pull request -->
  <path class="line" d="M400,420 V556 H755" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="520" y="576">opens, marks ready</text>
  <path class="line" d="M485,56 H975 V556 H925" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="730" y="46">merges</text>

  <!-- legend -->
  <rect class="box" x="670" y="620" width="40" height="22" rx="11"/>
  <text class="label" x="718" y="636">AI</text>
  <rect class="box" x="760" y="620" width="40" height="22" rx="0"/>
  <text class="label" x="808" y="636">code</text>
  <rect class="box" x="870" y="620" width="40" height="22" rx="5"/>
  <text class="label" x="918" y="636">other</text>
</svg>
