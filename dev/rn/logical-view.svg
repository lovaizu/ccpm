<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>rn's logical view</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 12.5px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- rn's own parts -->
  <rect class="frame" x="435" y="280" width="600" height="200" rx="10"/>
  <text class="frame-name" x="449" y="301">rn</text>

  <!-- components -->
  <rect class="box" x="30" y="40" width="190" height="60" rx="8"/>
  <text class="name" x="125" y="66">issue to rn's makers</text>
  <text class="kind" x="125" y="84">GitHub</text>

  <rect class="box" x="445" y="40" width="190" height="60" rx="8"/>
  <text class="name" x="540" y="66">user</text>
  <text class="kind" x="540" y="84">person</text>

  <rect class="box" x="835" y="40" width="190" height="60" rx="8"/>
  <text class="name" x="930" y="66">pull request</text>
  <text class="kind" x="930" y="84">GitHub</text>

  <rect class="box" x="30" y="350" width="190" height="60" rx="8"/>
  <text class="name" x="125" y="376">turn</text>
  <text class="kind" x="125" y="394">plugin</text>

  <rect class="box" x="445" y="350" width="190" height="60" rx="8"/>
  <text class="name" x="540" y="376">orchestrator</text>
  <text class="kind" x="540" y="394">main conversation</text>

  <rect class="box" x="835" y="350" width="190" height="60" rx="8"/>
  <text class="name" x="930" y="376">rn's scripts</text>
  <text class="kind" x="930" y="394">script</text>

  <rect class="box" x="30" y="640" width="670" height="60" rx="8"/>
  <text class="name" x="365" y="666">record</text>
  <text class="kind" x="365" y="684">files on the branch</text>

  <rect class="box" x="835" y="640" width="190" height="60" rx="8"/>
  <text class="name" x="930" y="666">conversation records</text>
  <text class="kind" x="930" y="684">Claude Code</text>

  <!-- user and orchestrator -->
  <path class="line" d="M525,100 V350" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="515" y="140">asks, answers, approves or sends back,<tspan x="515" dy="16">stops a step</tspan></text>
  <path class="line" d="M555,350 V100" marker-end="url(#arrow)"/>
  <text class="label" x="565" y="140">asks each point,<tspan x="565" dy="16">shows each proposal,</tspan><tspan x="565" dy="16">tells each step</tspan></text>

  <!-- user and pull request -->
  <path class="line" d="M635,70 H835" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="735" y="60">merges</text>

  <!-- orchestrator and issue -->
  <path class="line" d="M475,350 V200 H125 V100" marker-end="url(#arrow)"/>
  <text class="label" x="145" y="222">sends each the user says yes to</text>

  <!-- orchestrator and turn -->
  <path class="line" d="M445,368 H220" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="330" y="314">hands each work but the plan<tspan x="330" dy="16">and the learnings as a call,</tspan><tspan x="330" dy="16">sends each answer</tspan></text>
  <path class="line" d="M220,392 H445" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="330" y="412">returns the work,<tspan x="330" dy="16">tells each step,</tspan><tspan x="330" dy="16">asks each point</tspan></text>

  <!-- orchestrator and rn's scripts -->
  <path class="line" d="M635,368 H835" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="735" y="314">keeps each move and decision,<tspan x="735" dy="16">has each call written,</tspan><tspan x="735" dy="16">asks each proposal</tspan></text>
  <path class="line" d="M835,392 H635" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="735" y="412">gives where the session stands,<tspan x="735" dy="16">each call, each proposal,</tspan><tspan x="735" dy="16">each line to tell</tspan></text>

  <!-- rn's scripts and pull request -->
  <path class="line" d="M930,350 V100" marker-end="url(#arrow)"/>
  <text class="label" x="942" y="200">opens with the steering,<tspan x="942" dy="16">marks ready</tspan></text>

  <!-- the record -->
  <path class="line" d="M125,410 V640" marker-end="url(#arrow)"/>
  <text class="label" x="137" y="496">reads the CCS, the checklists<tspan x="137" dy="16">and what the receiver has;</tspan><tspan x="137" dy="16">writes the work and the result</tspan></text>
  <path class="line" d="M540,410 V640" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="528" y="548">writes the plan and the learnings in;<tspan x="528" dy="16">reads the steering, each result</tspan><tspan x="528" dy="16">turn returns and the history in</tspan></text>
  <path class="line" d="M860,410 L680,640" marker-end="url(#arrow)"/>
  <text class="label" x="790" y="530">rewrites the steering,<tspan x="790" dy="16">writes each call,</tspan><tspan x="790" dy="16">cuts and puts back each part,</tspan><tspan x="790" dy="16">commits and pushes;</tspan><tspan x="790" dy="16">reads the steering and the calls</tspan></text>

  <!-- rn's scripts and conversation records -->
  <path class="line" d="M990,410 V640" marker-end="url(#arrow)"/>
  <text class="label" x="1002" y="512">reads each command<tspan x="1002" dy="16">the user typed, and</tspan><tspan x="1002" dy="16">the orchestrator's</tspan><tspan x="1002" dy="16">conversations, from</tspan></text>
</svg>
