<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A plugin's test levels</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- unit -->
  <rect class="frame" x="20" y="20" width="290" height="370" rx="10"/>
  <text class="frame-name" x="34" y="42">unit</text>
  <text class="label small" x="34" y="60">against one part's contract</text>
  <rect class="box" x="45" y="80" width="240" height="56" rx="5"/>
  <text class="name" x="165" y="104">the person</text>
  <text class="kind" x="165" y="123">&lt;set answers, or an AI given an intent&gt;</text>
  <rect class="box" x="45" y="190" width="240" height="56" rx="0"/>
  <text class="name" x="165" y="214">the part</text>
  <text class="kind" x="165" y="233">&lt;code, or a role on the users' model&gt;</text>
  <rect class="ext" x="45" y="300" width="110" height="56" rx="0"/>
  <text class="name" x="100" y="324">neighbour</text>
  <text class="kind" x="100" y="343">&lt;double&gt;</text>
  <rect class="ext" x="175" y="300" width="110" height="56" rx="0"/>
  <text class="name" x="230" y="324">neighbour</text>
  <text class="kind" x="230" y="343">&lt;double&gt;</text>
  <path class="line" d="M165,136 V190" marker-end="url(#arrow)"/>
  <path class="line" d="M130,246 L105,300" marker-end="url(#arrow)"/>
  <path class="line" d="M200,246 L225,300" marker-end="url(#arrow)"/>

  <!-- architecture -->
  <rect class="frame" x="335" y="20" width="290" height="370" rx="10"/>
  <text class="frame-name" x="349" y="42">architecture</text>
  <text class="label small" x="349" y="60">against the plugin's architecture</text>
  <rect class="box" x="360" y="80" width="240" height="56" rx="5"/>
  <text class="name" x="480" y="104">the person</text>
  <text class="kind" x="480" y="123">&lt;set answers&gt;</text>
  <rect class="box" x="360" y="190" width="240" height="56" rx="0"/>
  <text class="name" x="480" y="214">what joins the parts</text>
  <text class="kind" x="480" y="233">&lt;entries, hooks, scripts, as installed&gt;</text>
  <rect class="ext" x="360" y="300" width="110" height="56" rx="28"/>
  <text class="name" x="415" y="324">each role</text>
  <text class="kind" x="415" y="343">&lt;double&gt;</text>
  <rect class="ext" x="490" y="300" width="110" height="56" rx="0"/>
  <text class="name" x="545" y="324">Claude Code</text>
  <text class="kind" x="545" y="343">&lt;double&gt;</text>
  <path class="line" d="M480,136 V190" marker-end="url(#arrow)"/>
  <path class="line" d="M445,246 L420,300" marker-end="url(#arrow)"/>
  <path class="line" d="M515,246 L540,300" marker-end="url(#arrow)"/>

  <!-- ux -->
  <rect class="frame" x="650" y="20" width="290" height="370" rx="10"/>
  <text class="frame-name" x="664" y="42">ux</text>
  <text class="label small" x="664" y="60">against the plugin's UX</text>
  <rect class="box" x="675" y="80" width="240" height="56" rx="5"/>
  <text class="name" x="795" y="104">the person</text>
  <text class="kind" x="795" y="123">&lt;an AI with an intent kept from the plugin&gt;</text>
  <rect class="box" x="675" y="190" width="240" height="56" rx="0"/>
  <text class="name" x="795" y="214">the whole plugin</text>
  <text class="kind" x="795" y="233">&lt;as installed, each role on the model&gt;</text>
  <rect class="box" x="675" y="300" width="240" height="56" rx="0"/>
  <text class="name" x="795" y="324">Claude Code</text>
  <text class="kind" x="795" y="343">&lt;its own configuration folder&gt;</text>
  <path class="line" d="M795,136 V190" marker-end="url(#arrow)"/>
  <path class="line" d="M795,246 V300" marker-end="url(#arrow)"/>

  <!-- a fault found higher goes back to the lowest level that must catch it -->
  <path class="line" d="M795,390 V440 H165 V390" marker-end="url(#arrow)"/>
  <path class="line" d="M480,440 V390" marker-end="url(#arrow)"/>
  <text class="label mid" x="480" y="466">a fault found higher gets a test first at the lowest level whose check it breaks</text>

  <!-- legend -->
  <rect class="box" x="20" y="500" width="40" height="22" rx="0"/>
  <text class="label" x="68" y="516">runs real</text>
  <rect class="ext" x="170" y="500" width="40" height="22" rx="0"/>
  <text class="label" x="218" y="516">double</text>
</svg>
