<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A plugin's components</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .drift { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the plugin's roles -->
  <rect class="frame" x="240" y="170" width="700" height="472" rx="10"/>
  <text class="frame-name" x="254" y="190">plugin</text>

  <!-- roles: a pill is an AI, a square is code, a rounded box a person or an AI -->
  <rect class="box" x="380" y="20" width="200" height="76" rx="8"/>
  <text class="name" x="480" y="46">caller</text>
  <text class="kind" x="480" y="66">a person or an AI; decides</text>
  <text class="kind" x="480" y="82">what is theirs, approves it</text>

  <rect class="box" x="20" y="190" width="200" height="76" rx="30"/>
  <text class="name" x="120" y="216">main conversation</text>
  <text class="kind" x="120" y="236">the only one that can</text>
  <text class="kind" x="120" y="252">ask the person</text>

  <rect class="box" x="380" y="190" width="200" height="76" rx="30"/>
  <text class="name" x="480" y="216">orchestrator</text>
  <text class="kind" x="480" y="236">holds the whole run,</text>
  <text class="kind" x="480" y="252">decides each move</text>

  <rect class="box" x="700" y="190" width="220" height="76" rx="0"/>
  <text class="name" x="810" y="216">course script</text>
  <text class="kind" x="810" y="236">keeps the course and the state,</text>
  <text class="kind" x="810" y="252">gives the next move</text>

  <rect class="box" x="260" y="390" width="220" height="76" rx="30"/>
  <text class="name" x="370" y="416">maker</text>
  <text class="kind" x="370" y="436">makes the work, gives each</text>
  <text class="kind" x="370" y="452">item the lines of its Good</text>

  <rect class="box" x="600" y="390" width="220" height="76" rx="30"/>
  <text class="name" x="710" y="416">reader</text>
  <text class="kind" x="710" y="436">uses the work as its receiver</text>
  <text class="kind" x="710" y="452">would, item by item</text>

  <rect class="box" x="430" y="550" width="220" height="70" rx="0"/>
  <text class="name" x="540" y="576">guard</text>
  <text class="kind" x="540" y="596">tells a role its step again</text>

  <!-- caller and orchestrator -->
  <path class="line" d="M465,96 V190" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="455" y="128">request, answer,</text>
  <text class="label" text-anchor="end" x="455" y="145">approval</text>
  <path class="line" d="M495,190 V96" marker-end="url(#arrow)"/>
  <text class="label" x="505" y="128">question, work</text>

  <!-- main conversation and caller -->
  <path class="line" d="M120,190 L380,50" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="230" y="110">question</text>
  <path class="line" d="M380,80 L170,190" marker-end="url(#arrow)"/>
  <text class="label" x="290" y="150">answer</text>

  <!-- orchestrator and course script -->
  <path class="line" d="M580,214 H700" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="640" y="206">state</text>
  <path class="line" d="M700,246 H580" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="640" y="264">next move</text>

  <!-- orchestrator and the roles it starts -->
  <path class="line" d="M420,266 L360,390" marker-end="url(#arrow)"/>
  <path class="line" d="M400,390 L450,266" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="380" y="320">prompt,</text>
  <text class="label" text-anchor="end" x="380" y="337">reply</text>
  <path class="line" d="M540,266 L640,390" marker-end="url(#arrow)"/>
  <path class="line" d="M610,390 L510,266" marker-end="url(#arrow)"/>
  <text class="label" x="610" y="320">prompt,</text>
  <text class="label" x="610" y="337">reply</text>

  <!-- maker and main conversation -->
  <path class="line" d="M290,390 L160,266" marker-end="url(#arrow)"/>
  <path class="line" d="M120,266 L260,410" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="180" y="350">question,</text>
  <text class="label" text-anchor="end" x="180" y="367">answer</text>

  <!-- maker and reader -->
  <path class="line" d="M480,414 H600" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="540" y="406">work</text>
  <path class="line" d="M600,446 H480" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="540" y="464">need</text>

  <!-- guard and the roles -->
  <path class="line drift" d="M480,550 L410,466" marker-end="url(#arrow)"/>
  <path class="line drift" d="M600,550 L670,466" marker-end="url(#arrow)"/>
  <text class="label" x="400" y="520">step</text>
  <text class="label" x="650" y="520">step</text>

  <!-- legend -->
  <rect class="box" x="20" y="520" width="40" height="22" rx="11"/>
  <text class="label" x="68" y="536">AI</text>
  <rect class="box" x="20" y="554" width="40" height="22" rx="0"/>
  <text class="label" x="68" y="570">code</text>
  <rect class="box" x="20" y="588" width="40" height="22" rx="5"/>
  <text class="label" x="68" y="604">person or AI</text>
</svg>
