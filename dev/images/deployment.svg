<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>A plugin's deployment</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the user's computer -->
  <rect class="frame" x="20" y="20" width="900" height="320" rx="10"/>
  <text class="frame-name" x="34" y="40">the user's computer</text>

  <rect class="box" x="40" y="54" width="560" height="110" rx="12"/>
  <text class="name" x="320" y="80">Claude Code</text>
  <text class="kind" x="320" y="102">main conversation: the orchestrator, where a person calls</text>
  <text class="kind" x="320" y="122">subagents: maker, reader, and the orchestrator where an AI calls</text>

  <rect class="box" x="640" y="54" width="260" height="110" rx="12"/>
  <text class="name" x="770" y="80">python3 3.9 or later</text>
  <text class="kind" x="770" y="102">guard, run by Claude Code's hooks;</text>
  <text class="kind" x="770" y="122">course script, run by the</text>
  <text class="kind" x="770" y="138">orchestrator</text>
  <path class="line" d="M600,109 H640" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="200" width="260" height="120" rx="0"/>
  <text class="name" x="170" y="228">the plugin's installed folder</text>
  <text class="kind" x="170" y="250">prompt, step, checklist</text>

  <rect class="box" x="340" y="200" width="260" height="120" rx="0"/>
  <text class="name" x="470" y="228">the repository</text>
  <text class="kind" x="470" y="250">work, request;</text>
  <text class="kind" x="470" y="268">in .&lt;plugin&gt;/&lt;yyyymmdd&gt;-&lt;name&gt;/,</text>
  <text class="kind" x="470" y="284">what may be kept: the state, with each</text>
  <text class="kind" x="470" y="300">answer and approval, Good lines, need</text>

  <rect class="box" x="640" y="200" width="260" height="120" rx="0"/>
  <text class="name" x="770" y="228">the temporary folder</text>
  <text class="kind" x="770" y="250">in &lt;plugin&gt;/&lt;yyyymmdd&gt;-&lt;name&gt;/,</text>
  <text class="kind" x="770" y="266">what is used only while</text>
  <text class="kind" x="770" y="282">the plugin runs</text>

  <!-- outside the product -->
  <rect class="box" x="40" y="420" width="260" height="60" rx="8"/>
  <text class="name" x="170" y="446">GitHub: the marketplace</text>
  <text class="kind" x="170" y="466">lovaizu/ccpm</text>
  <path class="line" d="M170,420 V320" marker-end="url(#arrow)"/>
  <text class="label" x="180" y="376">the plugin installed</text>

  <rect class="box" x="340" y="420" width="260" height="60" rx="8"/>
  <text class="name" x="470" y="446">GitHub: the user's</text>
  <text class="name" x="470" y="464">repository</text>
  <path class="line" d="M470,320 V420" marker-end="url(#arrow)"/>
  <text class="label" x="480" y="368">pushes, pull requests;</text>
  <text class="label" x="480" y="384">branch protection</text>

  <rect class="box" x="640" y="420" width="260" height="60" rx="8"/>
  <text class="name" x="770" y="446">GitHub: the plugin's</text>
  <text class="name" x="770" y="464">repository</text>
  <path class="line" d="M580,320 L700,420" marker-end="url(#arrow)"/>
  <text class="label" x="700" y="360">lesson, as an issue,</text>
  <text class="label" x="700" y="376">on the user's yes</text>

  <!-- legend -->
  <rect class="box" x="40" y="494" width="34" height="18" rx="6"/>
  <text class="label" x="80" y="508">runtime, holding roles</text>
  <rect class="box" x="240" y="494" width="34" height="18" rx="0"/>
  <text class="label" x="280" y="508">folder, holding data</text>
  <rect class="box" x="430" y="494" width="34" height="18" rx="3"/>
  <text class="label" x="470" y="508">outside the plugin</text>
</svg>
