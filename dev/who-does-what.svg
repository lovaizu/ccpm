<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Who does what</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .drift { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>


  <!-- the plugin's parts -->
  <rect class="frame" x="160" y="160" width="640" height="240" rx="10"/>
  <text class="frame-name" x="172" y="179">plugin</text>

  <!-- components -->
  <rect class="box" x="265" y="30" width="190" height="56" rx="8"/>
  <text class="name" x="360" y="54">caller</text>
  <text class="kind" x="360" y="72">person or AI</text>
  <rect class="box" x="265" y="180" width="190" height="56" rx="8"/>
  <text class="name" x="360" y="204">orchestrator</text>
  <text class="kind" x="360" y="222">main conversation or subagent</text>
  <rect class="box" x="265" y="320" width="190" height="56" rx="8"/>
  <text class="name" x="360" y="344">role</text>
  <text class="kind" x="360" y="362">subagent</text>
  <rect class="box" x="590" y="320" width="190" height="56" rx="8"/>
  <text class="name" x="685" y="344">guard</text>
  <text class="kind" x="685" y="362">hook</text>

  <!-- caller and orchestrator -->
  <path class="line" d="M348,86 V180" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="338" y="125">calls, answers,<tspan x="338" dy="17">approves</tspan></text>
  <path class="line" d="M372,180 V86" marker-end="url(#arrow)"/>
  <text class="label" x="382" y="125">asks, shows the work</text>

  <!-- orchestrator and role -->
  <path class="line" d="M348,236 V320" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="end" x="338" y="270">starts it with its prompt,<tspan x="338" dy="17">sends more work</tspan></text>
  <path class="line" d="M372,320 V236" marker-end="url(#arrow)"/>
  <text class="label" x="382" y="270">replies</text>

  <!-- guard and role -->
  <path class="line drift" d="M590,356 H455" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="522" y="315">notices a drift,<tspan x="522" dy="17">tells the step again</tspan></text>
</svg>
