  <path class="line" d="M1000,660 L1350,660 L1350,580" marker-end="url(#arrow)"/>
  <text class="label small" x="1044" y="476" text-anchor="end">writes,</text>
  <text class="label small" x="1044" y="490" text-anchor="end">reads</text>
