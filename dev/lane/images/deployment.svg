  <path class="line" d="M1460,240 L1472,240 L1472,500 L1460,500" marker-end="url(#arrow)"/>
  <text class="label small" x="1466" y="430" text-anchor="end">reads</text>
  <path class="line" d="M1080,290 L1050,290 L1050,500 L980,500" marker-end="url(#arrow)"/>
  <path class="line" d="M990,234 L990,600" marker-end="url(#arrow)"/>
