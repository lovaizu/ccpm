<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500">
  <title>Lane&#x27;s deployment</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="500"/>
  <rect class="frame" x="20" y="20" width="640" height="460" rx="10"/>
  <text class="frame-name" x="36" y="42">the user&#x27;s computer [macOS or Linux, Python 3.9 or later]</text>
  <rect class="unit" x="40" y="60" width="600" height="150" rx="8"/>
  <text class="frame-name" x="56" y="82">Claude Code [2.1.322 or later]</text>
  <rect class="box" x="60" y="100" width="260" height="80" rx="6"/>
  <text class="name" x="190" y="136">proposer</text>
  <text class="kind" x="190" y="156">[the main conversation, at /lane:up]</text>
  <rect class="box" x="350" y="100" width="270" height="80" rx="6"/>
  <text class="name" x="485" y="136">the plugin&#x27;s roles</text>
  <text class="kind" x="485" y="156">[main conversation, subagents]</text>
  <rect class="box" x="40" y="250" width="260" height="90" rx="6"/>
  <text class="name" x="170" y="291">Lane</text>
  <text class="kind" x="170" y="311">[plugin: proposer, layer, rule types]</text>
  <rect class="store" x="340" y="250" width="300" height="90" rx="6"/>
  <text class="name" x="490" y="286">the user&#x27;s plugin</text>
  <text class="kind" x="490" y="306">[Steps, Rules, Routes, Lane&#x27;s code laid]</text>
  <rect class="store" x="340" y="370" width="300" height="90" rx="6"/>
  <text class="name" x="490" y="406">the system&#x27;s temporary folder</text>
  <text class="kind" x="490" y="426">[Proposal, run record]</text>
  <rect class="ext" x="720" y="60" width="220" height="80" rx="6"/>
  <text class="name" x="830" y="96">ccpm marketplace</text>
  <text class="kind" x="830" y="116">[on GitHub]</text>
  <rect class="ext" x="720" y="250" width="220" height="90" rx="6"/>
  <text class="name" x="830" y="286">another computer</text>
  <text class="kind" x="830" y="306">[runs the plugin, with no Lane]</text>
  <path class="line" d="M720,100 L680,100 L680,230 L120,230 L120,250" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="430" y="224">installs</text>
  <path class="line" d="M240,250 L240,180" marker-end="url(#arrow)"/>
  <text class="data halo end" x="232" y="215">loads</text>
  <path class="line" d="M300,300 L340,300" marker-end="url(#arrow)"/>
  <path class="line" d="M520,250 L520,180" marker-end="url(#arrow)"/>
  <text class="data halo start" x="528" y="215">runs the guard</text>
  <path class="line" d="M640,295 L720,295" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="680" y="287">ships</text>
  <path class="line" d="M270,340 L270,415 L340,415" marker-end="url(#arrow)"/>
  <text class="data halo end" x="262" y="390">keeps the Proposal</text>
  <path class="line" d="M600,340 L600,370" marker-end="url(#arrow)"/>
  <text class="data halo start" x="608" y="360">keeps the run record</text>
  <text class="data halo mid" x="320" y="290">lays</text>
</svg>
