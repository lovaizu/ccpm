<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Lane&#x27;s deployment</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1560" height="880"/>
  <rect class="ext" x="620" y="20" width="280" height="64" rx="4"/>
  <text class="name" x="760.0" y="48" text-anchor="middle">marketplace</text>
  <text class="kind" x="760.0" y="66" text-anchor="middle">[git repository on GitHub]</text>
  <rect class="frame" x="20" y="130" width="720" height="640" rx="8"/>
  <text class="frame-name" x="32" y="154" text-anchor="start">the user&#x27;s computer</text>
  <text class="kind start" x="200" y="154" text-anchor="start">[Claude Code 2.1.319 or later · python3 3.9 or later]</text>
  <rect class="frame" x="800" y="130" width="740" height="640" rx="8"/>
  <text class="frame-name" x="812" y="154" text-anchor="start">the computer where the plugin runs</text>
  <text class="kind start" x="1078" y="154" text-anchor="start">[Claude Code 2.1.319 or later · python3 3.9 or later]</text>
  <rect class="ext" x="40" y="180" width="220" height="64" rx="4"/>
  <text class="name" x="150.0" y="208" text-anchor="middle">Claude Code</text>
  <text class="kind" x="150.0" y="226" text-anchor="middle">[CLI]</text>
  <rect class="unit" x="340" y="180" width="380" height="120" rx="6"/>
  <text class="name start" x="354" y="206" text-anchor="start">lay.py process</text>
  <text class="kind start" x="354" y="224" text-anchor="start">[python3 3.9 or later]</text>
  <text class="label start" x="354" y="248" text-anchor="start">lay.py, proposal.py, lanes/, routes.py, ports.py</text>
  <rect class="unit" x="340" y="350" width="380" height="100" rx="6"/>
  <text class="name start" x="354" y="376" text-anchor="start">adapter process</text>
  <text class="kind start" x="354" y="394" text-anchor="start">[python3]</text>
  <text class="label start" x="354" y="418" text-anchor="start">Adapter, on each test case</text>
  <rect class="unit" x="40" y="500" width="300" height="120" rx="6"/>
  <text class="name start" x="54" y="526" text-anchor="start">.lane/&lt;yyyymmdd&gt;-&lt;plugin&gt;/</text>
  <text class="kind start" x="54" y="544" text-anchor="start">[folder at the repository&#x27;s root]</text>
  <text class="data start" x="54" y="568" text-anchor="start">Proposal, Adapter, Test cases</text>
  <rect class="unit" x="380" y="500" width="340" height="160" rx="6"/>
  <text class="name start" x="394" y="526" text-anchor="start">the plugin&#x27;s folder</text>
  <text class="kind start" x="394" y="544" text-anchor="start">[Claude Code plugin]</text>
  <text class="label start" x="394" y="568" text-anchor="start">Lane&#x27;s code, as a link or a copy</text>
  <text class="data start" x="394" y="586" text-anchor="start">Steps&#x27; file, Step, Hook entry,</text>
  <text class="data start" x="394" y="604" text-anchor="start">Rules laid, Adapter, Test cases</text>
  <rect class="ext" x="820" y="180" width="220" height="64" rx="4"/>
  <text class="name" x="930.0" y="208" text-anchor="middle">Claude Code</text>
  <text class="kind" x="930.0" y="226" text-anchor="middle">[CLI]</text>
  <rect class="unit" x="1160" y="180" width="360" height="150" rx="6"/>
  <text class="name start" x="1174" y="206" text-anchor="start">hook process</text>
  <text class="kind start" x="1174" y="224" text-anchor="start">[python3 3.9 or later · one for each event]</text>
  <text class="label start" x="1174" y="248" text-anchor="start">hook.py, guard.py, lanes/,</text>
  <text class="label start" x="1174" y="266" text-anchor="start">called.py, routes.py, ports.py</text>
  <rect class="unit" x="1160" y="370" width="360" height="90" rx="6"/>
  <text class="name start" x="1174" y="396" text-anchor="start">adapter process</text>
  <text class="kind start" x="1174" y="414" text-anchor="start">[python3]</text>
  <text class="label start" x="1174" y="438" text-anchor="start">Adapter</text>
  <rect class="unit" x="820" y="370" width="220" height="90" rx="6"/>
  <text class="name start" x="834" y="396" text-anchor="start">result process</text>
  <text class="kind start" x="834" y="414" text-anchor="start">[python3 3.9 or later]</text>
  <text class="label start" x="834" y="438" text-anchor="start">result.py, routes.py</text>
  <rect class="unit" x="820" y="540" width="220" height="110" rx="6"/>
  <text class="name start" x="834" y="566" text-anchor="start">temporary folder</text>
  <text class="kind start" x="834" y="584" text-anchor="start">[the system&#x27;s]</text>
  <text class="data start" x="834" y="608" text-anchor="start">Run, Start, Kept call,</text>
  <text class="data start" x="834" y="626" text-anchor="start">Start value, Result</text>
  <rect class="unit" x="1160" y="500" width="360" height="160" rx="6"/>
  <text class="name start" x="1174" y="526" text-anchor="start">the installed plugin</text>
  <text class="kind start" x="1174" y="544" text-anchor="start">[Claude Code plugin folder]</text>
  <text class="label start" x="1174" y="568" text-anchor="start">Lane&#x27;s code</text>
  <text class="data start" x="1174" y="586" text-anchor="start">Steps&#x27; file, Step, Hook entry,</text>
  <text class="data start" x="1174" y="604" text-anchor="start">Rules laid, Adapter, Test cases</text>
  <path class="line" d="M640,84 L640,110 L180,110 L180,180" marker-end="url(#arrow)"/>
  <text class="label small halo" x="188" y="104" text-anchor="start">installs Lane [claude plugin install]</text>
  <path class="line" d="M260,200 L340,200" marker-end="url(#arrow)"/>
  <text class="label small halo" x="300" y="194" text-anchor="middle">runs [Bash]</text>
  <path class="line" d="M340,232 L260,232" marker-end="url(#arrow)"/>
  <text class="label small halo" x="44" y="262" text-anchor="start">validates the plugin</text>
  <text class="label small halo" x="44" y="276" text-anchor="start">[claude plugin validate]</text>
  <path class="line" d="M530,300 L530,350" marker-end="url(#arrow)"/>
  <text class="label small halo" x="538" y="330" text-anchor="start">runs [JSON, stdio]</text>
  <path class="line" d="M340,290 L300,290 L300,500" marker-end="url(#arrow)"/>
  <text class="label small halo" x="292" y="400" text-anchor="end">reads,</text>
  <text class="label small halo" x="292" y="414" text-anchor="end">removes</text>
  <path class="line" d="M720,240 L732,240 L732,560 L720,560" marker-end="url(#arrow)"/>
  <text class="label small halo" x="726" y="470" text-anchor="end">writes</text>
  <path class="line" d="M1040,200 L1160,200" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1100" y="192" text-anchor="middle">starts it on each</text>
  <text class="label small halo" x="1100" y="222" text-anchor="middle">event [sh, JSON</text>
  <text class="label small halo" x="1100" y="236" text-anchor="middle">on stdin]</text>
  <path class="line" d="M1340,330 L1340,370" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1348" y="354" text-anchor="start">runs [JSON, stdio]</text>
  <path class="line" d="M1520,250 L1532,250 L1532,560 L1520,560" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1526" y="480" text-anchor="end">reads</text>
  <path class="line" d="M1180,330 L1180,350 L1100,350 L1100,600 L1040,600" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1092" y="520" text-anchor="end">keeps,</text>
  <text class="label small halo" x="1092" y="534" text-anchor="end">reads</text>
  <path class="line" d="M930,244 L930,370" marker-end="url(#arrow)"/>
  <text class="label small halo" x="938" y="310" text-anchor="start">runs it [Bash]</text>
  <path class="line" d="M1040,440 L1130,440 L1130,580 L1160,580" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1138" y="480" text-anchor="start">reads</text>
  <path class="line" d="M550,660 L550,800 L1340,800 L1340,660" marker-end="url(#arrow)"/>
  <text class="label small halo" x="945" y="792" text-anchor="middle">the plugin installed, with Lane&#x27;s code [its marketplace]</text>
  <text class="frame-name" x="20" y="850" text-anchor="start">Legend</text>
  <rect class="frame" x="90" y="835" width="36" height="22" rx="4"/>
  <text class="label small" x="134" y="850" text-anchor="start">environment [technology]</text>
  <rect class="unit" x="320" y="835" width="36" height="22" rx="4"/>
  <text class="label small" x="364" y="850" text-anchor="start">deployment unit [technology]: the components that run in it</text>
  <text class="data" x="760" y="850" text-anchor="start">data kept</text>
  <rect class="ext" x="840" y="835" width="36" height="22" rx="4"/>
  <text class="label small" x="884" y="850" text-anchor="start">outside Lane; an arrow says what is used [protocol or tool]</text>
</svg>
