  <text class="label small start" x="20" y="808">The proposal and the run record lie in the system&#x27;s temporary folder.</text>
  <text class="label small start" x="20" y="826">An arrow reads from one data, by its name, to the other: a Lane on a Step.</text>
  <text class="label small start" x="20" y="844">A filled diamond marks the whole that holds the other&#x27;s parts. The number at each end says how many of that data the relation joins to one of the other.</text>
