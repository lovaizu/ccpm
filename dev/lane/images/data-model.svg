<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <title>Lane’s data</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="640" height="300"/>
  <rect class="box lane" x="40" y="40" width="200" height="64" rx="8"/>
  <text class="name" x="140.0" y="70.0">Rules</text>
  <text class="kind" x="140.0" y="88.0">what a plugin gives Lane</text>
  <rect class="box lane" x="380" y="40" width="200" height="64" rx="8"/>
  <text class="name" x="480.0" y="70.0">Route</text>
  <text class="kind" x="480.0" y="88.0">a fixed order</text>
  <rect class="box lane" x="40" y="200" width="200" height="64" rx="8"/>
  <text class="name" x="140.0" y="230.0">Run</text>
  <text class="kind" x="140.0" y="248.0">one run of a skill</text>
  <rect class="box lane" x="380" y="200" width="200" height="64" rx="8"/>
  <text class="name" x="480.0" y="230.0">Starts due</text>
  <text class="kind" x="480.0" y="248.0">what the order gives</text>
  <path class="line" marker-end="url(#arrow)" d="M240,72 L378,72"/>
  <text class="label small" x="270" y="64">may hold</text>
  <text class="label small" x="246" y="90">1</text>
  <text class="label small end" x="372" y="90">0..*</text>
  <path class="line" marker-end="url(#arrow)" d="M140,104 L140,198"/>
  <text class="label small" x="148" y="155">hold the run to</text>
  <path class="line" marker-end="url(#arrow)" d="M480,104 L480,198"/>
  <text class="label small" x="488" y="155">give</text>
  <path class="line" marker-end="url(#arrow)" d="M378,232 L242,232"/>
  <text class="label small" x="262" y="224">hold its starts to</text>
</svg>
