  <polyline class="line" points="349,564 320,625 1040,625 1040,564" marker-start="url(#diamond)"/>
  <polyline class="line" points="771,516 489,344" marker-end="url(#arrow)"/>
  <polyline class="line" points="690,76 690,18 1170,18 1170,540 1125,540" marker-end="url(#arrow)"/>
  <rect class="box" x="45.0" y="76.0" width="170" height="48" rx="4"/>
  <text class="name" x="130" y="105">Role</text>
  <rect class="box" x="325.0" y="76.0" width="170" height="48" rx="4"/>
  <text class="name" x="410" y="105">Step</text>
  <rect class="box" x="605.0" y="76.0" width="170" height="48" rx="4"/>
  <text class="name" x="690" y="105">Kept results</text>
  <rect class="box" x="925.0" y="76.0" width="170" height="48" rx="4"/>
  <text class="name" x="1010" y="105">Lane type</text>
