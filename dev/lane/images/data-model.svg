  <rect class="box" x="955.0" y="516.0" width="170" height="48" rx="4"/>
  <text class="name" x="1040" y="545">Result</text>
  <text class="label small halo mid" x="270" y="68">holds 1..*</text>
  <text class="label small halo end" x="285" y="190">made from the text of</text>
  <text class="label small halo start" x="445" y="180">holds</text>
  <text class="label small halo start" x="925" y="166">of</text>
  <text class="label small halo start" x="870" y="245">adds a sentence to</text>
  <text class="label small halo mid" x="500" y="226">starts 0..1</text>
  <text class="label small halo mid" x="300" y="300">proposes 0..*</text>
  <text class="label small halo mid" x="440" y="416">proposes 1..*</text>
  <text class="label small halo mid" x="920" y="424">goes on from</text>
