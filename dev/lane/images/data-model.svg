  <polyline class="line" points="178,296 382,124" marker-end="url(#arrow)"/>
  <polyline class="line" points="446,296 414,124" marker-end="url(#arrow)"/>
  <polyline class="line" points="511,296 949,124" marker-end="url(#arrow)"/>
  <polyline class="line" points="945,296 475,124" marker-end="url(#arrow)"/>
  <polyline class="line" points="730,296 730,230 130,230 130,124" marker-end="url(#arrow)"/>
  <polyline class="line" points="235,320 365,320" marker-start="url(#diamond)"/>
  <polyline class="line" points="183,344 260,400 700,400 721,344" marker-start="url(#diamond)"/>
  <polyline class="line" points="745,344 800,430 1040,430 1040,516" marker-end="url(#arrow)"/>
  <polyline class="line" points="132,516 148,344" marker-end="url(#arrow)"/>
  <polyline class="line" points="445,540 505,540" marker-start="url(#diamond)"/>
