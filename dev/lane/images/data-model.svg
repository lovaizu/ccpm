  <text class="label small halo start" x="596" y="320">0..*</text>
  <path class="line" d="M640,240 L640,120"/>
  <text class="label halo start" x="650" y="185">marks</text>
  <text class="label small halo start" x="650" y="232">0..*</text>
  <text class="label small halo start" x="650" y="138">0..1</text>
  <path class="line" d="M720,260 L840,120"/>
  <text class="label halo start" x="790" y="200">marks</text>
