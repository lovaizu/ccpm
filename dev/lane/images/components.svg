<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450">
  <title>Lane’s components</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="820" height="450"/>
  <rect class="frame" x="20" y="20" width="440" height="410" rx="10"/>
  <text class="frame-name" x="36" y="42">Lane</text>
  <rect class="box lane" x="60" y="70" width="180" height="64" rx="8"/>
  <text class="name" x="150.0" y="100.0">guard</text>
  <text class="kind" x="150.0" y="118.0">hook</text>
  <rect class="box lane" x="60" y="220" width="180" height="64" rx="8"/>
  <text class="name" x="150.0" y="250.0">rule types</text>
  <text class="kind" x="150.0" y="268.0">module</text>
  <rect class="box lane" x="280" y="220" width="160" height="64" rx="8"/>
  <text class="name" x="360.0" y="250.0">reporters</text>
  <text class="kind" x="360.0" y="268.0">command</text>
  <rect class="frame" x="500" y="20" width="300" height="410" rx="10"/>
  <text class="frame-name" x="516" y="42">a plugin</text>
  <rect class="ext" x="540" y="70" width="220" height="64" rx="8"/>
  <text class="name" x="650.0" y="100.0">AI</text>
  <text class="kind" x="650.0" y="118.0">main conversation, subagents</text>
  <rect class="ext" x="540" y="220" width="220" height="64" rx="8"/>
  <text class="name" x="650.0" y="250.0">rules and adapters</text>
  <text class="kind" x="650.0" y="268.0">its own folder</text>
  <path class="line" marker-end="url(#arrow)" d="M538,102 L242,102"/>
  <text class="label small" x="380" y="94">each move</text>
  <path class="line" marker-end="url(#arrow)" d="M150,134 L150,218"/>
  <text class="label small" x="158" y="180">checks by</text>
  <path class="line" marker-end="url(#arrow)" d="M242,90 L538,90"/>
  <text class="label small" x="300" y="82">stop, with the step’s sentence</text>
  <path class="line" marker-end="url(#arrow)" d="M600,134 L400,218"/>
  <text class="label small" x="470" y="175">reports done</text>
  <path class="line" marker-end="url(#arrow)" d="M300,220 L230,136"/>
  <text class="label small" x="268" y="190">as facts</text>
  <path class="line" marker-end="url(#arrow)" d="M240,120 L538,250"/>
  <text class="label small" x="380" y="200">reads, asks</text>
  <rect class="box lane" x="60" y="340" width="180" height="64" rx="8"/>
  <text class="name" x="150.0" y="370.0">route adapter</text>
  <text class="kind" x="150.0" y="388.0">adapter</text>
  <path class="line" marker-end="url(#arrow)" d="M60,120 L40,120 L40,372 L58,372"/>
  <text class="label small" x="46" y="330">asks</text>
  <path class="line" marker-end="url(#arrow)" d="M242,372 L538,272"/>
  <text class="label small" x="330" y="360">reads the routes</text>
</svg>
