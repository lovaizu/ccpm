  <rect class="box" x="30.0" y="330.0" width="180" height="60" rx="30.0"/>
  <text class="name" x="120" y="355">user</text>
  <text class="kind" x="120" y="374">role: a person or an AI</text>
  <rect class="lane" x="315.0" y="90.0" width="210" height="60" rx="4"/>
  <text class="name" x="420" y="115">up</text>
  <text class="kind" x="420" y="134">skill: Markdown, run by Claude</text>
  <rect class="lane" x="625.0" y="90.0" width="190" height="60" rx="4"/>
  <text class="name" x="720" y="115">lay.py</text>
  <text class="kind" x="720" y="134">script: Python 3.9</text>
  <rect class="store" x="665.0" y="-60.0" width="210" height="60" rx="4"/>
  <text class="name" x="770" y="-35">proposal</text>
  <text class="kind" x="770" y="-16">store: JSON, temporary folder</text>
  <rect class="lane" x="905.0" y="94.0" width="190" height="60" rx="4"/>
  <text class="name" x="1000" y="119">lane types</text>
  <text class="kind" x="1000" y="138">modules: Python 3.9</text>
  <rect class="lane" x="1145.0" y="94.0" width="190" height="60" rx="4"/>
  <text class="name" x="1240" y="119">guard</text>
  <text class="kind" x="1240" y="138">hook script: Python 3.9</text>
  <rect class="store" x="315.0" y="330.0" width="210" height="60" rx="4"/>
  <text class="name" x="420" y="355">steps</text>
  <text class="kind" x="420" y="374">store: SKILL.md, agents/*.md</text>
  <rect class="store" x="915.0" y="330.0" width="210" height="60" rx="4"/>
  <text class="name" x="1020" y="355">laid set</text>
  <text class="kind" x="1020" y="374">store: lanes.json, hooks.json</text>
  <rect class="ext" x="1225.0" y="330.0" width="190" height="60" rx="4"/>
  <text class="name" x="1320" y="355">adapter</text>
  <text class="kind" x="1320" y="374">script: the user&#x27;s own</text>
  <rect class="store" x="1500.0" y="330.0" width="200" height="60" rx="4"/>
  <text class="name" x="1600" y="355">kept results</text>
  <text class="kind" x="1600" y="374">store: the plugin&#x27;s records</text>
  <rect class="lane" x="625.0" y="510.0" width="190" height="60" rx="4"/>
  <text class="name" x="720" y="535">lane types</text>
  <text class="kind" x="720" y="554">modules: Python 3.9</text>
  <rect class="lane" x="925.0" y="510.0" width="190" height="60" rx="4"/>
  <text class="name" x="1020" y="535">guard</text>
  <text class="kind" x="1020" y="554">hook script: Python 3.9</text>
  <rect class="lane" x="1225.0" y="510.0" width="190" height="60" rx="4"/>
  <text class="name" x="1320" y="535">result.py</text>
  <text class="kind" x="1320" y="554">script: Python 3.9</text>
  <rect class="ext" x="315.0" y="510.0" width="190" height="60" rx="4"/>
  <text class="name" x="410" y="535">the plugin&#x27;s command</text>
  <text class="kind" x="410" y="554">command: the user&#x27;s own</text>
  <rect class="ext" x="30.0" y="700.0" width="180" height="60" rx="4"/>
  <text class="name" x="120" y="725">Claude Code</text>
  <text class="kind" x="120" y="744">external: 2.1.322 or later</text>
  <rect class="store" x="900.0" y="700.0" width="240" height="60" rx="4"/>
  <text class="name" x="1020" y="725">run record</text>
  <text class="kind" x="1020" y="744">store: JSON Lines, temporary folder</text>
  <rect class="ext" x="1500.0" y="700.0" width="200" height="60" rx="4"/>
  <text class="name" x="1600" y="725">the plugin&#x27;s roles</text>
  <text class="kind" x="1600" y="744">main conversation, subagents</text>
  <text class="label small halo end" x="250" y="225">shows the proposal, and</text>
  <text class="label small halo end" x="250" y="240">asks for yes or a change</text>
  <text class="label small halo start" x="130" y="520">types or calls each</text>
  <text class="label small halo start" x="130" y="535">command, replies or</text>
  <text class="label small halo start" x="130" y="550">approves, and types</text>
  <text class="label small halo start" x="130" y="565">/reload-plugins</text>
  <text class="label small halo end" x="296" y="352">writes Steps</text>
  <text class="label small halo start" x="372" y="16">makes each tool call of up&#x27;s steps, and ends its turn</text>
  <text class="label small halo mid" x="860" y="844">makes each tool call, start of a subagent, and end</text>
  <text class="label small start" x="12" y="882">Each arrow reads from the one that acts to the one it acts on, and a reply goes back along it.</text>
  <text class="label small start" x="12" y="900">The guard&#x27;s answer to a hook event, such as a stop or the start due, reaches the role or the user through Claude Code.</text>
  <text class="label small start" x="12" y="918">Lane&#x27;s code lies twice: in Lane&#x27;s plugin, where its guard holds up and lay.py takes the lane types from it, and in the user&#x27;s plugin, where lay.py copies it.</text>
  <text class="label small halo mid" x="570" y="82">runs types, steps, print, write</text>
  <text class="label small halo start" x="780" y="30">keeps the Proposal</text>
  <text class="label small halo mid" x="848" y="106">takes</text>
  <text class="label small halo mid" x="848" y="120">each type</text>
  <text class="label small halo start" x="810" y="55">asks where the Run of up stands, writes lanes.json through its code</text>
  <text class="label small halo start" x="1310" y="-45">sends each hook event of up;</text>
  <text class="label small halo start" x="1310" y="-30">gets a stop, or lets it through</text>
  <text class="label small halo start" x="1165" y="240">writes lanes.json</text>
  <text class="label small halo start" x="1165" y="255">for lay.py write</text>
  <text class="label small halo start" x="860" y="184">checks each program in hooks/adapters/</text>
  <text class="label small halo end" x="1704" y="162">adds each fact of up&#x27;s Run,</text>
  <text class="label small halo end" x="1704" y="177">works out where it stands</text>
  <text class="label small halo start" x="430" y="220">writes a change</text>
  <text class="label small halo start" x="530" y="300">reads and checks each Step&#x27;s</text>
  <text class="label small halo start" x="530" y="315">file, writes each Lane&#x27;s</text>
  <text class="label small halo start" x="530" y="330">sentence or puts it back</text>
  <text class="label small halo start" x="890" y="215">reads the Laid, replaces</text>
  <text class="label small halo start" x="890" y="230">Lane&#x27;s hook entries,</text>
  <text class="label small halo start" x="890" y="245">or puts them back</text>
  <text class="label small halo start" x="40" y="268">runs claude plugin validate</text>
  <text class="label small halo mid" x="430" y="638">sends each hook event; gets a stop</text>
  <text class="label small halo mid" x="430" y="653">with the step&#x27;s sentence, or the start due</text>
  <text class="label small halo start" x="1030" y="405">reads the Lanes,</text>
  <text class="label small halo start" x="1030" y="420">Routes, adapters</text>
  <text class="label small halo mid" x="870" y="516">checks a Call</text>
  <text class="label small halo mid" x="870" y="531">or an end</text>
  <text class="label small halo start" x="1030" y="632">adds each fact it keeps,</text>
  <text class="label small halo start" x="1030" y="647">works out each Run</text>
  <text class="label small halo start" x="1150" y="472">asks for a start&#x27;s text, or the Kept results</text>
  <text class="label small halo mid" x="1460" y="350">reads them</text>
  <text class="label small halo start" x="1478" y="634">runs it to give a Result</text>
  <text class="label small halo mid" x="1192" y="607">asks where each Run stands</text>
  <text class="label small halo mid" x="860" y="814">runs the skill, and starts each subagent</text>
  <text class="label small halo mid" x="565" y="494">runs the command</text>
  <text class="label small halo mid" x="565" y="508">an ends_checked</text>
  <text class="label small halo mid" x="565" y="522">Lane names, with</text>
  <text class="label small halo mid" x="565" y="536">the run values</text>
  <text class="label small halo mid" x="565" y="550">and the Result</text>
  <text class="label small halo start" x="750" y="418">copies Lane&#x27;s code into it,</text>
  <text class="label small halo start" x="750" y="433">or puts the copy before back</text>
  <!-- Frame names a line crosses, drawn last so their halo masks the line. -->
  <text class="frame-name halo" x="319" y="60">Lane&#x27;s plugin</text>
  <text class="frame-name halo" x="894" y="84">hooks/lane/: Lane&#x27;s code</text>
  <text class="frame-name halo" x="314" y="300">the user&#x27;s plugin</text>
  <text class="frame-name halo" x="534" y="470">hooks/lane/: Lane&#x27;s code, laid into the plugin</text>
</svg>
