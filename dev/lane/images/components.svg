<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Lane&#x27;s components: the user, lay.py, the shared code of lanes/ and the routes, the guard, the result script, the adapter, Claude Code with the plugin&#x27;s main conversation and roles, and the stores of the proposal, the plugin&#x27;s files, and the run&#x27;s record</title>
  <style>
    .bg { fill: #ffffff; }
