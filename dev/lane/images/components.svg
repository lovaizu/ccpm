<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <title>Lane&#x27;s components</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="600"/>
  <rect class="box" x="20" y="40" width="160" height="70" rx="6"/>
  <text class="name" x="100" y="80">user</text>
  <rect class="box" x="240" y="40" width="180" height="70" rx="6"/>
  <text class="name" x="330" y="72">proposer</text>
  <text class="kind" x="330" y="92">[prompt]</text>
  <rect class="box" x="500" y="40" width="180" height="70" rx="6"/>
  <text class="name" x="590" y="72">layer</text>
  <text class="kind" x="590" y="92">[script]</text>
  <rect class="store" x="240" y="200" width="180" height="70" rx="6"/>
  <text class="name" x="330" y="232">the plugin&#x27;s steps</text>
  <text class="kind" x="330" y="252">[Steps, Rules, Routes]</text>
  <rect class="box" x="760" y="200" width="180" height="70" rx="6"/>
  <text class="name" x="850" y="232">rule types</text>
  <text class="kind" x="850" y="252">[module]</text>
  <rect class="ext" x="10" y="360" width="180" height="70" rx="6"/>
  <text class="name" x="100" y="392">the plugin&#x27;s roles</text>
  <text class="kind" x="100" y="412">[conversation, subagents]</text>
  <rect class="box" x="240" y="360" width="180" height="70" rx="6"/>
  <text class="name" x="330" y="392">guard</text>
  <text class="kind" x="330" y="412">[hook]</text>
  <rect class="store" x="500" y="360" width="180" height="70" rx="6"/>
  <text class="name" x="590" y="392">run record</text>
  <text class="kind" x="590" y="412">[Run, Start, Mark, Result]</text>
  <rect class="box" x="240" y="500" width="180" height="70" rx="6"/>
  <text class="name" x="330" y="532">reporters</text>
  <text class="kind" x="330" y="552">[script]</text>
  <rect class="ext" x="760" y="500" width="180" height="70" rx="6"/>
  <text class="name" x="850" y="532">adapters, checks</text>
  <text class="kind" x="850" y="552">[the plugin&#x27;s own]</text>
  <path class="line" d="M180,62 L240,62" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="210" y="30">asks, yes, a change</text>
  <path class="line" d="M240,90 L180,90" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="210" y="128">the Proposal</text>
  <path class="line" d="M420,62 L500,62" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="460" y="54">the Proposal</text>
  <path class="line dashed" d="M500,90 L420,90" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="460" y="128">Steps as they&#x27;ll read</text>
  <path class="line" d="M330,110 L330,200" marker-end="url(#arrow)"/>
  <text class="data halo end" x="322" y="160">writes a change</text>
  <path class="line" d="M560,110 L420,215" marker-end="url(#arrow)"/>
  <text class="data halo start" x="490" y="185">lays Rules, Routes</text>
  <path class="line" d="M680,90 L800,200" marker-end="url(#arrow)"/>
  <text class="data halo start" x="748" y="140">makes each sentence by</text>
  <path class="line" d="M330,360 L330,270" marker-end="url(#arrow)"/>
  <text class="data halo end" x="322" y="320">reads Rules, Routes</text>
  <path class="line" d="M420,370 L760,260" marker-end="url(#arrow)"/>
  <text class="data halo start" x="560" y="345">checks each move by</text>
  <path class="line" d="M420,400 L500,400" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="460" y="392">keeps</text>
  <path class="line" d="M100,110 L100,360" marker-end="url(#arrow)"/>
  <text class="data halo start" x="108" y="240">types each command</text>
  <path class="line" d="M190,380 L240,380" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="210" y="350">each move</text>
  <path class="line" d="M240,412 L190,412" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="210" y="452">starts due, stops</text>
  <path class="line" d="M100,430 L240,525" marker-end="url(#arrow)"/>
  <text class="data halo end" x="160" y="500">reports Result, Mark</text>
  <path class="line" d="M420,550 L620,550 L620,430" marker-end="url(#arrow)"/>
  <text class="data halo start" x="430" y="568">reads which Results a role may give</text>
  <path class="line" d="M420,425 L760,515" marker-end="url(#arrow)"/>
  <text class="data halo start" x="540" y="446">asks for text, Items, results; runs checks</text>
  <text class="label" x="760" y="300">Legend</text>
  <rect class="box" x="760" y="312" width="22" height="14" rx="3"/>
  <text class="label small" x="790" y="324">a component</text>
  <rect class="store" x="880" y="312" width="22" height="14" rx="3"/>
  <text class="label small" x="910" y="324">data</text>
  <rect class="ext" x="760" y="336" width="22" height="14" rx="3"/>
  <text class="label small" x="790" y="348">the user&#x27;s own</text>
  <path class="line dashed" d="M760,366 L782,366" marker-end="url(#arrow)"/>
  <text class="label small" x="790" y="370">a reply</text>
</svg>
