      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
