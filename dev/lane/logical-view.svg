<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>lane's logical view</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .drift { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>


  <!-- lane's own parts -->
  <rect class="frame" x="352" y="14" width="190" height="346" rx="10"/>
  <text class="frame-name" x="364" y="33">lane</text>

  <!-- components -->
  <rect class="box" x="25" y="40" width="170" height="48" rx="8"/>
  <text class="name" x="110" y="69">building AI</text>
  <rect class="box" x="360" y="40" width="170" height="48" rx="8"/>
  <text class="name" x="445" y="69">layer</text>
  <rect class="box" x="360" y="290" width="170" height="48" rx="8"/>
  <text class="name" x="445" y="319">guard</text>
  <rect class="box" x="25" y="290" width="170" height="48" rx="8"/>
  <text class="name" x="110" y="319">subagent</text>
  <rect class="box" x="650" y="165" width="210" height="48" rx="8"/>
  <text class="name" x="755" y="194">building AI's plugin</text>

  <!-- building AI and layer -->
  <path class="line" d="M195,56 H360" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="266" y="30">has the lanes told, printed<tspan x="266" dy="17">and written once approved</tspan></text>
  <path class="line" d="M360,76 H195" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="270" y="100">tells, prints</text>

  <!-- layer and the plugin -->
  <path class="line" d="M530,88 L690,165" marker-end="url(#arrow)"/>
  <text class="label" x="612" y="92">writes the steps, the hooks<tspan x="612" dy="17">and lane's code; reads the hooks</tspan></text>

  <!-- guard, the plugin and the subagent -->
  <path class="line" d="M530,290 L690,213" marker-end="url(#arrow)"/>
  <text class="label" x="625" y="268">reads the steps<tspan x="625" dy="17">and the hooks</tspan></text>
  <path class="line drift" d="M360,322 H195" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="266" y="286">notices a drift,<tspan x="266" dy="17">tells the sentence again</tspan></text>
</svg>
