<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>lane's deployment</title>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .label { fill: #1f2328; font-size: 13px; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- outside the product -->
  <rect class="box" x="40" y="20" width="230" height="50" rx="8"/>
  <text class="name" x="155" y="42">GitHub</text>
  <text class="kind" x="155" y="60">the ccpm marketplace</text>
  <path class="line" d="M155,70 V150" marker-end="url(#arrow)"/>
  <text class="label" x="165" y="116">lane installed</text>

  <!-- the machine the plugin is built on -->
  <rect class="frame" x="20" y="100" width="540" height="430" rx="10"/>
  <text class="frame-name" x="300" y="122">the machine the plugin is built on</text>

  <rect class="box" x="40" y="150" width="230" height="70" rx="12"/>
  <text class="name" x="155" y="178">Claude Code</text>
  <text class="kind" x="155" y="198">building AI</text>

  <rect class="box" x="310" y="150" width="230" height="70" rx="12"/>
  <text class="name" x="425" y="178">python3 3.9 or later</text>
  <text class="kind" x="425" y="198">layer; adapter, on its cases</text>
  <path class="line" d="M270,185 H310" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="270" width="230" height="70" rx="0"/>
  <text class="name" style="font-size: 13px" x="155" y="298">.lane/&lt;yyyymmdd&gt;-&lt;plugin&gt;/</text>
  <text class="kind" x="155" y="318">proposal, adapter, adapter's cases</text>

  <rect class="box" x="310" y="270" width="230" height="70" rx="0"/>
  <text class="name" x="425" y="298">lane's folder</text>
  <text class="kind" x="425" y="318">layer's code, guard's code</text>

  <rect class="box" x="40" y="400" width="500" height="100" rx="0"/>
  <text class="name" x="290" y="436">the plugin's folder</text>
  <text class="kind" x="290" y="458">step, lanes laid, hook entry,</text>
  <text class="kind" x="290" y="476">guard's code, adapter, adapter's cases</text>

  <!-- the machine the plugin runs on -->
  <rect class="frame" x="630" y="100" width="540" height="430" rx="10"/>
  <text class="frame-name" x="650" y="122">the machine the plugin runs on</text>

  <rect class="box" x="650" y="150" width="230" height="70" rx="12"/>
  <text class="name" x="765" y="178">Claude Code</text>
  <text class="kind" x="765" y="198">subagent; event, answer</text>

  <rect class="box" x="920" y="150" width="230" height="70" rx="12"/>
  <text class="name" x="1035" y="178">python3 3.9 or later</text>
  <text class="kind" x="1035" y="198">guard; adapter</text>
  <path class="line" d="M880,185 H920" marker-end="url(#arrow)"/>

  <rect class="box" x="650" y="270" width="230" height="70" rx="0"/>
  <text class="name" x="765" y="298">Claude Code's records</text>
  <text class="kind" x="765" y="318">record</text>

  <rect class="box" x="920" y="270" width="230" height="70" rx="0"/>
  <text class="name" style="font-size: 13px" x="1035" y="298">lane/&lt;yyyymmdd&gt;-&lt;session&gt;/</text>
  <text class="kind" x="1035" y="318">calls kept, in the temporary folder</text>

  <rect class="box" x="650" y="400" width="500" height="100" rx="0"/>
  <text class="name" x="900" y="436">the plugin's installed folder</text>
  <text class="kind" x="900" y="458">step, lanes laid, hook entry,</text>
  <text class="kind" x="900" y="476">guard's code, adapter</text>

  <!-- the plugin carried from one to the other -->
  <path class="line" d="M540,470 H650" marker-end="url(#arrow)"/>
  <text class="label" text-anchor="middle" x="595" y="446">installed</text>
  <text class="label" text-anchor="middle" x="595" y="462">with it</text>

  <!-- legend -->
  <rect class="box" x="640" y="556" width="40" height="22" rx="8"/>
  <text class="label" x="688" y="572">runtime, holding the roles it runs</text>
  <rect class="box" x="930" y="556" width="40" height="22" rx="0"/>
  <text class="label" x="978" y="572">folder, holding data</text>
</svg>
