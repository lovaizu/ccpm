# Mutation testing of what the plugins share, run from the top of the repository on a copy that may
# be changed.
[cosmic-ray]
module-path = "common"
timeout = 30.0
excluded-modules = []
# The type checker runs first: a change to a type annotation changes no behavior a test could see,
# and the type checker is what checks annotations.
test-command = "sh -c 'pyrefly check --search-path dev/common --search-path common/hooks common dev/common && python -m unittest discover -f -s dev/common/tests'"

[cosmic-ray.distributor]
name = "local"
