<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620">
  <title>overnight&#x27;s components</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="620"/>
  <rect class="box" x="30" y="150" width="160" height="70" rx="6"/>
  <text class="name" x="110.0" y="190.0">user</text>
  <rect class="box" x="290" y="40" width="180" height="70" rx="6"/>
  <text class="name" x="380.0" y="71.0">ask</text>
  <text class="kind" x="380.0" y="91.0">[skill]</text>
  <rect class="box" x="290" y="400" width="180" height="70" rx="6"/>
  <text class="name" x="380.0" y="431.0">status</text>
  <text class="kind" x="380.0" y="451.0">[skill]</text>
  <rect class="box" x="600" y="40" width="180" height="70" rx="6"/>
  <text class="name" x="690.0" y="71.0">hand-over</text>
  <text class="kind" x="690.0" y="91.0">[script]</text>
  <rect class="box" x="600" y="220" width="180" height="70" rx="6"/>
  <text class="name" x="690.0" y="251.0">runner</text>
  <text class="kind" x="690.0" y="271.0">[script]</text>
  <rect class="box" x="600" y="400" width="180" height="70" rx="6"/>
  <text class="name" x="690.0" y="431.0">pieces</text>
  <text class="kind" x="690.0" y="451.0">[script]</text>
  <rect class="store" x="900" y="40" width="170" height="70" rx="6"/>
  <text class="name" x="985.0" y="80.0">Worktree</text>
  <rect class="ext" x="900" y="220" width="170" height="70" rx="6"/>
  <text class="name" x="985.0" y="251.0">Claude Code</text>
  <text class="kind" x="985.0" y="271.0">[outside overnight]</text>
  <rect class="store" x="900" y="400" width="170" height="70" rx="6"/>
  <text class="name" x="985.0" y="440.0">Record</text>
  <path class="line" d="M190,160 L290,80" marker-end="url(#arrow)"/>
  <text class="data halo end" x="236" y="112">hands over (Piece)</text>
  <path class="line dashed" d="M290,104 L190,184" marker-end="url(#arrow)"/>
  <text class="data halo start" x="250" y="150">number, folder, branch</text>
  <path class="line" d="M470,70 L600,70" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="535" y="61">hands on (Piece)</text>
  <path class="line dashed" d="M600,100 L470,100" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="535" y="119">refusal, or the piece</text>
  <path class="line" d="M780,75 L900,75" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="840" y="66">makes</text>
  <path class="line" d="M690,110 L690,220" marker-end="url(#arrow)"/>
  <text class="data halo start" x="698" y="170">starts apart from the session (Piece)</text>
  <path class="line" d="M615,110 L560,165 L560,380 L615,400" marker-end="url(#arrow)"/>
  <text class="data halo end" x="552" y="242">asks the highest number, records the piece</text>
  <text class="data halo end" x="552" y="258">and the runner it started (Record)</text>
  <path class="line" d="M780,240 L900,240" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="840" y="231">runs (Conversation)</text>
  <path class="line dashed" d="M900,272 L780,272" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="840" y="291">stop, or last words</text>
  <path class="line" d="M985,220 L985,110" marker-end="url(#arrow)"/>
  <text class="data halo start" x="993" y="170">works in</text>
  <path class="line" d="M690,290 L690,400" marker-end="url(#arrow)"/>
  <text class="data halo start" x="698" y="342">records each wait and resume,</text>
  <text class="data halo start" x="698" y="358">and the end (Wait, Record)</text>
  <path class="line" d="M780,435 L900,435" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="840" y="426">keeps</text>
  <path class="line" d="M170,220 L300,400" marker-end="url(#arrow)"/>
  <text class="data halo start" x="262" y="330">asks</text>
  <path class="line dashed" d="M290,445 L110,220" marker-end="url(#arrow)"/>
  <text class="data halo end" x="190" y="340">shows how each went</text>
  <path class="line" d="M470,425 L600,425" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="535" y="416">asks (Record)</text>
  <path class="line dashed" d="M600,455 L470,455" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="535" y="474">where each stands</text>
  <text class="label" x="30" y="520">Legend</text>
  <rect class="box" x="30" y="532" width="22" height="16" rx="3"/>
  <text class="label small" x="62" y="545">a component, or the user</text>
  <rect class="store" x="30" y="558" width="22" height="16" rx="3"/>
  <text class="label small" x="62" y="571">a store of data</text>
  <rect class="ext" x="260" y="532" width="22" height="16" rx="3"/>
  <text class="label small" x="292" y="545">a thing outside overnight</text>
  <path class="line dashed" d="M260,566 L282,566" marker-end="url(#arrow)"/>
  <text class="label small" x="292" y="570">a result handed back</text>
</svg>
