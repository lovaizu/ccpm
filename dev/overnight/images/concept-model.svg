<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460">
  <title>overnight&#x27;s concepts</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="860" height="460"/>
  <rect class="box" x="30" y="180" width="180" height="60" rx="6"/>
  <text class="name" x="120.0" y="215.0">Worktree</text>
  <rect class="box" x="330" y="180" width="200" height="60" rx="6"/>
  <text class="name" x="430.0" y="215.0">Piece</text>
  <rect class="box" x="650" y="180" width="180" height="60" rx="6"/>
  <text class="name" x="740.0" y="215.0">Conversation</text>
  <rect class="box" x="330" y="360" width="200" height="60" rx="6"/>
  <text class="name" x="430.0" y="395.0">Record</text>
  <rect class="box" x="650" y="360" width="180" height="60" rx="6"/>
  <text class="name" x="740.0" y="395.0">Wait</text>
  <path class="line" d="M210,210 L330,210"/>
  <text class="label halo mid" x="270" y="200">works in</text>
  <text class="label small halo start" x="216" y="228">1</text>
  <text class="label small halo end" x="324" y="228">1</text>
  <path class="line" d="M530,210 L650,210"/>
  <text class="label halo mid" x="590" y="200">goes on in</text>
  <text class="label small halo start" x="536" y="228">1</text>
  <text class="label small halo end" x="644" y="228">1</text>
  <path class="line" d="M430,240 L430,360"/>
  <text class="label halo start" x="442" y="305">is told by</text>
  <text class="label small halo end" x="420" y="258">1</text>
  <text class="label small halo end" x="420" y="352">1</text>
  <path class="line" d="M530,390 L650,390"/>
  <text class="label halo mid" x="590" y="380">holds</text>
  <text class="label small halo start" x="536" y="408">1</text>
  <text class="label small halo end" x="644" y="408">*</text>
</svg>
