<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <title>overnight&#x27;s deployment</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="600"/>
  <rect class="ext" x="60" y="20" width="200" height="60" rx="6"/>
  <text class="name" x="160.0" y="46.0">ccpm marketplace</text>
  <text class="kind" x="160.0" y="66.0">[on GitHub]</text>
  <rect class="frame" x="20" y="110" width="700" height="470" rx="10"/>
  <text class="frame-name" x="300" y="132">the user&#x27;s computer [macOS, Linux, or Windows]</text>
  <rect class="unit" x="40" y="150" width="660" height="130" rx="8"/>
  <text class="frame-name" x="300" y="172">Claude Code</text>
  <rect class="box" x="60" y="185" width="260" height="75" rx="6"/>
  <text class="name" x="190.0" y="217.0">commands</text>
  <text class="kind" x="190.0" y="237.0">[skills, and the scripts they run]</text>
  <rect class="box" x="440" y="185" width="240" height="75" rx="6"/>
  <text class="name" x="560.0" y="217.0">task sessions</text>
  <text class="kind" x="560.0" y="237.0">[one for each task]</text>
  <rect class="box" x="130" y="330" width="220" height="75" rx="6"/>
  <text class="name" x="240.0" y="362.0">runner, session</text>
  <text class="kind" x="240.0" y="382.0">[scripts, on their own]</text>
  <rect class="store" x="60" y="460" width="300" height="90" rx="6"/>
  <text class="name" x="210.0" y="500.0">the queue&#x27;s folder</text>
  <text class="kind" x="210.0" y="520.0">[queue file, prompts, runs, replies]</text>
  <rect class="store" x="440" y="460" width="240" height="90" rx="6"/>
  <text class="name" x="560.0" y="500.0">each task&#x27;s dir</text>
  <text class="kind" x="560.0" y="520.0">[the user&#x27;s work, in git]</text>
  <rect class="ext" x="770" y="185" width="220" height="75" rx="6"/>
  <text class="name" x="880.0" y="217.0">Claude</text>
  <text class="kind" x="880.0" y="237.0">[the model, with its usage limit]</text>
  <path class="line" d="M160,80 L160,185" marker-end="url(#arrow)"/>
  <text class="data halo start" x="168" y="140">installs</text>
  <path class="line" d="M240,260 L240,330" marker-end="url(#arrow)"/>
  <text class="data halo start" x="248" y="300">starts, apart from Claude Code</text>
  <path class="line" d="M80,260 L80,460" marker-end="url(#arrow)"/>
  <text class="data halo start" x="88" y="300">reads and writes</text>
  <path class="line" d="M240,405 L240,460" marker-end="url(#arrow)"/>
  <text class="data halo start" x="248" y="438">reads and writes</text>
  <path class="line" d="M350,350 L500,260" marker-end="url(#arrow)"/>
  <text class="data halo start" x="430" y="318">starts and resumes</text>
  <path class="line" d="M680,222 L770,222" marker-end="url(#arrow)"/>
  <text class="data halo mid" x="725" y="213">each call</text>
  <path class="line" d="M620,260 L620,460" marker-end="url(#arrow)"/>
  <text class="data halo start" x="628" y="360">works in</text>
</svg>
