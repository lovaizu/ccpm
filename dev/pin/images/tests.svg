<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Pin&#x27;s tests</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="640"/>
  <rect class="box" x="20" y="20" width="240" height="60" rx="0"/>
  <text class="name" x="140.0" y="46" text-anchor="middle">Deployment unit</text>
  <rect class="box" x="260" y="20" width="340" height="60" rx="0"/>
  <text class="name" x="430.0" y="46" text-anchor="middle">unit</text>
  <text class="kind" x="430.0" y="66" text-anchor="middle">one part against its contract</text>
  <rect class="box" x="600" y="20" width="340" height="60" rx="0"/>
  <text class="name" x="770.0" y="46" text-anchor="middle">architecture</text>
  <text class="kind" x="770.0" y="66" text-anchor="middle">the parts joined, against this document</text>
  <rect class="box" x="940" y="20" width="340" height="60" rx="0"/>
  <text class="name" x="1110.0" y="46" text-anchor="middle">ux</text>
  <text class="kind" x="1110.0" y="66" text-anchor="middle">Pin in real use, against the product vision</text>
  <rect class="box" x="20" y="80" width="240" height="130" rx="0"/>
  <text class="name" x="140" y="140" text-anchor="middle">check.py process</text>
  <text class="kind" x="140" y="160" text-anchor="middle">[python3 3.9 or later]</text>
  <rect class="lane" x="260" y="80" width="340" height="130" rx="0"/>
  <text class="label" x="274" y="120" text-anchor="start">unittest, Cosmic Ray, Hypothesis · FULL</text>
  <text class="label small" x="274" y="142" text-anchor="start">each class of the design tree,</text>
  <text class="label small" x="274" y="158" text-anchor="start">and each of its three results</text>
  <rect class="lane" x="600" y="80" width="340" height="130" rx="0"/>
  <text class="label" x="614" y="120" text-anchor="start">unittest · FULL</text>
  <text class="label small" x="614" y="142" text-anchor="start">check.py run by the command of the</text>
  <text class="label small" x="614" y="158" text-anchor="start">pinner&#x27;s rule, on each path&#x27;s design tree</text>
  <rect class="unit" x="940" y="80" width="340" height="130" rx="0"/>
  <text class="label" x="954" y="120" text-anchor="start">a trial on Opus · SMOKE</text>
  <text class="label small" x="954" y="142" text-anchor="start">check.py run by the real pinner</text>
  <rect class="box" x="20" y="210" width="240" height="130" rx="0"/>
  <text class="name" x="140" y="270" text-anchor="middle">hook process</text>
  <text class="kind" x="140" y="290" text-anchor="middle">[python3 3.9 or later]</text>
  <rect class="ext" x="260" y="210" width="340" height="130" rx="0"/>
  <text class="label" x="274" y="250" text-anchor="start">empty</text>
  <text class="label small" x="274" y="272" text-anchor="start">Lane&#x27;s unit tests test the guard,</text>
  <text class="label small" x="274" y="288" text-anchor="start">and Pin writes none of its code</text>
  <rect class="lane" x="600" y="210" width="340" height="130" rx="0"/>
  <text class="label" x="614" y="250" text-anchor="start">unittest · FULL</text>
  <text class="label small" x="614" y="272" text-anchor="start">the guard on Pin&#x27;s rules and routes as laid:</text>
  <text class="label small" x="614" y="288" text-anchor="start">each call of the pinner and each start</text>
  <text class="label small" x="614" y="304" text-anchor="start">let through or stopped</text>
  <rect class="unit" x="940" y="210" width="340" height="130" rx="0"/>
  <text class="label" x="954" y="250" text-anchor="start">a trial on Opus · SMOKE</text>
  <text class="label small" x="954" y="272" text-anchor="start">the guard on the real run</text>
  <rect class="box" x="20" y="340" width="240" height="130" rx="0"/>
  <text class="name" x="140" y="400" text-anchor="middle">Claude Code process</text>
  <text class="kind" x="140" y="420" text-anchor="middle">[Claude Code 2.1.319 or later]</text>
  <rect class="ext" x="260" y="340" width="340" height="130" rx="0"/>
  <text class="label" x="274" y="380" text-anchor="start">empty</text>
  <text class="label small" x="274" y="402" text-anchor="start">no level tries a prompt alone: the</text>
  <text class="label small" x="274" y="418" text-anchor="start">guard holds the rules that must hold</text>
  <rect class="lane" x="600" y="340" width="340" height="130" rx="0"/>
  <text class="label" x="614" y="380" text-anchor="start">unittest · HAPPY</text>
  <text class="label small" x="614" y="402" text-anchor="start">the entries as Claude Code takes them,</text>
  <text class="label small" x="614" y="418" text-anchor="start">doubles of the orchestrator and the pinner:</text>
  <text class="label small" x="614" y="434" text-anchor="start">each path of S1 to S3</text>
  <rect class="unit" x="940" y="340" width="340" height="130" rx="0"/>
  <text class="label" x="954" y="380" text-anchor="start">trials on Opus · HAPPY</text>
  <text class="label small" x="954" y="402" text-anchor="start">O1, typed and called by an AI,</text>
  <text class="label small" x="954" y="418" text-anchor="start">3 runs each: KR1.1 and KR1.2 measured</text>
  <text class="frame-name" x="20" y="500" text-anchor="start">Legend</text>
  <rect class="lane" x="100" y="486" width="36" height="22" rx="0"/>
  <text class="label small" x="144" y="501" text-anchor="start">runs on every push and in CI</text>
  <rect class="unit" x="400" y="486" width="36" height="22" rx="0"/>
  <text class="label small" x="444" y="501" text-anchor="start">runs once every lower level passes</text>
  <rect class="ext" x="740" y="486" width="36" height="22" rx="0"/>
  <text class="label small" x="784" y="501" text-anchor="start">empty, with why</text>
  <text class="label small" x="100" y="530" text-anchor="start">tool · FULL, HAPPY or SMOKE, then what the tests check</text>
</svg>
