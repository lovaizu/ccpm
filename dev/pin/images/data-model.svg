<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Pin&#x27;s data</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1240" height="710"/>
  <rect class="frame" x="20" y="20" width="300" height="420" rx="8"/>
  <text class="frame-name" x="34" y="42" text-anchor="start">orchestrator</text>
  <rect class="frame" x="360" y="20" width="860" height="560" rx="8"/>
  <text class="frame-name" x="374" y="42" text-anchor="start">Design tree, kept by the pinner</text>
  <rect class="frame" x="20" y="470" width="300" height="110" rx="8"/>
  <text class="frame-name" x="34" y="492" text-anchor="start">check.py</text>
  <rect class="box" x="80" y="70" width="170" height="44" rx="0"/>
  <text class="name" x="165.0" y="97.0" text-anchor="middle">Request</text>
  <rect class="box" x="80" y="330" width="170" height="44" rx="0"/>
  <text class="name" x="165.0" y="357.0" text-anchor="middle">Answer</text>
  <rect class="box" x="80" y="200" width="170" height="44" rx="0"/>
  <text class="name" x="165.0" y="227.0" text-anchor="middle">Point</text>
  <rect class="box" x="80" y="510" width="170" height="44" rx="0"/>
  <text class="name" x="165.0" y="537.0" text-anchor="middle">Check result</text>
  <rect class="box" x="560" y="70" width="170" height="44" rx="0"/>
  <text class="name" x="645.0" y="97.0" text-anchor="middle">Design tree</text>
  <rect class="box" x="900" y="70" width="170" height="44" rx="0"/>
  <text class="name" x="985.0" y="97.0" text-anchor="middle">Goal</text>
  <rect class="box" x="560" y="250" width="170" height="44" rx="0"/>
  <text class="name" x="645.0" y="277.0" text-anchor="middle">Question</text>
  <rect class="box" x="900" y="250" width="170" height="44" rx="0"/>
  <text class="name" x="985.0" y="277.0" text-anchor="middle">Decision</text>
  <rect class="box" x="900" y="470" width="170" height="44" rx="0"/>
  <text class="name" x="985.0" y="497.0" text-anchor="middle">Ground</text>
  <path class="line" d="M250,80 L560,80" marker-end="url(#arrow)"/>
  <text class="label small halo" x="405" y="72" text-anchor="middle">names the path of</text>
  <text class="label small" x="262" y="96" text-anchor="start">0..*</text>
  <text class="label small" x="552" y="76" text-anchor="end">1</text>
  <path class="line" d="M250,222 L480,222 L480,94 L560,94" marker-end="url(#arrow)"/>
  <text class="label small halo" x="370" y="214" text-anchor="middle">puts a point of, or all of</text>
  <text class="label small" x="262" y="238" text-anchor="start">0..*</text>
  <text class="label small" x="552" y="90" text-anchor="end">1</text>
  <path class="line" d="M165,330 L165,244" marker-end="url(#arrow)"/>
  <text class="label small halo" x="175" y="292" text-anchor="start">answers</text>
  <text class="label small" x="175" y="322" text-anchor="start">0..*</text>
  <text class="label small" x="175" y="258" text-anchor="start">1</text>
  <path class="line" d="M250,352 L340,352 L340,640 L985,640 L985,514" marker-end="url(#arrow)"/>
  <text class="label small halo" x="600" y="632" text-anchor="middle">is kept as</text>
  <text class="label small" x="262" y="368" text-anchor="start">1</text>
  <text class="label small" x="995" y="530" text-anchor="start">0..1</text>
  <path class="line" d="M250,532 L440,532 L440,108 L560,108" marker-end="url(#arrow)"/>
  <text class="label small halo" x="446" y="470" text-anchor="start">is of</text>
  <text class="label small" x="262" y="548" text-anchor="start">0..*</text>
  <text class="label small" x="552" y="104" text-anchor="end">1</text>
  <path class="line" d="M730,92 L900,92" marker-start="url(#diamond)"/>
  <text class="label small halo" x="815" y="84" text-anchor="middle">holds</text>
  <text class="label small" x="880" y="108" text-anchor="start">1</text>
  <path class="line" d="M620,114 L620,250" marker-start="url(#diamond)"/>
  <text class="label small halo" x="628" y="180" text-anchor="start">holds</text>
  <text class="label small" x="628" y="242" text-anchor="start">1..*</text>
  <path class="line" d="M700,114 L700,170 L960,170 L960,250" marker-start="url(#diamond)"/>
  <text class="label small halo" x="830" y="162" text-anchor="middle">holds</text>
  <text class="label small" x="968" y="242" text-anchor="start">0..*</text>
  <path class="line" d="M645,250 L645,200 L985,200 L985,114" marker-end="url(#arrow)"/>
  <text class="label small halo" x="820" y="194" text-anchor="middle">must hold for</text>
  <text class="label small" x="993" y="130" text-anchor="start">1</text>
  <path class="line" d="M900,272 L730,272" marker-end="url(#arrow)"/>
  <text class="label small halo" x="815" y="264" text-anchor="middle">serves</text>
  <text class="label small" x="894" y="292" text-anchor="end">0..*</text>
  <text class="label small" x="736" y="292" text-anchor="start">0..1</text>
  <path class="line" d="M1070,260 L1150,260 L1150,284 L1070,284" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1160" y="268" text-anchor="start">serves,</text>
  <text class="label small halo" x="1160" y="282" text-anchor="start">builds on</text>
  <text class="label small" x="1090" y="304" text-anchor="start">0..*</text>
  <path class="line" d="M985,294 L985,470" marker-end="url(#arrow)"/>
  <text class="label small halo" x="993" y="390" text-anchor="start">rests on</text>
  <text class="label small" x="993" y="460" text-anchor="start">0..*</text>
  <path class="line" d="M1050,114 L1200,114 L1200,492 L1070,492" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1192" y="400" text-anchor="end">rests on</text>
  <text class="label small" x="1080" y="484" text-anchor="start">0..*</text>
  <text class="frame-name" x="30" y="670" text-anchor="start">Legend</text>
  <text class="label small" x="100" y="670" text-anchor="start">1 exactly one · 0..1 zero or one · 1..* one or many · 0..* zero or many, each at the end of the data it counts;</text>
  <text class="label small" x="100" y="688" text-anchor="start">a filled diamond at the whole that holds the other&#x27;s parts; a box holds a data&#x27;s name</text>
</svg>
