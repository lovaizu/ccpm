<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Pin&#x27;s deployment</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="600"/>
  <rect class="frame" x="20" y="50" width="1050" height="460" rx="8"/>
  <text class="frame-name" x="36" y="74" text-anchor="start">the person&#x27;s computer</text>
  <rect class="unit" x="40" y="90" width="480" height="140" rx="6"/>
  <text class="name start" x="54" y="116" text-anchor="start">Claude Code process</text>
  <text class="kind start" x="54" y="134" text-anchor="start">[Claude Code 2.1.317 or later]</text>
  <text class="label start" x="54" y="158" text-anchor="start">go-between, in the main conversation or the maker AI</text>
  <text class="label start" x="54" y="176" text-anchor="start">pinner, a subagent</text>
  <rect class="unit" x="600" y="90" width="420" height="140" rx="6"/>
  <text class="name start" x="614" y="116" text-anchor="start">installed Pin</text>
  <text class="kind start" x="614" y="134" text-anchor="start">[plugin folder, installed by Claude Code]</text>
  <text class="label start" x="614" y="158" text-anchor="start">the entries and the steps of both roles</text>
  <text class="label start" x="614" y="176" text-anchor="start">check.py&#x27;s and the guard&#x27;s code</text>
  <text class="data start" x="614" y="194" text-anchor="start">Rules laid</text>
  <rect class="unit" x="40" y="310" width="220" height="110" rx="6"/>
  <text class="name start" x="54" y="336" text-anchor="start">hook process</text>
  <text class="kind start" x="54" y="354" text-anchor="start">[python3 3.9 or later]</text>
  <text class="label start" x="54" y="378" text-anchor="start">guard</text>
  <rect class="unit" x="300" y="310" width="220" height="110" rx="6"/>
  <text class="name start" x="314" y="336" text-anchor="start">check.py process</text>
  <text class="kind start" x="314" y="354" text-anchor="start">[python3 3.9 or later]</text>
  <text class="label start" x="314" y="378" text-anchor="start">check.py</text>
  <rect class="unit" x="600" y="310" width="420" height="120" rx="6"/>
  <text class="name start" x="614" y="336" text-anchor="start">the repository</text>
  <text class="kind start" x="614" y="354" text-anchor="start">[git working tree]</text>
  <text class="data start" x="614" y="378" text-anchor="start">Design file, in .pin/&lt;yyyymmdd&gt;-&lt;name&gt;/</text>
  <text class="data start" x="614" y="396" text-anchor="start">or at the maker AI&#x27;s path</text>
  <text class="label start" x="614" y="414" text-anchor="start">the files the facts are found in</text>
  <rect class="ext" x="1130" y="90" width="240" height="64" rx="4"/>
  <text class="name" x="1250.0" y="118.5" text-anchor="middle">Anthropic&#x27;s API</text>
  <text class="kind" x="1250.0" y="135.5" text-anchor="middle">[HTTPS]</text>
  <rect class="ext" x="1130" y="330" width="240" height="64" rx="4"/>
  <text class="name" x="1250.0" y="358.5" text-anchor="middle">marketplace</text>
  <text class="kind" x="1250.0" y="375.5" text-anchor="middle">[git repository on GitHub]</text>
  <path class="line" d="M520,160 L600,160" marker-end="url(#arrow)"/>
  <text class="label small halo" x="560" y="150" text-anchor="middle">loads</text>
  <path class="line" d="M150,230 L150,310" marker-end="url(#arrow)"/>
  <text class="label small halo" x="158" y="256" text-anchor="start">runs it on each call and end</text>
  <text class="label small halo" x="158" y="270" text-anchor="start">of the pinner [sh, JSON on stdin]</text>
  <path class="line" d="M420,230 L420,310" marker-end="url(#arrow)"/>
  <text class="label small halo" x="428" y="264" text-anchor="start">runs it [Bash tool]</text>
  <path class="line" d="M520,200 L560,200 L560,350 L600,350" marker-end="url(#arrow)"/>
  <text class="label small halo" x="568" y="262" text-anchor="start">reads facts,</text>
  <text class="label small halo" x="568" y="276" text-anchor="start">writes</text>
  <path class="line" d="M520,390 L600,390" marker-end="url(#arrow)"/>
  <text class="label small halo" x="560" y="382" text-anchor="middle">reads</text>
  <path class="line" d="M150,420 L150,470 L1045,470 L1045,200 L1020,200" marker-end="url(#arrow)"/>
  <text class="label small halo" x="600" y="462" text-anchor="middle">reads Rules laid</text>
  <path class="line" d="M280,90 L280,30 L1250,30 L1250,90" marker-end="url(#arrow)"/>
  <text class="label small halo" x="760" y="22" text-anchor="middle">the model&#x27;s turns</text>
  <path class="line" d="M1130,362 L1095,362 L1095,120 L1020,120" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1103" y="250" text-anchor="start">installs Pin</text>
  <text class="label small halo" x="1103" y="264" text-anchor="start">[claude plugin install]</text>
  <text class="frame-name" x="36" y="564" text-anchor="start">Legend</text>
  <rect class="frame" x="110" y="549" width="36" height="22" rx="4"/>
  <text class="label small" x="154" y="564" text-anchor="start">environment</text>
  <rect class="unit" x="260" y="549" width="36" height="22" rx="4"/>
  <text class="label small" x="304" y="564" text-anchor="start">deployment unit, [technology]: the roles that run in it</text>
  <text class="data" x="660" y="564" text-anchor="start">data kept</text>
  <rect class="ext" x="740" y="549" width="36" height="22" rx="4"/>
  <text class="label small" x="784" y="564" text-anchor="start">outside Pin; an arrow says what is used [protocol]</text>
</svg>
