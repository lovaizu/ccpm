<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Pin&#x27;s deployment</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1320" height="760"/>
  <rect class="frame" x="20" y="20" width="960" height="640" rx="8"/>
  <text class="frame-name" x="34" y="42" text-anchor="start">the user&#x27;s computer</text>
  <rect class="unit" x="50" y="70" width="420" height="120" rx="6"/>
  <text class="name" x="260.0" y="111.0" text-anchor="middle">Claude Code process</text>
  <text class="kind" x="260.0" y="130.0" text-anchor="middle">[Claude Code 2.1.319 or later]</text>
  <text class="kind" x="260.0" y="145.0" text-anchor="middle">orchestrator, in the main conversation</text>
  <text class="kind" x="260.0" y="160.0" text-anchor="middle">pinner, a subagent</text>
  <rect class="unit" x="530" y="70" width="420" height="120" rx="6"/>
  <text class="name" x="740.0" y="111.0" text-anchor="middle">installed Pin</text>
  <text class="kind" x="740.0" y="130.0" text-anchor="middle">[plugin folder, installed by Claude Code]</text>
  <text class="kind" x="740.0" y="145.0" text-anchor="middle">the entries and the steps of both roles</text>
  <text class="kind" x="740.0" y="160.0" text-anchor="middle">check.py&#x27;s code; the guard&#x27;s code, rules and routes</text>
  <rect class="unit" x="50" y="260" width="420" height="80" rx="6"/>
  <text class="name" x="260.0" y="289.0" text-anchor="middle">hook process</text>
  <text class="kind" x="260.0" y="308.0" text-anchor="middle">[python3 3.9 or later]</text>
  <text class="kind" x="260.0" y="323.0" text-anchor="middle">guard</text>
  <rect class="unit" x="530" y="260" width="420" height="80" rx="6"/>
  <text class="name" x="740.0" y="289.0" text-anchor="middle">check.py process</text>
  <text class="kind" x="740.0" y="308.0" text-anchor="middle">[python3 3.9 or later]</text>
  <text class="kind" x="740.0" y="323.0" text-anchor="middle">check.py</text>
  <rect class="unit" x="50" y="440" width="900" height="100" rx="6"/>
  <text class="name" x="500.0" y="471.0" text-anchor="middle">the repository</text>
  <text class="kind" x="500.0" y="490.0" text-anchor="middle">[git working tree]</text>
  <text class="kind" x="500.0" y="505.0" text-anchor="middle">Design tree, in .pin/&lt;yyyymmdd&gt;-&lt;name&gt;/ or at the user&#x27;s AI&#x27;s path</text>
  <text class="kind" x="500.0" y="520.0" text-anchor="middle">the files the facts are found in</text>
  <rect class="ext" x="1040" y="70" width="260" height="64" rx="4"/>
  <text class="name" x="1170.0" y="99.0" text-anchor="middle">Anthropic&#x27;s API</text>
  <text class="kind" x="1170.0" y="118.0" text-anchor="middle">[HTTPS]</text>
  <rect class="ext" x="1040" y="260" width="260" height="64" rx="4"/>
  <text class="name" x="1170.0" y="289.0" text-anchor="middle">marketplace</text>
  <text class="kind" x="1170.0" y="308.0" text-anchor="middle">[git repository on GitHub]</text>
  <path class="line" d="M470,130 L530,130" marker-end="url(#arrow)"/>
  <text class="label small halo" x="500" y="122" text-anchor="middle">loads</text>
  <path class="line" d="M200,190 L200,260" marker-end="url(#arrow)"/>
  <text class="label small halo" x="208" y="214" text-anchor="start">runs it on each call and end [sh, JSON on stdin]</text>
  <path class="line" d="M450,190 L450,238 L700,238 L700,260" marker-end="url(#arrow)"/>
  <text class="label small halo" x="575" y="232" text-anchor="middle">runs it [Bash tool]</text>
  <path class="line" d="M120,190 L120,210 L30,210 L30,470 L50,470" marker-end="url(#arrow)"/>
  <text class="label small halo" x="36" y="400" text-anchor="start">reads facts, writes</text>
  <path class="line" d="M740,340 L740,440" marker-end="url(#arrow)"/>
  <text class="label small halo" x="748" y="394" text-anchor="start">reads</text>
  <path class="line" d="M380,260 L380,250 L900,250 L900,190" marker-end="url(#arrow)"/>
  <text class="label small halo" x="908" y="220" text-anchor="start">reads rules</text>
  <path class="line" d="M260,70 L260,54 L1170,54 L1170,70" marker-end="url(#arrow)"/>
  <text class="label small halo" x="700" y="48" text-anchor="middle">the model&#x27;s turns</text>
  <path class="line" d="M1040,280 L1000,280 L1000,160 L950,160" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1008" y="220" text-anchor="start">installs Pin</text>
  <text class="label small halo" x="1008" y="234" text-anchor="start">[claude plugin install]</text>
  <text class="frame-name" x="30" y="720" text-anchor="start">Legend</text>
  <rect class="frame" x="100" y="706" width="36" height="22" rx="4"/>
  <text class="label small" x="144" y="721" text-anchor="start">environment</text>
  <rect class="unit" x="250" y="706" width="36" height="22" rx="4"/>
  <text class="label small" x="294" y="721" text-anchor="start">deployment unit, [technology]: the components and data in it</text>
  <rect class="ext" x="740" y="706" width="36" height="22" rx="4"/>
  <text class="label small" x="784" y="721" text-anchor="start">outside Pin; an arrow says what is used [protocol]</text>
</svg>
