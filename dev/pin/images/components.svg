<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Pin&#x27;s components</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .lane { fill: #ddf4ff; stroke: #54aeff; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .hole { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .lane { fill: #0c2d6b; stroke: #4493f8; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .hole { fill: #0d1117; stroke: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path class="head" d="M0,5 L8,0 L16,5 L8,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1460" height="870"/>
  <circle class="ext" cx="160.0" cy="50" r="11"/>
  <rect class="ext" x="40" y="60" width="240" height="64" rx="22"/>
  <text class="name" x="160.0" y="89.0" text-anchor="middle">user</text>
  <text class="kind" x="160.0" y="108.0" text-anchor="middle">[a person, or an AI for a person]</text>
  <rect class="box" x="420" y="300" width="280" height="80" rx="0"/>
  <text class="name" x="560.0" y="329.0" text-anchor="middle">orchestrator</text>
  <text class="kind" x="560.0" y="348.0" text-anchor="middle">[main conversation · skill pin:down,</text>
  <text class="kind" x="560.0" y="363.0" text-anchor="middle">steps in Markdown]</text>
  <rect class="box" x="880" y="60" width="280" height="64" rx="0"/>
  <text class="name" x="1020.0" y="89.0" text-anchor="middle">guard</text>
  <text class="kind" x="1020.0" y="108.0" text-anchor="middle">[hook script · Lane&#x27;s code, Python 3.9]</text>
  <rect class="box" x="880" y="300" width="280" height="80" rx="0"/>
  <text class="name" x="1020.0" y="329.0" text-anchor="middle">pinner</text>
  <text class="kind" x="1020.0" y="348.0" text-anchor="middle">[subagent · Claude Code,</text>
  <text class="kind" x="1020.0" y="363.0" text-anchor="middle">steps in Markdown]</text>
  <rect class="ext" x="1260" y="304" width="180" height="64" rx="4"/>
  <text class="name" x="1350.0" y="333.0" text-anchor="middle">repository</text>
  <text class="kind" x="1350.0" y="352.0" text-anchor="middle">[files]</text>
  <rect class="box" x="1240" y="560" width="200" height="64" rx="0"/>
  <text class="name" x="1340.0" y="589.0" text-anchor="middle">check.py</text>
  <text class="kind" x="1340.0" y="608.0" text-anchor="middle">[command line · Python 3.9]</text>
  <rect class="box" x="420" y="700" width="740" height="64" rx="0"/>
  <text class="name" x="790.0" y="729.0" text-anchor="middle">Design tree</text>
  <text class="kind" x="790.0" y="748.0" text-anchor="middle">[file · Markdown]</text>
  <path class="line" d="M110,124 L110,320 L420,320" marker-end="url(#arrow)"/>
  <text class="label small halo" x="118" y="180" text-anchor="start">1 types /pin:down, or calls</text>
  <text class="label small halo" x="118" y="194" text-anchor="start">the skill; then answers</text>
  <text class="label small halo" x="118" y="208" text-anchor="start">[/pin:down, Skill]</text>
  <text class="data halo" x="118" y="222" text-anchor="start">Answer</text>
  <path class="line" d="M60,124 L60,732 L420,732" marker-end="url(#arrow)"/>
  <text class="label small halo" x="68" y="640" text-anchor="start">0 the user&#x27;s AI writes its</text>
  <text class="label small halo" x="68" y="654" text-anchor="start">points before the call</text>
  <text class="data halo" x="68" y="668" text-anchor="start">Goal, Question, Decision</text>
  <path class="line" d="M500,380 L500,700" marker-end="url(#arrow)"/>
  <text class="label small halo" x="508" y="520" text-anchor="start">2 looks for the plan&#x27;s</text>
  <text class="label small halo" x="508" y="534" text-anchor="start">file, and picks its path</text>
  <text class="data halo" x="508" y="548" text-anchor="start">Design tree</text>
  <path class="line" d="M700,318 L880,318" marker-end="url(#arrow)"/>
  <text class="label small halo" x="708" y="262" text-anchor="start">3 starts it, then resumes it</text>
  <text class="label small halo" x="708" y="276" text-anchor="start">[Agent, SendMessage]</text>
  <text class="data halo" x="708" y="290" text-anchor="start">Request, Answer</text>
  <path class="line" d="M880,362 L700,362" marker-end="url(#arrow)"/>
  <text class="label small halo" x="708" y="384" text-anchor="start">9 ends with one point</text>
  <text class="data halo" x="708" y="398" text-anchor="start">Point</text>
  <path class="line" d="M600,300 L600,92 L280,92" marker-end="url(#arrow)"/>
  <text class="label small halo" x="440" y="82" text-anchor="middle">10 puts each Point as given</text>
  <path class="line" d="M880,100 L660,100 L660,300" marker-end="url(#arrow)"/>
  <text class="label small halo" x="668" y="150" text-anchor="start">4 tells each next start,</text>
  <text class="label small halo" x="668" y="164" text-anchor="start">stops one not due</text>
  <text class="label small halo" x="668" y="178" text-anchor="start">[Claude Code hooks]</text>
  <path class="line" d="M1020,124 L1020,300" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1028" y="190" text-anchor="start">5 lets each call and end through,</text>
  <text class="label small halo" x="1028" y="204" text-anchor="start">or stops it with its step&#x27;s sentence</text>
  <text class="label small halo" x="1028" y="218" text-anchor="start">[Claude Code hooks]</text>
  <path class="line" d="M1160,336 L1260,336" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1210" y="326" text-anchor="middle">6 reads facts</text>
  <text class="label small halo" x="1210" y="356" text-anchor="middle">[Read, Grep]</text>
  <path class="line" d="M960,380 L960,700" marker-end="url(#arrow)"/>
  <text class="label small halo" x="968" y="560" text-anchor="start">7 writes each point,</text>
  <text class="label small halo" x="968" y="574" text-anchor="start">with who settled it</text>
  <text class="label small halo" x="968" y="588" text-anchor="start">[Write, Edit]</text>
  <text class="data halo" x="968" y="602" text-anchor="start">Goal, Question,</text>
  <text class="data halo" x="968" y="616" text-anchor="start">Decision, Ground</text>
  <path class="line" d="M1110,380 L1110,592 L1240,592" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1118" y="440" text-anchor="start">8 runs it on the path,</text>
  <text class="label small halo" x="1118" y="454" text-anchor="start">and gets its result</text>
  <text class="label small halo" x="1118" y="468" text-anchor="start">[Bash]</text>
  <text class="data halo" x="1118" y="482" text-anchor="start">Check result</text>
  <path class="line" d="M1340,624 L1340,732 L1160,732" marker-end="url(#arrow)"/>
  <text class="label small halo" x="1348" y="680" text-anchor="start">reads</text>
  <text class="data halo" x="1348" y="694" text-anchor="start">Design tree</text>
  <text class="frame-name" x="40" y="826" text-anchor="start">Legend</text>
  <rect class="box" x="110" y="811" width="36" height="22" rx="0"/>
  <text class="label small" x="154" y="826" text-anchor="start">part of Pin: a role, a script or a store of data, by its type</text>
  <rect class="ext" x="620" y="811" width="36" height="22" rx="4"/>
  <text class="label small" x="664" y="826" text-anchor="start">outside Pin; round with a head for the user</text>
  <text class="label small" x="110" y="850" text-anchor="start">[type · technology] in a box; [protocol or tool] on an arrow; number: the order</text>
  <text class="data" x="700" y="850" text-anchor="start">data handed on, named as in the data model</text>
</svg>
