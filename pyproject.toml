# The tools that build and check the plugins, set up by `uv sync --locked` from uv.lock, which holds
# each at the version and hashes of its lock. The plugins' users install nothing here.
[project]
name = "ccpm"
version = "0"
# The oldest Python that users run, as N13 of plugins/rn/domain/best-practices/plugin/best-practice.md
# says, which ruff takes as the version it checks for.
requires-python = ">=3.9"

[dependency-groups]
# The checks of dev/scripts/check.sh, on every Python users run.
dev = [
  "pyrefly>=1.4.0",
  "pytest>=8.4",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.2",
]
# The checks that need a newer Python only to check, not to run: copied code, and how well the tests
# catch faults, as N7 of plugins/rn/domain/best-practices/code/best-practice.md says.
test-quality = [
  "cosmic-ray>=8.8.0",
  "coverage>=7.17.2",
  "hypothesis>=6.170.15",
  "pylint>=4.1.3",
]

[tool.uv]
required-version = ">=0.13.5"
# The repository is plugins, not a package to build.
package = false

[tool.uv.dependency-groups]
test-quality = { requires-python = ">=3.11" }

[tool.ruff]
# The widest a line may be: of the Python, which E501 below checks, and of the documents, which no
# check reads.
line-length = 100

[tool.ruff.lint]
# The rules ruff checks by default, and lines past that width.
extend-select = ["E501"]

[tool.pyrefly]
# requires-python's oldest, as pyrefly doesn't read it there.
python-version = "3.9"

[tool.pytest.ini_options]
# unittest's own pattern, which the names of the tests follow.
python_files = ["test*.py"]
norecursedirs = [".*", "__pycache__", "node_modules"]
addopts = ["-p", "no:cacheprovider"]

# How much of Lane's code the tests run, as N7 of
# plugins/rn/domain/best-practices/code/best-practice.md says: every line and branch. The tests
# run Lane's code where lay.py write lays it into a plugin, so the copies count as the source.
[tool.coverage.run]
branch = true
parallel = true
include = ["*/hooks/lane/*", "*/plugins/lane/scripts/*"]

[tool.coverage.paths]
lane = ["plugins/lane/hooks/lane/", "*/hooks/lane/"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# A script runs only as `__main__`, so its other branch never runs.
partial_also = ["if __name__ == .__main__.:"]
