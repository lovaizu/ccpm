# The tools that build and check the plugins, set up by `uv sync --locked` from uv.lock, which holds
# each at the version and hashes it was locked with. Nothing here is installed by the plugins' users.
[project]
name = "ccpm"
version = "0"
# The oldest Python users run, as python3 is wherever git is and a plugin installs no package, which
# ruff takes as the version it checks for.
requires-python = ">=3.9"

[dependency-groups]
# The checks of dev/scripts/check.sh, on every Python users run.
dev = [
  "coverage>=7.10",
  "pyrefly>=1.4.0",
  "pytest>=8.4",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.2",
]
# The check for copied code, the property-based tests and the mutation testing, which need a newer
# Python only to check, not to run.
test-quality = [
  "cosmic-ray>=8.7.0",
  "hypothesis>=6.170.9",
  "pylint>=4.1.3",
]

# The choice of the tests a change reaches before a push, which needs a newer Python only to choose
# them; without it the push runs every test.
push = [
  "pytest-testmon>=2.3.0",
]

[tool.uv]
required-version = ">=0.13.5"
# The repository is plugins, not a package to build.
package = false

[tool.uv.dependency-groups]
test-quality = { requires-python = ">=3.11" }
push = { requires-python = ">=3.11" }

[tool.ruff]
# The widest a line may be: of the Python, which E501 below checks, and of the documents, which no
# check reads.
line-length = 100

[tool.ruff.lint]
# The rules ruff checks by default, and lines past that width.
extend-select = ["E501"]

[tool.pyrefly]
# requires-python's oldest, as pyrefly does not read it there.
python-version = "3.9"

[tool.pytest.ini_options]
# unittest's own pattern, which the tests are named by; the repository a product vision trial
# works in, with tests of its own, is left out.
python_files = ["test*.py"]
norecursedirs = [".*", "__pycache__", "node_modules", "tidy"]
addopts = ["-p", "no:cacheprovider"]
