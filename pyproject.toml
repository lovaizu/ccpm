# The tools that build and check the plugins, set up by `uv sync --locked` from uv.lock, which holds
# each at the version and hashes of its lock. The plugins' users install nothing here.
[project]
name = "ccpm"
version = "0"
# The oldest Python that users run, as Python 3.9 and the standard library of
# dev/plugin-development-guide.md says, which ruff takes as the version it checks for.
requires-python = ">=3.9"

[dependency-groups]
# The checks of dev/scripts/check.sh, on every Python users run.
dev = [
  "pyrefly>=1.4.0",
  "pytest>=8.4",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.2",
  "vulture>=2.14",
]
# The checks that need a newer Python only to check, not to run: copied code, how deep each function
# nests, and which lines the tests run.
test-quality = [
  "complexipy>=9.0.0",
  "coverage>=7.17.2",
  "pylint>=4.1.3",
]

[tool.uv]
required-version = ">=0.13.5"
# The repository is plugins, not a package to build.
package = false

[tool.uv.dependency-groups]
test-quality = { requires-python = ">=3.11" }

[tool.ruff]
# The widest a line may be: of the Python, which E501 below checks, and of the documents, which no
# check reads.
line-length = 100

[tool.ruff.lint]
# The rules ruff checks by default, lines past that width, and a function with more paths, returns,
# branches, parameters, or statements than its maintainer can follow in one reading, each a sign
# of a function that does more than one thing, as N5 of
# plugins/rn/domain/best-practices/refactor-code/best-practice.json asks.
extend-select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-args = 5
max-statements = 50

# The code that nothing uses, which check.sh finds by vulture: a name that no file reads. A name
# that only a library reads stays out, as vulture sees no read of it: a fixture of pytest, and
# shlex's whitespace_split. So does the sample product that the tests make a run in, whose code
# the tests only hold as files.
[tool.vulture]
paths = ["plugins", "dev/scripts", "dev/rn/tests"]
exclude = ["dev/scripts/node_modules/", "dev/rn/tests/invoicer/"]
ignore_decorators = ["@pytest.fixture"]
ignore_names = ["whitespace_split"]
min_confidence = 60

# The most cognitive complexity that complexipy, which check.sh runs, lets a function have.
[tool.complexipy]
max-complexity-allowed = 15

[tool.pyrefly]
# requires-python's oldest, as pyrefly doesn't read it there.
python-version = "3.9"

[tool.pytest.ini_options]
# unittest's own pattern, which the names of the tests follow.
python_files = ["test*.py"]
# Each plugin's tests lie under dev/, as pytest finds them.
testpaths = ["dev"]
norecursedirs = [".*", "__pycache__", "node_modules"]
addopts = ["-p", "no:cacheprovider"]

# How much of the plugins' code the tests run, as N7 of
# plugins/rn/domain/best-practices/code/best-practice.json says: every line and branch.
[tool.coverage.run]
branch = true
parallel = true
include = [
  "*/plugins/*/*.py",
  "*/plugins/**/*.py",
  ]
# overnight's tests run resume and wait.py as processes of their own, and wait.py becomes claude
# before coverage keeps what it ran, so coverage starts in each process and keeps its data first.
patch = ["subprocess", "execv"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# A script runs only as `__main__`, so its other branch never runs.
partial_also = ["if __name__ == .__main__.:"]
