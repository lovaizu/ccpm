# The settings of ccpm's own checks, which lefthook.yml of lovaizu/repofiles extends.
# Turned on once in a clone by `lefthook install`.

# ccpm holds no Japanese, so the Japanese check is off. A template's links
# are slots that a writer fills, so the links check leaves the templates out.
pre-commit:
  jobs:
    - name: japanese
      skip: true
    - name: links
      exclude:
        - "plugins/rn/domain/best-practices/*/template.md"

# The checks of dev/scripts/check.sh, once before each push, in the working tree. git gives a hook
# the repository it runs for, such as GIT_DIR, which the git repositories the tests make would take
# as theirs, so the hook unsets it. dev/README.md describes the checks.
pre-push:
  jobs:
    - name: check
      run: unset $(git rev-parse --local-env-vars); uv run --locked --group test-quality sh dev/scripts/check.sh
