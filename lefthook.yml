# The checks of ccpm's own clone. The prose checks that lovaizu repositories
# share come from lovaizu/checks, before each commit and on its message; the
# workflow Tests runs them on each push, at the commit of the same tag.
# Turned on once in a clone by `lefthook install`.
remotes:
  - git_url: https://github.com/lovaizu/checks
    ref: v0.1.4
    configs:
      - hooks.yml

# Lane's and rn's code and tests, and Lane's pages on its lanes and routes,
# which their code deliverables make anew, as the design tree says. Mending
# the prose of files that go is work lost.
pre-commit:
  exclude:
    - "plugins/lane/hooks**"
    - "plugins/lane/scripts**"
    - "dev/lane/tests**"
    - "dev/lane/trials**"
    - "dev/lane/testing.py"
    - "dev/lane/cosmic-ray.toml"
    - "plugins/lane/docs**"
    - "plugins/rn/hooks**"
    - "plugins/rn/scripts**"
    - "dev/rn/tests**"
    - "plugins/rn/domain/[a-z]*.py"
    - "dev/rn/cosmic-ray.toml"
    # Files no one here writes: the lockfiles their tools write, and the
    # licenses as their authors wrote them.
    - "uv.lock"
    - "dev/scripts/package-lock.json"
    - "LICENSE"
    - "plugins/rn/LICENSE-grilling"
    # The checks read an SVG file as plain text, its style and all, until
    # lovaizu/checks#9 reads only the text that a figure shows.
    - "**.svg"
    # The patterns of Vale's own settings are regular expressions.
    - ".vale.ini"
    # Vale lints the front matter of Markdown, the scope text.frontmatter, which lovaizu/checks
    # doesn't ignore yet, so the skill's allowed-tools fail on their parentheses.
    - "plugins/rn/skills/up/*.md"

# The checks of what a push changes, on the commits pushed, which git gives
# the hook on its standard input; dev/README.md says what they are.
pre-push:
  jobs:
    - name: check
      run: sh dev/scripts/pre-push.sh
      use_stdin: true
