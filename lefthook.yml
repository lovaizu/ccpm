# The checks of ccpm's own clone. The prose checks that lovaizu repositories
# share come from lovaizu/checks. They run before each commit and on its
# message. The workflow Tests runs them on each push, at the commit of the same
# tag.
# Turned on once in a clone by `lefthook install`.
remotes:
  - git_url: https://github.com/lovaizu/checks
    ref: v0.1.6
    configs:
      - hooks.yml

# Lane's and rn's code and tests, and Lane's pages on its lanes and routes,
# which their code deliverables make anew, as the design tree says. Mending
# the prose of files that go is work lost.
pre-commit:
  exclude:
    - "dev/lane/trials**"
    - "dev/lane/testing.py"
    - "dev/lane/cosmic-ray.toml"
    - "plugins/lane/docs**"
    - "plugins/rn/hooks**"
    - "plugins/rn/scripts**"
    - "dev/rn/tests**"
    - "plugins/rn/domain/[a-z]*.py"
    - "dev/rn/cosmic-ray.toml"
    # Files no one here writes: the lockfiles their tools write, and the
    # licenses as their authors wrote them.
    - "uv.lock"
    - "dev/scripts/package-lock.json"
    - "LICENSE"
    - "plugins/rn/LICENSE-grilling"

# The checks of what a push changes, on the commits pushed, which git gives
# the hook on its standard input. dev/README.md describes them.
pre-push:
  jobs:
    - name: check
      run: sh dev/scripts/pre-push.sh
      use_stdin: true
