# The checks of ccpm's own clone. The prose checks that lovaizu repositories
# share come from lovaizu/checks, before each commit and on its message; the
# workflow Tests runs them on each push, at the commit of the same tag.
# Turned on once in a clone by `lefthook install`.
remotes:
  - git_url: https://github.com/lovaizu/checks
    ref: v0.1.3
    configs:
      - hooks.yml

# The files written before the check, each taken off the list when its
# deliverable is made again.
pre-commit:
  exclude:
    - ".claude-plugin/marketplace.json"
    - ".claude/rules/dev.md"
