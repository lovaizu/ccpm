# The English check of lovaizu/checks, as its own .vale.ini sets it, with
# ccpm's vocabulary. A path names a file, and FULL, HAPPY and SMOKE name the
# coverage that the architecture best practice defines, so neither reads as
# prose. A path may hold <name> and {name}, but not $, as Vale misreads the
# code spans after a token that begins with ${.
StylesPath = .vale/styles
Vocab = ccpm
MinAlertLevel = suggestion

[*]
BasedOnStyles = Google
TokenIgnores = ([\w.*{}<>-]*/[\w./*{}<>-]+), \b(?:FULL|HAPPY|SMOKE)\b
