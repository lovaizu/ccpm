# Vale's check of the repository's Markdown, run by dev/prose.sh: the Google developer
# documentation style, which dev/vale.sh installs, and ccpm's own words in dev/vale/styles/
# (config/vocabularies/ccpm/ for the terms the documents may use, ccpm/ for the words to replace).
StylesPath = dev/vale/styles
Vocab = ccpm
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, Google, ccpm
# The repository writes words out in full, which reads no harder than a contraction.
Google.Contractions = NO
# A spaced dash is the CHANGELOG's line form, `<what changed> — <why it helps the user>`
# (dev/architecture.md, The CHANGELOG's form).
Google.EmDash = NO
# It flags every parenthesis, and here they hold a reference or a short gloss, such as
# "(Principle 5)" or a command's meaning, that the reader needs beside the word.
Google.Parens = NO
# The documents write a list without the comma before its last item, and the rule also takes
# clauses such as ", decided and made." for a list.
Google.OxfordComma = NO
# Commas and periods inside the quotes would change quoted code and quoted words.
Google.Quotes = NO
# It flags the heading form of a checklist's questions, "Q-1: Whether ...".
Google.Headings = NO
# It flags labels such as "G1: The building AI ...", where a capital after the colon is right.
Google.Colons = NO
# The user stories are written as their user says them: "As the user, I want ...".
Google.FirstPerson = NO
# These documents tell of AI agents and scripts, which do tell and ask.
Google.Anthropomorphism = NO
# "will" says what happens later in a run, such as what rn will do next, which the present tense
# would say wrongly.
Google.Will = NO
# Every finding was "as soon as" or "latest" of a git branch, neither of which dates a document.
Google.Timeless = NO
# Its words are for user interfaces: "above" here is the folders above one, not a place on a page.
Google.WordListCase = NO

# The files that held findings of these rules when the check came in (#63), each to come off this
# list once rewritten with its findings fixed, as #61 rewrites most of them; a file not listed, new
# or rewritten, is held to them.
[{.claude/rules/dev.md,.claude/rules/final-check.md,.claude/rules/issue.md,.claude/rules/output.md,README.md,dev/README.md,dev/architecture.md,dev/lane/README.md,dev/lane/architecture.md,dev/lane/trials/memo/agents/reviewer.md,dev/lane/trials/memo/agents/runner.md,dev/lane/trials/memo/agents/writer.md,dev/lane/trials/memo/skills/make/SKILL.md,dev/lane/trials/notes/skills/changelog/SKILL.md,dev/lane/ux.md,dev/rn/README.md,dev/rn/architecture.md,dev/rn/trials/acceptance/user.md,dev/rn/trials/moves/up.md,dev/rn/ux.md,dev/turn/README.md,dev/turn/architecture.md,dev/turn/trials/one/notes/hello.decisions.md,dev/turn/trials/orchestrator/roles/first-user.md,dev/turn/trials/orchestrator/roles/generator.md,dev/turn/trials/readme/notes/readme.decisions.md,dev/turn/ux.md,plugins/lane/CHANGELOG.md,plugins/lane/README.md,plugins/lane/docs/lanes.md,plugins/rn/CHANGELOG.md,plugins/rn/README.md,plugins/rn/prompts/approval.md,plugins/rn/prompts/architecture.md,plugins/rn/prompts/feedback.md,plugins/rn/prompts/goal.md,plugins/rn/prompts/learnings.md,plugins/rn/prompts/messages.md,plugins/rn/prompts/orchestrator.md,plugins/rn/prompts/ux.md,plugins/rn/skills/gm/SKILL.md,plugins/rn/skills/ty/SKILL.md,plugins/rn/skills/up/SKILL.md,plugins/turn/CHANGELOG.md,plugins/turn/README.md,plugins/turn/agents/first-user.md,plugins/turn/agents/generator.md,plugins/turn/agents/up.md,plugins/turn/docs/calling.md,plugins/turn/prompts/first-user.md,plugins/turn/prompts/generator.md,plugins/turn/prompts/orchestrator.md}]
