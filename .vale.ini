# What ccpm changes of the English check of lovaizu/repofiles, which lays this file over its own:
# ccpm's vocabulary, and the tokens that don't read as prose. A path names a file, and FULL, HAPPY
# and SMOKE name the coverage that the architecture best practice defines. A path may hold <name>
# and {name}, but not $, as Vale misreads the code spans after a token that begins with ${.
StylesPath = .vale/styles
Vocab = ccpm

[*]
TokenIgnores = ([\w.*{}<>-]*/[\w./*{}<>-]+), \b(?:FULL|HAPPY|SMOKE)\b
